<html lang="fr"><head><meta charset="utf-8">

<style>:root{
    --fond:#0d0e12; --carte:#15171d; --bord:#242731; --or:#ffd24a;
    --texte:#e8e9ee; --pale:#8b8fa0; --vert:#4ade80;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:2rem 1rem 6rem;background:var(--fond);color:var(--texte);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .page{max-width:56rem;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 .3rem}
  .sous{color:var(--pale);margin:0 0 2rem;font-size:.9rem}
  .barre{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem}
  .puce{font-size:.72rem;padding:.25rem .6rem;border-radius:999px;
        border:1px solid var(--bord);background:var(--carte);color:var(--pale)}

  .q{background:var(--carte);border:1px solid var(--bord);border-radius:.8rem;
     padding:1.1rem 1.2rem;margin-bottom:1.2rem;position:relative}
  .q.fait{opacity:.42}
  .tete{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
  .num{font-weight:700;color:var(--or);font-size:1.05rem}
  .diff{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
        padding:.2rem .55rem;border-radius:.3rem;font-weight:700}
  .veryeasy{background:rgba(0,255,136,.15);color:#00ff88}
  .easy{background:rgba(0,200,255,.15);color:#00c8ff}
  .medium{background:rgba(255,200,0,.15);color:#ffc800}
  .hard{background:rgba(255,100,0,.15);color:#ff6400}
  .veryhard{background:rgba(255,50,50,.15);color:#ff3232}
  .extreme{background:rgba(190,80,255,.18);color:#c77dff}
  .coche{margin-left:auto;display:flex;align-items:center;gap:.4rem;
         color:var(--pale);font-size:.78rem;cursor:pointer;user-select:none}

  .champ{display:grid;grid-template-columns:7.5rem 1fr auto;gap:.5rem;
         align-items:start;padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .champ:last-of-type{border-bottom:0}
  .etiq{color:var(--pale);font-size:.78rem;padding-top:.15rem}
  .val{word-break:break-word}
  .val.url{font-size:.8rem;color:#7aa7ff}

  .reps{margin-top:.8rem;border-top:1px solid var(--bord);padding-top:.7rem}
  .rep{display:grid;grid-template-columns:1.4rem 1fr auto;gap:.5rem;
       align-items:center;padding:.22rem 0}
  .rep .i{color:var(--pale);font-size:.8rem;text-align:right}
  .rep.bonne .t{color:var(--vert);font-weight:600}
  .rep.bonne .i{color:var(--vert);font-weight:700}

  button.c{background:transparent;border:1px solid var(--bord);color:var(--pale);
           border-radius:.35rem;font-size:.68rem;padding:.18rem .5rem;cursor:pointer;
           white-space:nowrap;transition:all .15s}
  button.c:hover{border-color:var(--or);color:var(--or)}
  button.c.ok{border-color:var(--vert);color:var(--vert)}

  .src{margin-top:.9rem;padding:.6rem .8rem;background:rgba(255,255,255,.028);
       border-left:2px solid var(--bord);border-radius:0 .3rem .3rem 0;
       font-size:.8rem;color:var(--pale);font-style:italic}
  .note{margin-top:.5rem;padding:.6rem .8rem;background:rgba(255,210,74,.06);
        border-left:2px solid rgba(255,210,74,.4);border-radius:0 .3rem .3rem 0;
        font-size:.8rem;color:#d8c48a;font-style:normal}
  .note b{color:var(--or)}
  .grappe{font-size:.68rem;color:var(--pale);text-transform:uppercase;letter-spacing:.05em}
  .filtres{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.6rem}
  button.f{background:var(--carte);border:1px solid var(--bord);color:var(--pale);
           border-radius:999px;font-size:.75rem;padding:.3rem .8rem;cursor:pointer;transition:all .15s}
  button.f:hover{border-color:var(--or);color:var(--or)}
  button.f.actif{border-color:var(--or);color:var(--fond);background:var(--or);font-weight:600}
  .puce.veryeasy{color:#00ff88}.puce.easy{color:#00c8ff}.puce.medium{color:#ffc800}
  .puce.hard{color:#ff6400}.puce.veryhard{color:#ff3232}.puce.extreme{color:#c77dff}
</style></head><body>

Society."},{"g":"Zanpakutô","d":"veryhard","t":"Avec quelle partie de son sabre un Shinigami pratique-t-il le Konsō ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Zanpakut%C3%B4","b":1,"r":["L'extrémité de la garde","La pointe de la lame","Le tranchant","Le pommeau","Le fourreau","Le plat de la lame"],"src":"Il lui suffit de légèrement toucher le front d'une âme (un Plus) avec l'extrémité de la garde de son épée pour instantanément l'envoyer à Soul Society."},{"g":"Zanpakutô","d":"veryhard","t":"Quelle pratique est nécessaire pour qu'un Zanpakutô révèle son nom ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Zanpakut%C3%B4","b":1,"r":["Le Jinzen","Le Konsō","Le Hakuda","Le Kidô de liaison","La méditation du Hōgyoku","Le Zanjutsu"],"src":"obtenu après que le Zanpakutō ait révélé volontairement son nom, pratiquer le Jinzen est donc nécessaire pour obtenir cette première transformation."},{"g":"Zanpakutô","d":"extreme","t":"Sous quel nom le Bankai était-il connu avant qu'Ichibei Hyōsube ne le rebaptise ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Bankai","b":1,"r":["Shin'Uchi","Shin'Kai","Zen'Kai","Ô'Kai","Kyokugen","Saigo no Kai"],"src":"Avant que ce soit nommé ainsi par Ichibei Hyōsube, cette technique était connue sous le nom de Shin'Uchi (真打, Vraie Frappe)."},{"g":"Zanpakutô","d":"hard","t":"Combien de fois un Bankai est-il plus puissant qu'un Shikai ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Zanpakut%C3%B4","b":1,"r":["Cinq à dix fois","Deux à trois fois","Vingt fois","Cent fois","Exactement dix fois","Cela ne se mesure pas"],"src":"Un Bankai peut être cinq à dix fois plus puissant que le Shikai."},{"g":"Zanpakutô","d":"veryhard","t":"Qu'est-ce qui caractérise physiquement la plupart des Bankai ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Zanpakut%C3%B4","b":1,"r":["Le gigantisme","Le changement de couleur de la lame","La duplication de l'arme","La disparition du sabre","Une aura noire","Un changement de tenue"],"src":"de part l'incroyable puissance requise pour l'utiliser, les Bankai seront généralement immenses. Le Bankai d'Ichigo est une exception, ce qu'a relevé Byakuya Kuchiki."},{"g":"Zanpakutô","d":"hard","t":"Qui relève que le Bankai d'Ichigo fait exception à la règle du gigantisme ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Zanpakut%C3%B4","b":1,"r":["Byakuya Kuchiki","Kenpachi Zaraki","Rukia Kuchiki","Kisuke Urahara","Yoruichi Shihôin","Renji Abarai"],"src":"Le Bankai d'Ichigo est une exception, ce qu'a relevé Byakuya Kuchiki."},{"g":"Zanpakutô","d":"extreme","t":"D'après Tite Kubo, quels sont les deux seuls Zanpakutô à faire exception à la règle lame + fourreau ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["Sayafushi et Zangetsu","Zangetsu et Senbonzakura","Sayafushi et Kyōka Suigetsu","Zangetsu et Ryûjin Jakka","Sayafushi et Hyôrinmaru","Zangetsu et Nozarashi"],"src":"Tout les Zanpakuto sont composés de la lame et du fourreau, les deux seules exceptions étant Sayafushi et Zangetsu."},{"g":"Zanpakutô","d":"extreme","t":"Que Yhwach a-t-il réellement détruit en brisant Tensa Zangetsu lors de l'assaut final ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["Seulement le fourreau, révélant le véritable Zangetsu","La lame, laissant le fourreau intact","Les deux, définitivement","Une simple illusion","Le Zanpakutô Hollow d'Ichigo","Rien du tout"],"src":"lors de l'assaut final, Yhwach, en tentant de briser Tensa Zangetsu, n'a détruit que le fourreau, révélant le « véritable Zangetsu » se trouvant à l'intérieur."},{"g":"Zanpakutô","d":"extreme","t":"À quelle place le Zanpakutô d'Ichigo a-t-il été élu dans un sondage du Zanpakutô le plus populaire ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["3e","1er","2e","5e","10e","7e"],"src":"Zangetsu, le Zanpakutō d'Ichigo, a été voté 3e place dans un sondage du plus populaire Zanpakutō, tandis que son Bankai, Tensa Zangetsu, a été placé en 10e place."},{"g":"Hollows & Arrancars","d":"medium","t":"Pourquoi une âme se transforme-t-elle en Hollow ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Hollow","b":1,"r":["Elle n'est pas partie à la Soul Society après sa mort","Elle a commis un crime de son vivant","Elle a été dévorée par un autre Hollow","Un Shinigami l'a mal purifiée","Elle a refusé le Konsō","Elle est morte violemment"],"src":"Les Hollows sont des âmes humaines (ou animales) qui, pour diverses raisons, ne sont pas parties à la Soul Society après leur mort."},{"g":"Hollows & Arrancars","d":"hard","t":"Quels Hollows finissent en Enfer plutôt qu'à la Soul Society ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Hollow","b":1,"r":["Ceux qui avaient déjà commis le mal de leur vivant","Ceux qui ont dévoré le plus d'âmes","Ceux qui refusent d'être purifiés","Les Menos Grande uniquement","Ceux tués par un Arrancar","Tous, sans exception"],"src":"Ils ne vont pas tous aux Enfers : seuls les Hollows ayant déjà commis le mal de leur vivant (et donc avant la transformation en Hollow) y vont."},{"g":"Hollows & Arrancars","d":"medium","t":"Comment s'appelle la peau durcie qui protège tous les Arrancars ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Arrancar","b":1,"r":["Le Hierro","Le Hierno","Le Blut","Le Hakuda","Le Sonido","Le Pesquisa"],"src":"Les arrancar possèdent tous le Hierro (peau de métal), leur conférant une plus grande résistance aux coups."},{"g":"Hollows & Arrancars","d":"veryhard","t":"Quel Espada s'autoproclame possesseur du Hierro le plus résistant de Las Noches ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Arrancar","b":1,"r":["Nnoitra Gilga","Yammy Riyalgo","Grimmjow","Baraggan","Ulquiorra","Zommari"],"src":"N'Noitora Jirga s'autoproclame le possesseur du Hierro le plus résistant de tout Las Noches."},{"g":"Hollows & Arrancars","d":"hard","t":"Quelle technique arrancar est vingt fois plus rapide que le Cero, mais moins puissante ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Arrancar","b":1,"r":["La Bala","Le Gran Rey Cero","Le Cero Oscuras","Le Gonzui","Le Pesquisa","Le Sonido"],"src":"Alors, ils ont également créé le bala (balle de cero), une technique vingt fois plus rapide que le cero, bien que moins puissante."},{"g":"Hollows & Arrancars","d":"hard","t":"Quel est l'équivalent arrancar du Shunpo des Shinigamis ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Arrancar","b":1,"r":["Le Sonido","Le Hirenkyaku","Le Garganta","Le Pesquisa","La Bala","Le Hierro"],"src":"Leur technique de déplacement est le sonido (mouvement de l'écho), l'équivalent arrancar du shunpo."},{"g":"Hollows & Arrancars","d":"veryhard","t":"Quelle technique permet à un Arrancar de localiser ses ennemis ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Arrancar","b":1,"r":["Le Pesquisa","Le Gonzui","Le Sonido","Le Reiraku","Le Blut Vene","Le Garganta"],"src":"Ils disposent également du Pesquisa (nerfs de recherche) qui leur permettent de localiser d'éventuels ennemis."},{"g":"Hollows & Arrancars","d":"extreme","t":"À quoi sert le Gonzui, technique peu employée des Arrancars ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Arrancar","b":1,"r":["Absorber une grande quantité d'âmes d'un seul coup","Effacer la mémoire d'un adversaire","Se soigner instantanément","Traverser les dimensions","Multiplier son reiatsu","Détecter les Shinigamis à distance"],"src":"Une autre technique, beaucoup moins utilisée, est le gonzui (littéralement aspirateur d'âmes) qui permet à son utilisateur d'absorber une grande quantité d'âmes en un seul coup."},{"g":"Hollows & Arrancars","d":"hard","t":"Comment un Arrancar passe-t-il du Hueco Mundo au monde des humains ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Arrancar","b":1,"r":["Par le Garganta","Par le Senkaimon","Par le Dangai","Par la Negación","Par le Sonido","Par le Shunpo"],"src":"Pour se déplacer du Hueco Mundo au monde des humains les arrancar utilisent le garganta."},{"g":"Hollows & Arrancars","d":"veryhard","t":"D'où provient la lame d'un Zanpakutô d'Arrancar, à la différence de celle d'un Shinigami ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Arrancar","b":1,"r":["De la concentration de leur pouvoir de Hollow d'avant leur transformation","De l'âme d'un Shinigami vaincu","Du Hōgyoku d'Aizen","D'un fragment de leur masque","De la forge d'Ôetsu Nimaiya","De leur trou de Hollow"],"src":"la lame des arrancar est une concentration du pouvoir de Hollow qu'ils disposaient avant leur transformation."},{"g":"L'Espada","d":"easy","t":"Combien de membres compte l'Espada ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["Dix","Treize","Neuf","Douze","Huit","Onze"],"src":"L'Espada (十刃, Esupāda ; espagnol pour « Épée », japonais pour « 10 Lames ») désigne les 10 Arrancars les plus puissants."},{"g":"L'Espada","d":"hard","t":"Qui régnait sur le Hueco Mundo avant l'arrivée d'Aizen ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["Baraggan Luisenbarn","Coyote Stark","Tier Halibel","Yammy Riyalgo","Ulquiorra Cifer","Nnoitra Gilga"],"src":"Les 3 Capitaines rencontrèrent Baraggan, le Roi du Hueco Mundo et seigneur de Las Noches."},{"g":"L'Espada","d":"veryhard","t":"Quels deux lieutenants accompagnaient Aizen lors de son premier voyage au Hueco Mundo ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["Ichimaru et Tōsen","Ichimaru et Hinamori","Tōsen et Hisagi","Ichimaru et Kira","Tōsen et Komamura","Hinamori et Kira"],"src":"Aizen voyagea au Hueco Mundo, accompagné de ses deux lieutenants, Ichimaru et Tōsen."},{"g":"L'Espada","d":"veryhard","t":"Comment Aizen a-t-il convaincu Baraggan de le suivre ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["En lui montrant, par illusion, que son armée était déjà décimée","En le battant en duel singulier","En lui offrant le Hōgyoku","En tuant sa Fracción sous ses yeux","En lui promettant la Soul Society","En le menaçant du Gotei 13"],"src":"Baraggan va ordonner à son armée de les tuer mais l'illusion de Kyōka Suigetsu se brise et révèle que les Shinigamis ont décimé l'armée de Baraggan."},{"g":"L'Espada","d":"hard","t":"Comment Aizen a-t-il transformé les Hollows en Arrancars ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["En leur donnant des pouvoirs de Shinigami","En brisant leur masque à la main","En les faisant dévorer entre eux","En les exposant au Reishi du Seireitei","En leur greffant un Zanpakutô","En les purifiant à moitié"],"src":"En leur donnant des pouvoirs de Shinigami, il transforma les Hollows en Arrancars."},{"g":"L'Espada","d":"veryhard","t":"Quel rang Nnoitra Gilga occupait-il avant, quand Nelliel était encore 3e Espada ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["8e","5e","6e","9e","4e","10e"],"src":"À une période donnée, Nnoitra Gilga n'était que le 8e Espada quand Nelliel était encore dans leurs rangs en tant que 3e Espada."},{"g":"L'Espada","d":"extreme","t":"À quoi sert la Caja Negación remise à chaque Espada ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["À punir un subordonné en l'envoyant dans une autre dimension","À amplifier son Cero","À soigner ses blessures","À dissimuler son reiatsu","À invoquer sa Fracción","À briser le Hierro d'un rival"],"src":"Prenant la forme d'un petit cube d'énergie, il s'insère dans le trou de Hollow d'un Arrancar ; ce qui a pour conséquence de l'envoyer dans une autre dimension. Cet objet a été donné à chacun des Espadas afin de punir leurs subordonnés."},{"g":"L'Espada","d":"extreme","t":"Qu'un Espada mélange-t-il à son Cero pour produire un Gran Rey Cero ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["Son sang","Son masque brisé","Le reiatsu d'un Shinigami","Sa propre âme","De l'énergie du Hōgyoku","Rien, c'est une question de concentration"],"src":"Il s'agit d'une version améliorée du Cero, que seuls les Espadas peuvent maîtriser. Pour l'utiliser, ils mélangent leur sang à leur Cero."},{"g":"L'Espada","d":"extreme","t":"Pourquoi le Gran Rey Cero est-il interdit sous le dôme de Las Noches ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["Il détruirait la forteresse","Il attirerait les Shinigamis","Il réveillerait Baraggan","Il consommerait tout le Reishi du lieu","Aizen l'a interdit sans raison","Il rendrait l'Espada stérile"],"src":"Il est interdit aux Espadas d'utiliser cette technique sous le dôme de Las Noches, sous peine de détruire la forteresse."},{"g":"L'Espada","d":"extreme","t":"Quand un Espada peut-il utiliser le Cero Oscuras ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["Uniquement pendant sa Resurrección","Uniquement au Hueco Mundo","Uniquement la nuit","Uniquement avec l'accord d'Aizen","À tout moment","Uniquement une fois par combat"],"src":"Il s'agit d'une version améliorée du Cero, que les Espadas peuvent utiliser que pendant leur Resurrección."},{"g":"L'Espada","d":"veryhard","t":"Quel est l'aspect de la mort de Coyote Stark ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["La solitude","La rage","La destruction","Le désespoir","Le vide","Le sacrifice"],"src":"Coyote Stark, la Primera Espada. Son aspect de la mort est la solitude."},{"g":"L'Espada","d":"extreme","t":"Pourquoi Coyote Stark a-t-il scindé son âme en deux ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["Pour échapper à la solitude, son reiatsu tuant tous ceux qui l'approchaient","Pour survivre à une blessure mortelle","Pour doubler sa puissance","Sur ordre d'Aizen","Pour tromper le Gotei 13","Pour créer une Fracción"],"src":"C'est justement cette trop grande puissance qui l'empêcha de se faire des camarades, tuant tous les Hollows qui s'approchaient de lui. Désespéré, il scinda son âme en deux afin d'échapper à la solitude. De cette âme naquit Coyote Stark et Lilynette Gingerback."},{"g":"L'Espada","d":"extreme","t":"Quel est l'aspect de la mort de Yammy Riyalgo ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["La rage","La solitude","La gloutonnerie","La destruction","La folie","La lamentation"],"src":"Yammy Riyalgo, l'Espada Cero. Son aspect de la mort est la rage."},{"g":"L'Espada","d":"extreme","t":"Quel numéro Yammy porte-t-il tant qu'il n'est pas sous sa forme libérée ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["10","0","1","9","11","Aucun"],"src":"Lorsqu'il n'est pas sous sa forme libérée, Yammy porte le numéro 10.","n":"C'est sa Resurrección qui le fait passer de 10 à 0 — l'Espada Cero."},{"g":"L'Espada","d":"extreme","t":"Quelle erreur l'animé commet-il quand Shawlong Qu Fang décrit l'Espada ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["Onze silhouettes sont montrées au lieu de dix","Il en cite douze","Il oublie l'Espada Cero","Il inverse Stark et Baraggan","Il montre Nelliel parmi eux","Il n'y a aucune erreur"],"src":"Dans l'animé, quand Shawlong Qu Fang décrit l'Espada, onze silhouettes sont montrées à l'écran, alors que dans le manga, on en voit bien dix."},{"g":"L'Espada","d":"extreme","t":"Quel Arrancar, sans être un Espada, est classé à leur niveau par la Soul Society ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Espada","b":1,"r":["Wonderwice Margela","Loly Aivirrne","Tesla Lindocruz","Ayon","Rudbornn Chelute","Dordoni"],"src":"Bien qu'il ne soit pas un Espada, Wonderwice Margela est classifié comme un Arrancar ayant leur niveau par la Soul Society."},{"g":"Les Quincys","d":"medium","t":"Que signifie le mot « Quincy » en japonais ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Maître de l'Annihilation","Archer des âmes","Chasseur de vide","Enfant de la croix","Gardien du monde","Briseur de masques"],"src":"Les Quincys (Kuinshī ; japonais pour « Maître de l'Annihilation »)."},{"g":"Les Quincys","d":"hard","t":"Pourquoi la Soul Society a-t-elle exterminé les Quincys il y a plus de 200 ans ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Leur destruction massive de Hollows menaçait l'équilibre des mondes","Ils préparaient une invasion du Seireitei","Ils avaient volé le Hōgyoku","Ils refusaient de reconnaître le Roi Spirituel","Ils dévoraient les âmes","Ils avaient tué un Capitaine-Commandant"],"src":"La plupart des Quincys ont été exterminés par la Soul Society plus de 200 ans avant le début de l'histoire afin d'empêcher la destruction des mondes (causée par la disparition massive de Hollows)."},{"g":"Les Quincys","d":"extreme","t":"Quelle est la véritable raison pour laquelle les Quincys exterminent les Hollows ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Les Hollows leur sont toxiques : un simple contact met leur existence en danger","Une vieille rancune familiale","Un serment fait au Roi Spirituel","Pour absorber leur Reishi","Pour venger l'extermination de leur peuple","Par pure idéologie"],"src":"En réalité, les Quincys ne détestent pas les Hollows à cause d'une différence idéologique mais plutôt à cause du fait que ces derniers sont toxiques pour eux. N'ayant aucun anticorps capable de combattre les Hollows, un simple contact avec ceux-ci suffit à mettre leur existence en danger."},{"g":"Les Quincys","d":"veryhard","t":"Quelle croix Uryû Ishida utilise-t-il ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Une croix celtique","Un pentacle","Une croix à trois branches","Une rune à six branches","Une croix à cinq branches","Une croix latine"],"src":"Uryû se sert d'une croix celtique, Ryûken d'un pentacle, le Lichtreich avait pour symbole une croix à trois branches.","n":"Le pentacle, c'est celui de <b>Ryûken</b>, son père — cité dans la même phrase."},{"g":"Les Quincys","d":"extreme","t":"Combien de branches compte le Quincy Zeichen ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Cinq","Trois","Six","Quatre","Sept","Huit"],"src":"Quincy Zeichen : une croix à cinq branches qui apparaît dans plusieurs aspects de la culture Quincy et de leurs pouvoirs."},{"g":"Les Quincys","d":"extreme","t":"Que faut-il tracer au sol avec un Seele Schneider pour utiliser la technique Sprenger ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Un Quincy Zeichen","Un cercle de Reishi","Le nom de Yhwach","Une croix celtique","Un pentacle","Cinq Seele Schneider en étoile"],"src":"Pour utiliser la technique Sprenger, un Quincy Zeichen doit être tracé sur le sol avec Seele Schneider."},{"g":"Les Quincys","d":"veryhard","t":"Qu'est-ce qui distingue l'uniforme des Quincys de celui des Shinigamis ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Une tunique blanche ajustée à col haut","Une armure de Reishi","Une cape bleue","Un manteau noir à capuche","Un hakama blanc ample","Rien, ils s'habillent pareil"],"src":"Tandis que les Shinigamis portent un hakama noir et ample traditionnel, les Quincys portent quant à eux une tunique blanche et ajustée avec un col haut."},{"g":"Les Quincys","d":"extreme","t":"Que se passe-t-il quand un Quincy tue un Hollow, à la différence d'un Shinigami ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Il détruit intégralement son âme","Il l'envoie directement en Enfer","Il absorbe ses souvenirs","Il le renvoie au Hueco Mundo","Il le purifie plus vite","Il ne peut pas le tuer définitivement"],"src":"Lorsqu'ils tuent des Hollows, les Quincys détruisent intégralement leurs âmes, contrairement aux Shinigamis."},{"g":"Les Quincys","d":"extreme","t":"Quelles parties du Roi Spirituel se présentent elles-mêmes comme des Quincys ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Son bras gauche et son cœur","Sa tête et sa main droite","Ses deux bras","Son œil et son cœur","Sa jambe droite et son cœur","Aucune"],"src":"Pernida Parnkgjas et Gerard Valkyrie, respectivement le bras gauche et le cœur du Roi Spirituel, s'identifient tous deux comme des Quincys."},{"g":"Les Quincys","d":"extreme","t":"Pourquoi le Roi Spirituel a-t-il abandonné les Quincys ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Quincy","b":1,"r":["Il avait vu l'avenir funeste qui leur était réservé","Ils s'étaient révoltés contre lui","Ils refusaient de tuer les Hollows","Yhwach l'avait trahi","Ils avaient volé son pouvoir","Il ne les a jamais abandonnés"],"src":"l'abandon des Quincys par le Roi Spirituel, qui avait vu l'avenir funeste qui leur était réservé, a finalement mené les Quincys à résider dans le Monde des humains."},{"g":"Yhwach & le Vandenreich","d":"medium","t":"Quel titre correspond à la lettre « A » de Yhwach ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["The Almighty","The Antithesis","The Ancient","The Absolute","The Arrogant","The Ash"],"src":"En tant qu'Empereur du Vandenreich, il détient la lettre « A » pour le titre « The Almighty »."},{"g":"Yhwach & le Vandenreich","d":"hard","t":"De qui Yhwach est-il le fils ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Du Roi Spirituel","D'Ichibei Hyōsube","Du premier Quincy","De Yamamoto","D'un Vasto Lorde","On ne le sait pas"],"src":"Il est également le fils du Roi Spirituel Adnyeus."},{"g":"Yhwach & le Vandenreich","d":"veryhard","t":"Combien de temps après la défaite d'Aizen Yhwach déclare-t-il la guerre aux Shinigamis ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["19 mois","17 mois","2 ans","6 mois","1 an","3 ans"],"src":"il revint déclarer la guerre aux Shinigamis 19 mois après la défaite d'Aizen."},{"g":"Yhwach & le Vandenreich","d":"hard","t":"Combien de temps avant le début de l'histoire Yhwach avait-il échoué une première fois ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Mille ans","Deux cents ans","Cinq cents ans","Deux mille ans","Cent ans","Trois mille ans"],"src":"Après avoir échoué une première fois à conquérir la Soul Society, mille ans avant le début de l'histoire."},{"g":"Yhwach & le Vandenreich","d":"veryhard","t":"À quelle stratégie militaire réelle la tactique de guerre de Yhwach est-elle comparée ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["La Blitzkrieg","La guerre de tranchées","Le siège","La guérilla","La terre brûlée","L'encerclement de Cannes"],"src":"Sa stratégie de guerre conforte cette mentalité, ayant pour but de briser les forces ennemies au cœur du Seireitei le plus vite possible, ce qui n'est pas sans rappeler la méthode du Blitzkrieg."},{"g":"Yhwach & le Vandenreich","d":"extreme","t":"En combien de temps Yhwach a-t-il soumis tous les territoires Quincys, seul ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Moins de 200 ans","Moins de 50 ans","Moins de 500 ans","Moins de 20 ans","Moins de 1 000 ans","En une seule nuit"],"src":"Il a soumis tous les territoires Quincys en moins de 200 ans à lui seul."},{"g":"Yhwach & le Vandenreich","d":"veryhard","t":"Quel trait de caractère surprenant Yhwach possède-t-il envers ses hommes comme envers ses ennemis ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Il ne ment jamais","Il ne tue jamais lui-même","Il pardonne toujours une première trahison","Il refuse de frapper un adversaire désarmé","Il salue chaque adversaire avant le combat","Il ne parle jamais en public"],"src":"Il n'aime pas non plus les mensonges et ne ment jamais ni à ses hommes ni à ses ennemis. Il s'adresse donc à eux de manière sincère."},{"g":"Yhwach & le Vandenreich","d":"extreme","t":"Comment Yhwach décrivait-il Yamamoto, qu'il admirait ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Un impitoyable démon qui traitait ses subordonnés comme des cendres","Le seul Shinigami digne de son sang","Un vieux fou magnifique","Le plus grand obstacle de son existence","Un père de substitution","Un rival qu'il n'a jamais compris"],"src":"Il admirait particulièrement Yamamoto, qui était pour lui un impitoyable démon, qui traitait ses subordonnés comme des « cendres »."},{"g":"Yhwach & le Vandenreich","d":"veryhard","t":"Qu'arrive-t-il aux yeux de Yhwach quand The Almighty s'éveille ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Ses pupilles se multiplient","Ils deviennent entièrement noirs","Ils s'illuminent de bleu","Ils se ferment définitivement","Une croix y apparaît","Ils saignent"],"src":"Lorsque le pouvoir de The Almighty s'éveille, ses pupilles se multiplient."},{"g":"Yhwach & le Vandenreich","d":"extreme","t":"Quel objet de la tenue de Yhwach est en réalité sa croix Quincy ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Le gros bouton qui attache sa cape","Le col de son trench-coat","Sa boucle de ceinture","Ses boutons de manchettes","Le ruban rouge à son cou","Aucun, il n'en porte pas"],"src":"il porte une cape marron-noir qui est attachée par un gros bouton vers son épaule gauche. Ce gros bouton n'est d'ailleurs rien autre que sa croix Quincy."},{"g":"Yhwach & le Vandenreich","d":"extreme","t":"Quel pourcentage de la puissance de Yhwach Royd Lloyd pouvait-il copier ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Environ 80 %","Environ 50 %","Environ 100 %","Environ 30 %","Environ 95 %","Environ 60 %"],"src":"Royd Lloyd, dont la capacité lui a permis de copier l'apparence ainsi qu'environ 80% de la puissance du Roi Quincy, a pu vaincre Kenpachi Zaraki sans effort."},{"g":"Yhwach & le Vandenreich","d":"extreme","t":"Quel Zanpakutô Yhwach a-t-il dérobé à Yamamoto lors de la première invasion ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Zanka no Tachi","Ryûjin Jakka","Kyōka Suigetsu","Nozarashi","Ichimonji","Sayafushi"],"src":"Après lui avoir dérobé Zanka no Tachi au cours de la première invasion du Seireitei, Yhwach a tranché en deux Yamamoto en un seul coup."},{"g":"Yhwach & le Vandenreich","d":"extreme","t":"Comment Ôetsu Nimaiya s'adresse-t-il à Yhwach ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Y.H.","Votre Majesté","Le Père","Le vieux","Sa Sainteté","Le Roi"],"src":"Ōetsu Nimaiya s'adresse à lui en tant que Y.H. (ユーハー, Yūhā)."},{"g":"Yhwach & le Vandenreich","d":"extreme","t":"Yhwach est-il réellement le premier Quincy ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Non : des Quincys naissaient déjà avant lui, toutes les quelques décennies","Oui, il est le tout premier","Non, son père l'était avant lui","Oui, tous descendent directement de lui","Non, Uryû descend d'une lignée plus ancienne","La question n'est jamais tranchée"],"src":"Bien qu'Yhwach soit considéré comme le père de tous les Quincy, il n'est pas le premier Quincy. Il est dit, avant même la naissance de Yhwach, qu'un Quincy qui ne pouvait pas absorber de Reishi naissait toutes les quelques décennies."},{"g":"Yhwach & le Vandenreich","d":"veryhard","t":"Quelle reine Yhwach vainc-il très facilement, en dévastant tout l'environnement ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Tier Halibel","Nelliel Tu Odelschwanck","Yachiru Unohana","Senjumaru Shutara","Retsu Unohana","Lilynette"],"src":"Yhwach a vaincu Tier Halibel, la Reine du Hueco Mundo et ancienne Espada nº3, très facilement."},{"g":"Yhwach & le Vandenreich","d":"extreme","t":"Quels tomes du manga l'animé Thousand-Year Blood War adapte-t-il ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Yhwach","b":1,"r":["Les tomes 55 à 74","Les tomes 50 à 74","Les tomes 60 à 74","Les tomes 55 à 70","Les tomes 48 à 74","Les tomes 40 à 74"],"src":"Il est l'antagoniste principal de la série d'animation Bleach: Thousand-Year Blood War, qui adapte les tomes 55 à 74 du manga."},{"g":"Yhwach & le Vandenreich","d":"extreme","t":"Que devient le corps de Yhwach d'après les romans lors que son combat avec Renji est venu à la sixième place."},{"g":"Rukia & Byakuya","d":"extreme","t":"Quel musicien signe la chanson thème de Byakuya choisie par Tite Kubo ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Byakuya_Kuchiki","b":1,"r":["Giovanni Mirabassi","Ashley Mac Isaac","Ryôjirô Furusawa","Shirô Sagisu","Nobuo Uematsu","Yoko Kanno"],"src":"Sa chanson thème, choisie par Tite Kubo, est « Je Chante Pour Passer Le Temps » par Giovanni Mirabassi."},{"g":"Ichigo","d":"hard","t":"Dans quelles circonstances la mère d'Ichigo est-elle morte ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["En le protégeant de l'attaque d'un Hollow","Dans un accident de voiture","D'une longue maladie","Tuée par un Shinigami","En protégeant ses sœurs","Assassinée par un Quincy"],"src":"celui-ci porte sur lui le drame de sa mère décédée, qui, alors qu'il était enfant, mourut pour le protéger de l'attaque d'un Hollow."},{"g":"Ichigo","d":"veryhard","t":"Quand l'air renfrogné d'Ichigo disparaît-il ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["Uniquement lorsqu'il dort","Uniquement avec ses sœurs","Uniquement face à Rukia","Uniquement en combat","Jamais","Uniquement au lycée"],"src":"parce qu'il affiche constamment un air renfrogné (lequel ne disparaît que lorsqu'il dort), Ichigo a acquis mauvaise réputation auprès de ses camarades."},{"g":"Ichigo","d":"veryhard","t":"Comment Ichigo appelle-t-il le capitaine général Yamamoto, au grand dam de tous ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["« Grand-père »","« Le vieux »","« Papy Yama »","« Chef »","« L'ancêtre »","Par son prénom"],"src":"sa tendance à appeler le capitaine général Yamamoto « grand-père » ou à désigner certains capitaines par leurs noms, suscite toute sorte de protestations verbales."},{"g":"Ichigo","d":"extreme","t":"Quel capitaine soupçonne Ichigo de l'appeler par son nom exprès, pour l'agacer ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["Hitsugaya","Byakuya","Kenpachi","Kyōraku","Komamura","Mayuri"],"src":"en particulier de Byakuya et d'Hitsugaya (Hitsugaya suggèrera à un moment qu'Ichigo le ferait exprès)."},{"g":"Ichigo","d":"extreme","t":"Pour quel auteur Ichigo a-t-il beaucoup de respect ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["Shakespeare","Dostoïevski","Mishima","Poe","Bashô","Hemingway"],"src":"Ichigo a beaucoup de respect pour Shakespeare."},{"g":"Ichigo","d":"extreme","t":"Comment s'intitule le tome 1 de Bleach, dont Ichigo fait la couverture ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["The Death and the Strawberry","The Black Moon Rising","The Lost Agent","Goodbye Parakeet","Memories in the Rain","The Blade and Me"],"src":"Il apparaît sur les jaquettes des tomes 1 « The death and the strawberry », 19 « The black moon rising » et 49 « The lost agent »."},{"g":"Ichigo","d":"extreme","t":"Combien de couvertures de tomes Ichigo occupe-t-il, d'après les anecdotes du wiki ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["Trois : les tomes 1, 19 et 49","Deux : les tomes 1 et 49","Cinq","Une seule, le tome 1","Quatre","Six"],"src":"Il apparaît sur les jaquettes des tomes 1, 19 et 49."},{"g":"Ichigo","d":"veryhard","t":"À quels personnages Ichigo accorde-t-il des honorifiques japonais, contrairement aux capitaines qu'il tutoie ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["Urahara, Yoruichi, Unohana, Komamura, Kyōraku et Ukitake","Byakuya, Hitsugaya et Kenpachi","Yamamoto et Mayuri","Rukia et Renji","Aucun, il n'en emploie jamais","Seulement Unohana"],"src":"Toutefois, il utilise des honorifiques japonais pour un certain nombre d'individus, tels que Urahara, Yoruichi, Unohana, Komamura, Kyōraku et Ukitake."},{"g":"Ichigo","d":"veryhard","t":"Qui déclare trouver Ichigo effrayant ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["Rukia","Orihime","Karin","Tatsuki","Yuzu","Chad"],"src":"A ce propos, Rukia ira même jusqu'à déclarer qu'elle le trouve effrayant."},{"g":"Ichigo","d":"extreme","t":"À quel personnage Ichigo lance-t-il « Vivre n'a pas de sens. Se battre n'a pas de sens. Je veux gagner ! » ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["Zangetsu","Rukia","Byakuya","Aizen","Son Hollow intérieur","Urahara"],"src":"(À Zangetsu) « Vivre n'a pas de sens. Se battre n'a pas de sens. Je veux gagner ! »"},{"g":"Ichigo","d":"extreme","t":"Quelle phrase du tome 1 résume la menace des esprits dans Bleach ?","s":"Bleach","p":"https://bleach.fandom.com/fr/wiki/Ichigo_Kurosaki","b":1,"r":["« Craignez-nous d'autant plus que nous ne possédons pas de corps. »","« Nous sommes la mort qui marche. »","« Ce que vous ne voyez pas vous dévore. »","« Les morts n'oublient jamais. »","« Nous n'avons ni nom ni visage. »","« L'âme est une lame. »"],"src":"(Tome 1) « Craignez nous d'autant plus que nous ne possédons pas de corps. »"}];
const LIB = {"veryeasy":"Very Easy","easy":"Easy","medium":"Medium","hard":"Hard","veryhard":"Very Hard","extreme":"Extreme"};
const ORDRE = ["veryeasy","easy","medium","hard","veryhard","extreme"];
function copier(txt, bouton) {
  navigator.clipboard.writeText(txt).then(() => {
    const av = bouton.textContent;
    bouton.textContent = '✓'; bouton.classList.add('ok');
    setTimeout(() => { bouton.textContent = av; bouton.classList.remove('ok'); }, 800);
  });
}

function champ(etiq, valeur, classe) {
  const d = document.createElement('div'); d.className = 'champ';
  d.innerHTML = '<span class="etiq">' + etiq + '</span><span class="val ' + (classe || '') + '"></span>';
  d.children[1].textContent = valeur;
  const b = document.createElement('button'); b.className = 'c'; b.textContent = 'copier';
  b.onclick = () => copier(valeur, b);
  d.appendChild(b);
  return d;
}

const liste = document.getElementById('liste');

QUESTIONS.forEach((q, i) => {
  const c = document.createElement('div');
  c.className = 'q'; c.id = 'q' + i;
  c.dataset.d = q.d; c.dataset.g = q.g || 'divers';

  const tete = document.createElement('div'); tete.className = 'tete';
  tete.innerHTML = '<span class="num">' + (i + 1) + '</span>'
                 + '<span class="diff ' + q.d + '">' + LIB[q.d] + '</span>'
                 + '<span class="grappe">' + (q.g || '') + '</span>';
  const lab = document.createElement('label'); lab.className = 'coche';
  const cb = document.createElement('input'); cb.type = 'checkbox';
  cb.onchange = () => { c.classList.toggle('fait', cb.checked); sauver(); compter(); };
  lab.appendChild(cb); lab.appendChild(document.createTextNode('saisie'));
  tete.appendChild(lab); c.appendChild(tete);

  c.appendChild(champ('Texte', q.t));
  c.appendChild(champ('Série', q.s || 'Naruto'));
  c.appendChild(champ('Preuve', q.p, 'url'));
  c.appendChild(champ('Difficulté', LIB[q.d]));
  c.appendChild(champ('Bonne rép.', String(q.b)));
  c.appendChild(champ('Spoil', q.sp ? 'OUI' : 'non'));

  const reps = document.createElement('div'); reps.className = 'reps';
  q.r.forEach((r, k) => {
    const l = document.createElement('div');
    l.className = 'rep' + (k + 1 === q.b ? ' bonne' : '');
    l.innerHTML = '<span class="i">' + (k + 1) + '</span><span class="t"></span>';
    l.children[1].textContent = r;
    const b = document.createElement('button'); b.className = 'c'; b.textContent = 'copier';
    b.onclick = () => copier(r, b);
    l.appendChild(b); reps.appendChild(l);
  });
  c.appendChild(reps);

  const s = document.createElement('div'); s.className = 'src';
  s.textContent = '« ' + q.src + ' »';
  c.appendChild(s);

  if (q.n) { const n = document.createElement('div'); n.className = 'note'; n.innerHTML = q.n; c.appendChild(n); }
  liste.appendChild(c);
});

// ── barre de comptage ──
const parD = {}; QUESTIONS.forEach(q => parD[q.d] = (parD[q.d] || 0) + 1);
document.getElementById('barre').innerHTML =
  ORDRE.filter(d => parD[d]).map(d => '<span class="puce ' + d + '">' + LIB[d] + ' ' + parD[d] + '</span>').join('')
  + '<span class="puce" id="reste"></span>';

// ── filtres par grappe ──
const grappes = [...new Set(QUESTIONS.map(q => q.g || 'divers'))];
const fz = document.getElementById('filtres');
const btnTout = document.createElement('button');
btnTout.className = 'f actif'; btnTout.textContent = 'tout (' + QUESTIONS.length + ')';
btnTout.onclick = () => filtrer(null, btnTout);
fz.appendChild(btnTout);
grappes.forEach(g => {
  const n = QUESTIONS.filter(q => (q.g || 'divers') === g).length;
  const b = document.createElement('button');
  b.className = 'f'; b.textContent = g + ' (' + n + ')';
  b.onclick = () => filtrer(g, b);
  fz.appendChild(b);
});
function filtrer(g, bouton) {
  document.querySelectorAll('.f').forEach(x => x.classList.remove('actif'));
  bouton.classList.add('actif');
  document.querySelectorAll('.q').forEach(c => {
    c.style.display = (!g || c.dataset.g === g) ? '' : 'none';
  });
}

function sauver() {
  const etat = [...document.querySelectorAll('.coche input')].map(x => x.checked);
  try { localStorage.setItem('qsaisies2', JSON.stringify(etat)); } catch (e) {}
}
function compter() {
  const n = [...document.querySelectorAll('.coche input')].filter(x => !x.checked).length;
  const el = document.getElementById('reste');
  if (el) el.textContent = n + ' restante' + (n > 1 ? 's' : '');
}
try {
  const etat = JSON.parse(localStorage.getItem('qsaisies2') || '[]');
  document.querySelectorAll('.coche input').forEach((x, i) => {
    if (etat[i]) { x.checked = true; x.closest('.q').classList.add('fait'); }
  });
} catch (e) {}
compter();

</script></body></html>
