<html lang="fr"><head><meta charset="utf-8">

<title>Questions à saisir — ShonenMaster</title>
<style>:root{
    --fond:#0d0e12; --carte:#15171d; --bord:#242731; --or:#ffd24a;
    --texte:#e8e9ee; --pale:#8b8fa0; --vert:#4ade80;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:2rem 1rem 6rem;background:var(--fond);color:var(--texte);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .page{max-width:56rem;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 .3rem}
  .sous{color:var(--pale);margin:0 0 2rem;font-size:.9rem}
  .barre{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem}
  .puce{font-size:.72rem;padding:.25rem .6rem;border-radius:999px;
        border:1px solid var(--bord);background:var(--carte);color:var(--pale)}

  .q{background:var(--carte);border:1px solid var(--bord);border-radius:.8rem;
     padding:1.1rem 1.2rem;margin-bottom:1.2rem;position:relative}
  .q.fait{opacity:.42}
  .tete{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
  .num{font-weight:700;color:var(--or);font-size:1.05rem}
  .diff{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
        padding:.2rem .55rem;border-radius:.3rem;font-weight:700}
  .veryeasy{background:rgba(0,255,136,.15);color:#00ff88}
  .easy{background:rgba(0,200,255,.15);color:#00c8ff}
  .medium{background:rgba(255,200,0,.15);color:#ffc800}
  .hard{background:rgba(255,100,0,.15);color:#ff6400}
  .veryhard{background:rgba(255,50,50,.15);color:#ff3232}
  .extreme{background:rgba(190,80,255,.18);color:#c77dff}
  .coche{margin-left:auto;display:flex;align-items:center;gap:.4rem;
         color:var(--pale);font-size:.78rem;cursor:pointer;user-select:none}

  .champ{display:grid;grid-template-columns:7.5rem 1fr auto;gap:.5rem;
         align-items:start;padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .champ:last-of-type{border-bottom:0}
  .etiq{color:var(--pale);font-size:.78rem;padding-top:.15rem}
  .val{word-break:break-word}
  .val.url{font-size:.8rem;color:#7aa7ff}

  .reps{margin-top:.8rem;border-top:1px solid var(--bord);padding-top:.7rem}
  .rep{display:grid;grid-template-columns:1.4rem 1fr auto;gap:.5rem;
       align-items:center;padding:.22rem 0}
  .rep .i{color:var(--pale);font-size:.8rem;text-align:right}
  .rep.bonne .t{color:var(--vert);font-weight:600}
  .rep.bonne .i{color:var(--vert);font-weight:700}

  button.c{background:transparent;border:1px solid var(--bord);color:var(--pale);
           border-radius:.35rem;font-size:.68rem;padding:.18rem .5rem;cursor:pointer;
           white-space:nowrap;transition:all .15s}
  button.c:hover{border-color:var(--or);color:var(--or)}
  button.c.ok{border-color:var(--vert);color:var(--vert)}

  .src{margin-top:.9rem;padding:.6rem .8rem;background:rgba(255,255,255,.028);
       border-left:2px solid var(--bord);border-radius:0 .3rem .3rem 0;
       font-size:.8rem;color:var(--pale);font-style:italic}
  .note{margin-top:.5rem;padding:.6rem .8rem;background:rgba(255,210,74,.06);
        border-left:2px solid rgba(255,210,74,.4);border-radius:0 .3rem .3rem 0;
        font-size:.8rem;color:#d8c48a;font-style:normal}
  .note b{color:var(--or)}
  .grappe{font-size:.68rem;color:var(--pale);text-transform:uppercase;letter-spacing:.05em}
  .filtres{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.6rem}
  button.f{background:var(--carte);border:1px solid var(--bord);color:var(--pale);
           border-radius:999px;font-size:.75rem;padding:.3rem .8rem;cursor:pointer;transition:all .15s}
  button.f:hover{border-color:var(--or);color:var(--or)}
  button.f.actif{border-color:var(--or);color:var(--fond);background:var(--or);font-weight:600}
  .puce.veryeasy{color:#00ff88}.puce.easy{color:#00c8ff}.puce.medium{color:#ffc800}
  .puce.hard{color:#ff6400}.puce.veryhard{color:#ff3232}.puce.extreme{color:#c77dff}
</style></head><body>

<script>
const QUESTIONS = [{"g":"Saï & la Racine","d":"easy","t":"Quel membre de l'Équipe 7 Saï vient-il remplacer ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Sa%C3%AF","b":1,"r":["Sasuke Uchiwa","Kakashi Hatake","Sakura Haruno","Yamato","Naruto Uzumaki","Shikamaru Nara"],"src":"Quand il se joint à l'Équipe Kakashi pour remplacer Sasuke Uchiwa, il commence à se renseigner sur les sentiments."},{"g":"Saï & la Racine","d":"medium","t":"Avec quel objet Saï combat-il, plutôt qu'avec des kunaï ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Sa%C3%AF","b":1,"r":["Un pinceau","Un éventail","Un parchemin scellé","Un tantô","Des fils de chakra","Un rouleau de peinture"],"src":"Saï se bat non pas avec des kunaï et des shurikens mais avec son pinceau."},{"g":"Saï & la Racine","d":"hard","t":"Qui a donné son nom à Saï ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Sa%C3%AF","b":1,"r":["Danzô Shimura","Tsunade","Shin, son « frère »","Hiruzen Sarutobi","Kakashi Hatake","Ses parents"],"src":"Saï n'est pas son vrai nom, il lui est donné par Danzô lorsque celui-ci l'envoie pour rejoindre l'Équipe 7.","n":"Le leurre 2 est traître : c'est <b>Tsunade</b> qui a nommé Yamato, pas Saï. Les deux viennent de la même branche de l'Anbu."},{"g":"Saï & la Racine","d":"hard","t":"Quelle mission secrète Danzô avait-il confiée à Saï au sein de l'Équipe 7 ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Sa%C3%AF","b":1,"r":["Tuer Sasuke","Surveiller Naruto","Éliminer Kakashi","Ramener Sasuke vivant","Espionner Tsunade","Protéger Sakura"],"src":"Il avait pour mission de servir de lien entre Danzô et Orochimaru, tout en espionnant le second pour le compte du premier. […] De plus, il avait pour mission de tuer Sasuke."},{"g":"Saï & la Racine","d":"veryhard","t":"Que devait représenter la double page centrale du livre d'images de Saï ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Sa%C3%AF","b":1,"r":["Les deux frères se tenant la main","Le symbole de la Racine","Le visage de Danzô","Le village de Konoha en flammes","Saï seul au milieu du vide","L'Équipe 7 au complet"],"src":"Les portraits de Saï et de Shin se situent aux deux extrémités du livre, tandis que les pages centrales sont censées contenir une image des deux « frères » se tenant la main."},{"g":"Saï & la Racine","d":"veryhard","t":"Pourquoi Saï est-il incapable de donner un titre à ses œuvres ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Sa%C3%AF","b":1,"r":["Parce qu'il n'éprouve aucun sentiment","Parce que la Racine le lui interdit","Parce qu'il ne sait pas écrire","Parce qu'il les détruit aussitôt","Parce que Danzô les signe à sa place","Parce qu'il les peint les yeux fermés"],"src":"Cependant, son manque de sentiments lui empêche de donner un titre à ses œuvres."},{"g":"Saï & la Racine","d":"veryhard","t":"Comment s'appelait le garçon que Saï considérait comme son grand frère ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Sa%C3%AF","b":1,"r":["Shin","Shisui","Sora","Shion","Shinnô","Sumaru"],"src":"Lorsque Shin, un membre de la Racine légèrement plus âgé, découvre le talent de dessinateur de Saï, il l'encourage à continuer et ils deviennent très proches."},{"g":"Saï & la Racine","d":"medium","t":"Quel kekkei genkai rend Yamato unique parmi les ninjas de Konoha ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Yamato","b":1,"r":["Le Mokuton","Le Hyôton","Le Yôton","Le Jiton","Le Ranton","Le Shôton"],"src":"En raison de sa maîtrise unique du Mokuton, il fut assigné provisoirement à l'Équipe Kakashi."},{"g":"Saï & la Racine","d":"hard","t":"Quel était le nom de code de Yamato à l'Anbu, avant de rejoindre l'Équipe Kakashi ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Yamato","b":1,"r":["Tenzô","Kinoe","Hayate","Torune","Fû","Sugaru"],"src":"« Yamato » est en fait un nom de code donné par Tsunade quand il rejoignit l'Équipe Kakashi, son précédent nom de code du temps où il se trouvait à l'Anbu était Tenzô."},{"g":"Saï & la Racine","d":"hard","t":"Qui a enlevé Yamato peu après sa naissance pour en faire un sujet d'expérience ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Yamato","b":1,"r":["Orochimaru","Danzô Shimura","Kabuto Yakushi","Hashirama Senju","Le Deuxième Hokage","Madara Uchiwa"],"src":"Peu après sa naissance, Yamato fut enlevé par Orochimaru et il devint l'un des soixante enfants qui furent ses sujets de test."},{"g":"Saï & la Racine","d":"veryhard","t":"Sur combien d'enfants Orochimaru a-t-il mené l'expérience dont Yamato est le seul survivant ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Yamato","b":1,"r":["Soixante","Dix","Vingt","Quarante","Cent","Deux cents"],"src":"il devint l'un des soixante enfants qui furent ses sujets de test […] Yamato est le seul survivant."},{"g":"Saï & la Racine","d":"veryhard","t":"À quel âge Yamato est-il devenu chûnin ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Yamato","b":1,"r":["Six ans","Huit ans","Dix ans","Douze ans","Cinq ans","Quatorze ans"],"src":"Yamato est diplômé de l'Académie Ninja et devint chûnin à l'âge de six ans."},{"g":"Saï & la Racine","d":"extreme","t":"Quel animal figurait sur le masque d'Anbu de Yamato ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Yamato","b":1,"r":["Un chat","Un faucon","Un sanglier","Un renard","Un singe","Un corbeau"],"src":"Yamato portait le vêtement standard d'un membre de l'Anbu, avec une épée accrochée à son dos, un masque de chat orné de motifs verts et rouges."},{"g":"Saï & la Racine","d":"extreme","t":"Quel est le passe-temps de Yamato d'après le Databook ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Yamato","b":1,"r":["Lire des livres sur l'architecture","Le jardinage","La sculpture sur bois","La calligraphie","La pêche","La menuiserie"],"src":"Son hobby est la lecture de livres sur l'architecture.","n":"Les leurres 3 et 6 sont les pièges évidents — on l'imagine travailler le bois à cause du Mokuton. C'est l'architecture, pas la menuiserie."},{"g":"Saï & la Racine","d":"medium","t":"Quelle organisation secrète Danzô Shimura a-t-il fondée et dirigée ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Danz%C3%B4_Shimura","b":1,"r":["La Racine","L'Anbu","La Police Militaire de Konoha","Le Conseil des Anciens","L'Akatsuki","Les Douze Gardiens Ninja"],"src":"En tant que fondateur et chef de la Racine, Danzô gagna en notoriété."},{"g":"Saï & la Racine","d":"hard","t":"Quel surnom Danzô s'était-il attiré à Konoha ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Danz%C3%B4_Shimura","b":1,"r":["Les Ténèbres du Shinobi","L'Ombre de la Feuille","Le Faucon de Konoha","Le Vieux Faucon","Le Serpent Blanc","Le Corbeau du Conseil"],"src":"Danzô gagna en notoriété en tant que Les Ténèbres du Shinobi en raison de ses fréquentes actions non approuvées."},{"g":"Saï & la Racine","d":"hard","t":"À quel poste Danzô fut-il nommé candidat après l'Invasion de Pain ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Danz%C3%B4_Shimura","b":1,"r":["Sixième Hokage","Cinquième Hokage","Chef de l'Anbu","Conseiller suprême du Pays du Feu","Septième Hokage","Représentant de Konoha au Sommet des Kage"],"src":"Il fut nommé Candidat au poste de Sixième Hokage après l'Invasion de Pain, mais mourut avant d'avoir pu être formellement approuvé pour le poste."},{"g":"Saï & la Racine","d":"veryhard","t":"À qui appartenait le Sharingan greffé dans l'œil droit de Danzô ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Danz%C3%B4_Shimura","b":1,"r":["Shisui Uchiwa","Itachi Uchiwa","Kagami Uchiwa","Obito Uchiwa","Fugaku Uchiwa","Un membre anonyme du clan"],"src":"Danzô se fit greffer le Sharingan de Shisui Uchiwa à la place de son œil droit pour contrôler ses ennemis et augmenter ses capacités."},{"g":"Saï & la Racine","d":"veryhard","t":"Combien de Sharingan Danzô avait-il fait greffer dans son bras droit ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Danz%C3%B4_Shimura","b":1,"r":["Dix","Cinq","Sept","Douze","Trois","Vingt"],"src":"Les bandages cachaient dix Sharingan supplémentaires greffés dans son bras.","n":"C'est un chiffre, mais il se VOIT à l'écran quand il déroule ses bandages — ce n'est pas une donnée de fiche."},{"g":"Saï & la Racine","d":"extreme","t":"Quelle créature Danzô peut-il invoquer, capable d'engloutir jusqu'au Susanô ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Danz%C3%B4_Shimura","b":1,"r":["Un tapir géant","Un crapaud géant","Un serpent géant","Un rhinocéros géant","Un corbeau géant","Une limace géante"],"src":"Il peut invoquer un Tapir géant pouvant tout engloutir, même Susanô. Cependant, cette invocation ne dure qu'une minute avant de disparaître."},{"g":"Saï & la Racine","d":"extreme","t":"D'où vient le nom de la « Racine », l'organisation de Danzô ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Racine","b":1,"r":["Danzô se voyait comme les racines dans les ténèbres, et Hiruzen comme les feuilles au soleil","Elle recrutait ses membres à la racine, dès l'orphelinat","Son quartier général était enterré sous les racines d'un arbre sacré","C'est le nom du sceau maudit apposé à ses membres","Elle devait être la racine du futur Konoha rebâti","Danzô l'a nommée d'après l'Arbre Divin"],"src":"Le nom de l'organisation vient du point de vue qu'avait Danzô sur lui-même par rapport à Hiruzen Sarutobi. Il voyait Hiruzen comme « les feuilles qui se prélassent au soleil », tandis que lui était « les racines enterrées dans les ténèbres »."},{"g":"Saï & la Racine","d":"extreme","t":"Comment Danzô empêchait-il les membres de la Racine de révéler ses secrets ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Danz%C3%B4_Shimura","b":1,"r":["Par un sceau maudit apposé sur eux","En effaçant leur mémoire après chaque mission","En les gardant enfermés sous Konoha","Par un genjutsu permanent","En leur retirant la parole","En ne leur disant jamais rien"],"src":"c'est pourquoi il marqua les membres de la Racine d'un sceau maudit les empêchant de révéler ses secrets."},{"g":"Ino-Shika-Chô","d":"easy","t":"De quel clan Ino est-elle issue ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ino_Yamanaka","b":1,"r":["Le clan Yamanaka","Le clan Nara","Le clan Akimichi","Le clan Aburame","Le clan Inuzuka","Le clan Hyûga"],"src":"Ino est une kunoichi de Konoha appartenant au clan Yamanaka."},{"g":"Ino-Shika-Chô","d":"medium","t":"Quel objet Ino a-t-elle offert à Sakura pour qu'elle cesse de cacher son front ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ino_Yamanaka","b":1,"r":["Un ruban","Un bandeau frontal","Un miroir","Une barrette","Une fleur","Un foulard"],"src":"Elle convainquit Sakura que cacher la taille de son front était inutile, lui offrant un ruban."},{"g":"Ino-Shika-Chô","d":"hard","t":"Qu'est-ce qui a transformé l'amitié entre Ino et Sakura en rivalité ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ino_Yamanaka","b":1,"r":["Elles étaient toutes deux amoureuses de Sasuke","Elles ont été placées dans des équipes rivales","Sakura a surpassé Ino à l'Académie","Ino a révélé un secret de Sakura","Elles visaient la même place auprès de Tsunade","Sakura a refusé son ruban"],"src":"Lorsqu'Ino et Sakura s'aperçurent qu'elles étaient toutes les deux amoureuses de Sasuke Uchiwa, les deux amies devinrent rivales."},{"g":"Ino-Shika-Chô","d":"veryhard","t":"Qu'Ino utilise-t-elle pour conduire son chakra lors de son combat contre Sakura ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ino_Yamanaka","b":1,"r":["Ses cheveux","Des fils de chakra","Des pétales de fleur","Son ruban","Ses ongles","Du fil de fer ninja"],"src":"Durant son combat contre Sakura lors de l'examen Chûnin, elle utilise ses cheveux pour conduire son chakra."},{"g":"Ino-Shika-Chô","d":"extreme","t":"De quel animal le prénom d'Ino est-il le diminutif ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ino_Yamanaka","b":1,"r":["Le sanglier","Le cerf","Le papillon","La biche","Le renard","Le blaireau"],"src":"Le prénom Ino est un diminutif du mot « Inoshishi », signifiant « Sanglier ». C'est pour cela que Sakura la surnomme « Ino la truie ».","n":"Le cerf (Shika) est Shikamaru et le papillon (Chô) est Chôji — les trois leurres principaux sont donc les deux coéquipiers."},{"g":"Ino-Shika-Chô","d":"extreme","t":"À quel jeu japonais les noms Ino, Shika et Chô font-ils référence ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Clan_Akimichi","b":1,"r":["Le Hanafuda","Le shôgi","Le Go","Le mah-jong","Le karuta","Le sugoroku"],"src":"« Ino », « Shika » et « Chô » sont les noms de cartes d'une des combinaisons d'un jeu de carte, le Hanafuda.","n":"Le shôgi et le Go en leurres sont excellents : ce sont les jeux d'Asuma et Shikamaru, cités sur la page voisine."},{"g":"Ino-Shika-Chô","d":"hard","t":"Que représente le symbole porté sur les tenues du clan Akimichi ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Clan_Akimichi","b":1,"r":["Le kanji de « nourriture »","Le kanji de « force »","Un papillon stylisé","Le kanji de « montagne »","Un bol de riz","Le kanji de « récolte »"],"src":"C'est pourquoi le symbole du clan, inscrit sur la plupart des tenues des membres, est le kanji stylisé du mot « nourriture »."},{"g":"Ino-Shika-Chô","d":"hard","t":"Pourquoi les Akimichi mangent-ils beaucoup, même avant un combat ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Clan_Akimichi","b":1,"r":["Leurs techniques épuisent très vite leurs réserves de chakra","C'est un rite de leur clan avant la bataille","La graisse les protège des coups","Cela renforce leur taijutsu","C'est une superstition familiale","Leur digestion déclenche leur kekkei genkai"],"src":"La plupart de leurs techniques sont connues pour épuiser rapidement les réserves de chakra de l'utilisateur […] C'est la raison pour laquelle les Akimichi ont tendance à beaucoup manger."},{"g":"Ino-Shika-Chô","d":"veryhard","t":"Combien de pilules de couleur le clan Akimichi utilise-t-il, et laquelle est la plus dangereuse ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Clan_Akimichi","b":1,"r":["Trois, la rouge","Trois, la verte","Trois, la jaune","Deux, la rouge","Quatre, la noire","Cinq, la dernière"],"src":"un Akimichi peut faire usage des trois pilules de couleur pour convertir la graisse excessive en chakra, mais à ses risques et périls : les pilules, en particulier la dernière, la rouge, sont extrêmement dangereuses pour le corps humain et leur consommation peut aboutir à la mort."},{"g":"Ino-Shika-Chô","d":"extreme","t":"Quelle est la particularité des Bô utilisés par les Akimichi ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Clan_Akimichi","b":1,"r":["Ils s'allongent proportionnellement à la taille de leur porteur","Ils sont creux et contiennent les pilules","Ils conduisent le chakra comme les lames d'Asuma","Ils sont taillés dans le bois du Mokuton","Ils deviennent tranchants au contact du chakra","Ils flottent autour du porteur"],"src":"De nombreux Akimichi utilisent des Bô comme arme principale. Ceux-ci ont la capacité de s'allonger proportionnellement à la taille de leur porteur."},{"g":"Ino-Shika-Chô","d":"extreme","t":"Quel objet un membre du clan Sarutobi remet-il aux chefs de génération du trio Ino-Shika-Chô ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Clan_Akimichi","b":1,"r":["Des boucles d'oreilles","Un bandeau frontal gravé","Trois cartes de Hanafuda","Une bague de clan","Un parchemin de serment","Une paire de lames de chakra"],"src":"un membre du clan Sarutobi leur donnait des boucles d'oreilles spéciales à présenter à chaque chef de génération lors de leur promotion au rang chûnin après quoi ils prêteraient serment."},{"g":"Ino-Shika-Chô","d":"hard","t":"Quel enfant a été le premier à intégrer Chôji au jeu, marquant le début de leur amitié ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ch%C3%B4ji_Akimichi","b":1,"r":["Shikamaru","Ino","Naruto","Kiba","Asuma","Chôza, son père"],"src":"Le jour où Chôji fit la connaissance de Shikamaru, celui-ci tenta tout de même de l'intégrer au jeu, marquant le début de leur amitié."},{"g":"Ino-Shika-Chô","d":"veryhard","t":"Quel rang Chôji occupera-t-il dans la succession des chefs du clan Akimichi ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ch%C3%B4ji_Akimichi","b":1,"r":["Le seizième","Le quinzième","Le dix-septième","Le quatorzième","Le dixième","Le vingtième"],"src":"Il est le seizième chef du clan Akimichi. […] Ils ont eu quinze chefs, Chôza Akimichi en est le chef actuel.","n":"Le leurre 2 est le rang de son PÈRE, Chôza. Les deux chiffres sont sur la même page."},{"g":"Ino-Shika-Chô","d":"medium","t":"Contre quel adversaire Chôji utilise-t-il pour la première fois le Contrôle des Calories ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ch%C3%B4ji_Akimichi","b":1,"r":["Jirôbô","Kidômaru","Sakon","Tayuya","Kimimaro","Kakuzu"],"src":"Il montra toutes ses capacités contre Jirôbô où il utilisa le décuplement partiel et la plus puissante technique du clan Akimichi : « Le contrôle des calories »."},{"g":"Ino-Shika-Chô","d":"veryhard","t":"Quelle nouvelle technique Chôji révèle-t-il lors de son combat contre Kakuzu ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ch%C3%B4ji_Akimichi","b":1,"r":["Les paumes fracassantes","Le boulet humain","Le décuplement partiel","Les ailes de papillon","Le pilon écrasant","La chute du météore"],"src":"Lors de son combat contre Kakuzu, il montra une nouvelle technique : les paumes fracassantes, qui étaient manifestement très puissantes."},{"g":"Ino-Shika-Chô","d":"medium","t":"De quel groupe d'élite Asuma Sarutobi était-il un ancien membre ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Asuma_Sarutobi","b":1,"r":["Les Douze Ninjas Gardiens","L'Anbu","La Racine","Les Sept Épéistes de la Brume","Les Douze Hokage","La Garde Rapprochée du Daimyô"],"src":"Asuma Sarutobi était un jônin de Konoha du clan Sarutobi, ainsi qu'un ancien membre des Douze Ninjas Gardiens."},{"g":"Ino-Shika-Chô","d":"hard","t":"Qui les Douze Ninjas Gardiens avaient-ils pour mission de protéger ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Asuma_Sarutobi","b":1,"r":["Le Daimyô du Feu","Le Hokage","Le temple du feu","Le Pays du Feu tout entier","Les moines de Konoha","La famille Sarutobi"],"src":"il devint l'un des Douze Ninjas Gardiens, un groupe qui protégeait le Daimyô du Feu, indiqué par la ceinture sur sa taille."},{"g":"Ino-Shika-Chô","d":"veryhard","t":"Quel surnom Asuma donnait-il à chacun de ses trois élèves ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Asuma_Sarutobi","b":1,"r":["Le glouton, la braillarde et le fainéant","Le gros, la peste et l'endormi","Le ventre, la voix et l'ombre","Le glouton, la fleur et le stratège","Le pilier, la lame et l'ombre","Le papillon, le sanglier et le cerf"],"src":"appelant souvent ses élèves comme ils étaient sans réserve, un « glouton » (Chôji), une « braillarde » (Ino) et un « fainéant » (Shikamaru)."},{"g":"Ino-Shika-Chô","d":"veryhard","t":"Qu'Asuma a-t-il découvert le premier au sujet de Shikamaru ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Asuma_Sarutobi","b":1,"r":["Que son Q.I. dépassait 200","Qu'il maîtrisait déjà la technique de son père","Qu'il craignait le combat","Qu'il voulait devenir Hokage","Qu'il trichait au shôgi","Qu'il était le plus fort de l'équipe"],"src":"Ce fut Asuma qui découvrit le premier que Shikamaru, sous ses airs de paresseux, était en réalité un génie, avec un Q.I. dépassant les 200."},{"g":"Ino-Shika-Chô","d":"extreme","t":"À quels jeux Asuma et Shikamaru s'affrontaient-ils, sans qu'Asuma ne l'emporte jamais ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Asuma_Sarutobi","b":1,"r":["Le shôgi et le Go","Le Hanafuda et le karuta","Les échecs et les dames","Le mah-jong et le Go","Le shôgi et le karuta","Le sugoroku et le Go"],"src":"Asuma et Shikamaru jouaient souvent au shôgi ou au Go pendant leur temps libre, bien qu'Asuma ne fut jamais capable de battre Shikamaru."},{"g":"Ino-Shika-Chô","d":"extreme","t":"À combien s'élevait la prime placée sur la tête d'Asuma au marché noir ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Asuma_Sarutobi","b":1,"r":["35 millions de Ryô","5 millions de Ryô","10 millions de Ryô","50 millions de Ryô","100 millions de Ryô","25 millions de Ryô"],"src":"il accumula une prime de 35 millions de Ryô sur le marché noir, ce dont il semblait être particulièrement fier.","n":"C'est un chiffre, mais il est <b>dit à l'écran</b> par Kakuzu, qui chasse les primes — il en fait tout un plat. Ce n'est pas une donnée de fiche."},{"g":"Ino-Shika-Chô","d":"hard","t":"Quelle arme Asuma utilise-t-il, renforcée par son chakra de type vent ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Asuma_Sarutobi","b":1,"r":["Des poings américains à lames","Un tantô","Deux sabres courts","Un bô","Des griffes de chakra","Un éventail de guerre"],"src":"Le style de combat d'Asuma est tourné principalement autour du taijutsu, combiné avec ses poings américains dotés de lames de chakra."},{"g":"Ino-Shika-Chô","d":"extreme","t":"Dans quelles circonstances Asuma, gros fumeur, a-t-il arrêté de fumer ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Asuma_Sarutobi","b":1,"r":["À la mort de son père et quand Kurenaï est tombée enceinte","Après sa première mission ratée","Quand Hiruzen le lui a ordonné","En rejoignant les Douze Ninjas Gardiens","Après son combat contre Hidan","Quand Chôji le lui a demandé"],"src":"C'était un grand fumeur mais malgré cela, il pouvait casser cette habitude selon les circonstances, tel que quand son père mourut ou quand Kurenaï tomba enceinte."},{"g":"Ino-Shika-Chô","d":"veryhard","t":"Que demande Asuma à Ino sur son lit de mort ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ino_Yamanaka","b":1,"r":["De prendre soin de Chôji et Shikamaru","De veiller sur Kurenaï","De devenir chef de l'Équipe 10","De transmettre ses lames à Shikamaru","De ne jamais chercher à le venger","De protéger Konohamaru"],"src":"Sur son lit de mort, il demanda à Ino de prendre soin de Chôji et Shikamaru pour qu'il ne leur arrive rien.","sp":true,"n":"Mort d'Asuma — candidate au drapeau spoil, à toi de trancher."},{"g":"Gaï & Rock Lee","d":"easy","t":"Quelle est la seule discipline que Rock Lee est capable d'utiliser ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Le taijutsu","Le ninjutsu","Le genjutsu","Le fûinjutsu","Le kenjutsu","Le senjutsu"],"src":"Lorsque Lee était enfant et étudiant à l'Académie de Konoha, il ne possédait aucun talent pour le ninjutsu et le genjutsu […] décida de se spécialiser dans le taijutsu, seul domaine qu'il maîtrisait."},{"g":"Gaï & Rock Lee","d":"medium","t":"De qui Gaï Maito tient-il son amour du taijutsu ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["De son père Daï","De Kakashi Hatake","Du Troisième Hokage","De son maître Chen","De Rock Lee","Des Douze Ninjas Gardiens"],"src":"L'amour que porte Gaï pour le taijutsu lui vient de son père Daï, qui était également maître en combat au corps-à-corps."},{"g":"Gaï & Rock Lee","d":"hard","t":"Quel rang le père de Gaï n'a-t-il jamais dépassé de toute sa vie ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Genin","Chûnin","Jônin","Jônin spécial","Anbu","Il n'était pas ninja"],"src":"Gaï s'entraînait sans relâche pour impressionner son père, bien que ce dernier n'était seulement qu'un genin.","n":"C'est tout le tragique du personnage : le plus grand taijutsuka de sa génération est mort genin."},{"g":"Gaï & Rock Lee","d":"veryhard","t":"Contre qui le père de Gaï s'est-il sacrifié en ouvrant la huitième porte ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Les Sept Épéistes de la Brume","L'Akatsuki","Les ninjas d'Iwa","Les Quatre du Son","Orochimaru","Les Douze Ninjas Gardiens"],"src":"lui et son équipe furent pris au piège par les Sept Épéistes de la Brume, mais son père arriva à temps et ouvrit la huitième et dernière porte, sacrifiant sa vie."},{"g":"Gaï & Rock Lee","d":"veryhard","t":"À quelle condition le père de Gaï lui a-t-il enseigné l'ouverture des Huit Portes ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Ne s'en servir que pour protéger ce qu'il a de plus cher","Ne jamais dépasser la cinquième porte","N'en parler à personne, jamais","Ne l'utiliser qu'en présence de son père","Ne jamais la transmettre à un élève","Attendre d'être jônin"],"src":"Daï décida de lui enseigner la technique d'ouverture des Huit portes célestes, à la seule condition qu'il ne l'utilise que pour protéger ce qu'il a de plus cher."},{"g":"Gaï & Rock Lee","d":"extreme","t":"Quel défaut surprenant Gaï présente-t-il, au point que Tobi le lui fasse remarquer ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Il ne retient pas le visage des gens qu'il croise peu","Il ne sait pas lire une carte","Il s'endort debout après un combat","Il ne sait pas nager","Il confond la droite et la gauche","Il est incapable de mentir"],"src":"Gaï a des problèmes pour se rappeler du visage des personnes qu'il ne rencontre pas fréquemment, comme par exemple pendant ses fréquents combats contre Kisame Hoshigaki.","n":"Détail délicieux : il a affronté Kisame plusieurs fois <b>sans jamais le reconnaître</b>."},{"g":"Gaï & Rock Lee","d":"hard","t":"En quoi consiste la pose du « chic type » de Gaï et Lee ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Pouce levé, clin d'œil et dents qui brillent","Les deux bras croisés et un large sourire","Le poing sur le cœur et un salut","Un salut militaire et un clin d'œil","Les mains jointes en signe de prière","Le pouce pointé vers le sol"],"src":"Il est surtout connu pour sa pose du « chic type », qui consiste à lever le pouce, faire un clin d'œil et sourire avec ses dents tellement blanches qu'elles brillent, accompagnées d'un tintement « ding »."},{"g":"Gaï & Rock Lee","d":"veryhard","t":"Quelle est la technique la plus puissante de Gaï, celle qui lui donne la victoire contre Kisame ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Le Tigre du Zénith","Le Paon Matinal","L'Éléphant Nocturne","La Grande Bourrasque de Konoha","Le Lotus Recto-Verso","La Danse du Dragon"],"src":"sa technique la plus puissante reste le « Tigre du Zénith » où il comprime une gigantesque masse d'air et la lance sur son adversaire ce qui lui donna la victoire contre Kisame Hoshigaki."},{"g":"Gaï & Rock Lee","d":"extreme","t":"Pourquoi les techniques d'absorption de chakra de Kisame restent-elles sans effet sur le Tigre du Zénith ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["La technique n'est pas faite de chakra, mais d'air comprimé","Elle est trop rapide pour être absorbée","Le chakra de Gaï est du senjutsu","Samehada refuse le chakra des Huit Portes","Elle frappe depuis l'intérieur du corps","Kisame n'avait plus de chakra à ce moment"],"src":"Et comme cette technique n'est pas constitué de chakra, les techniques d'absorption de chakra de Kisame ou de Gakidô n'eurent aucun effet dessus."},{"g":"Gaï & Rock Lee","d":"extreme","t":"Qu'arrive-t-il à la sueur de Gaï lorsqu'il ouvre la septième porte ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Elle devient verte","Elle devient rouge","Elle s'enflamme","Elle devient dorée","Elle se transforme en vapeur bleue","Elle cesse complètement"],"src":"Il se servit de la 6e et de la 7e porte contre Kisame Hoshigaki […] Dans la 7e, sa sueur devint verte et s'évaporait beaucoup plus fortement."},{"g":"Gaï & Rock Lee","d":"veryhard","t":"Qu'est-ce qui s'échappe de la peau de Gaï lorsqu'il ouvre la huitième porte ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["De la vapeur de sang","Des flammes bleues","De la fumée noire","Des éclairs","De la poussière d'or","Rien de visible"],"src":"Quand il ouvre la huitième porte, de la vapeur de sang s'échappe de sa peau et il peut lancer son attaque « Éléphant Nocturne »."},{"g":"Gaï & Rock Lee","d":"extreme","t":"Quelle créature Gaï Maito peut-il invoquer ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Une tortue, Ningame","Un crapaud","Un chien-ninja","Un faucon","Un singe","Une salamandre"],"src":"Il peut aussi invoquer Ningame."},{"g":"Gaï & Rock Lee","d":"veryhard","t":"Avec qui Gaï formait-il son équipe de genin lors de son propre examen Chûnin ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Ebisu et Genma","Kakashi et Asuma","Kurenaï et Asuma","Hayate et Raidô","Ibiki et Anko","Baki et Chiriku"],"src":"Lorsqu'il n'était qu'un Genin, Gaï fit équipe avec Ebisu et Genma lors de l'examen Chûnin."},{"g":"Gaï & Rock Lee","d":"medium","t":"Quel surnom Naruto donne-t-il à Rock Lee ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Gros sourcils","Coupe au bol","Le chic type","La bête verte","Monsieur Fougue","Le lotus"],"src":"Lee a des cheveux noirs, des yeux ronds, des cils inférieurs proéminents et des sourcils très épais ; Naruto l'appelle donc « Gros sourcils »."},{"g":"Gaï & Rock Lee","d":"hard","t":"Comment Rock Lee a-t-il déclenché par accident sa technique de l'Homme Ivre contre Kimimaro ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Il s'est trompé de bouteille et a bu du saké au lieu de son médicament","Kimimaro lui a fait boire de l'alcool de force","Il a inhalé les vapeurs d'un tonneau brisé","Gaï lui en avait donné avant le combat","Il a mordu dans un fruit fermenté","Tsunade lui avait prescrit de l'alcool"],"src":"il fit interrompre un instant le combat pour prendre à heure dite le remède que lui avait prescrit Tsunade. S'étant trompé de bouteille, il but en fait du saké, lui permettant de combattre avec sa technique de « l'homme ivre »."},{"g":"Gaï & Rock Lee","d":"hard","t":"Quel exploit Rock Lee réussit-il en retirant ses poids, face à Gaara ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Être le premier à contourner son Bouclier de Sable et le frapper","Détruire sa calebasse d'un seul coup","Le faire sortir de sa sphère de sable absolue","Esquiver son Cercueil du Désert","Le forcer à se transformer","Briser son armure de sable"],"src":"ce qui lui permit de devenir la toute première personne à contourner le Bouclier de Sable de Gaara et à le frapper."},{"g":"Gaï & Rock Lee","d":"veryhard","t":"Quel objet céleste Rock Lee est-il capable de détruire à lui seul, une fois chûnin ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Une météorite","Une lune artificielle","Un fragment de l'Arbre Divin","Un rocher d'invocation","Une comète","Une étoile filante"],"src":"En tant que chûnin, il était capable de vaincre le légendaire maître en taijutsu Chen, ainsi que de détruire une météorite par lui-même."},{"g":"Gaï & Rock Lee","d":"extreme","t":"Combien de portes Rock Lee parvient-il à ouvrir à l'âge de 12 ans ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Cinq","Trois","Quatre","Six","Sept","Deux"],"src":"Grâce aux enseignements de Gaï, Lee apprit à ouvrir cinq des Huit Portes à l'âge de 12 ans, la sixième à l'âge de 17 ans."},{"g":"Gaï & Rock Lee","d":"extreme","t":"De quel acteur légendaire le nom de Rock Lee est-il un jeu de mots ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Bruce Lee","Jackie Chan","Jet Li","Sonny Chiba","Toshirô Mifune","Donnie Yen"],"src":"Le nom de Rock Lee est dérivé du genre musical du rock et est un jeu de mot avec Bruce Lee, dont le nom est prononcé de la même manière que le blues en japonais."},{"g":"Gaï & Rock Lee","d":"extreme","t":"Quel point commun Rock Lee partage-t-il avec Bruce Lee, outre le nom et la coupe de cheveux ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["La même date de naissance","La même taille","Le même groupe sanguin","Le même prénom de fils","La même blessure au dos","Le même maître"],"src":"le personnage de Rock Lee semble inspiré de Bruce Lee, comme le montre son nom et le fait qu'ils partagent la même date de naissance et la même coupe de cheveux."},{"g":"Gaï & Rock Lee","d":"veryhard","t":"Comment s'appelle le fils de Rock Lee ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Metal Lee","Rocky Lee","Steel Lee","Gaï Lee","Iron Lee","Punk Lee"],"src":"Ce jeu de mot a également été reproduit avec son fils, Metal Lee."},{"g":"Gaï & Rock Lee","d":"extreme","t":"Quel maître légendaire de taijutsu Rock Lee vainc-il une fois devenu chûnin ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Chen","Daï Maito","Ningame","Hanzô","Gaï Maito","Torune"],"src":"En tant que chûnin, il était capable de vaincre le légendaire maître en taijutsu Chen."},{"g":"Gaï & Rock Lee","d":"hard","t":"Quelles sont les deux seules personnes avec qui Rock Lee n'emploie pas de suffixe de politesse ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Rock_Lee","b":1,"r":["Neji et Tenten","Naruto et Sakura","Gaï et Neji","Sakura et Tenten","Gaara et Naruto","Personne, il en emploie toujours"],"src":"usant toujours de suffixe de politesse avec tout le monde (sauf Neji et Tenten qu'il estime être des amis assez proches pour s'en passer) et n'employant jamais de gros mots."},{"g":"Gaï & Rock Lee","d":"veryhard","t":"Quinze ans après la Grande Guerre, comment Gaï combat-il malgré son handicap ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Ga%C3%AF_Maito","b":1,"r":["Il se bat avec une seule jambe","Il s'appuie sur une canne de combat","Il combat depuis son fauteuil","Il a appris le ninjutsu sur le tard","Il ne combat plus du tout","Il utilise une prothèse en bois"],"src":"15 ans après la grande guerre, même handicapé par sa blessure à la jambe, Gaï est toujours redoutable au taijutsu car il est capable de se battre avec seulement une jambe."},{"g":"Bijû & jinchûriki","d":"easy","t":"Qu'est-ce qui différencie les neuf Démons à Queues les uns des autres ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Bij%C3%BB","b":1,"r":["Leur nombre de queues","Leur couleur","Leur taille","Leur élément","Leur ancienneté","Leur village d'origine"],"src":"Au nombre de neuf, ces démons se différencient par le nombre de leurs queues, allant d'une seule à neuf."},{"g":"Bijû & jinchûriki","d":"medium","t":"De quoi les Démons à Queues sont-ils faits ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Bij%C3%BB","b":1,"r":["De chakra vivant","De chair et de sang comme les animaux","De pierre animée","D'énergie naturelle pure","De l'âme de guerriers anciens","De l'écorce de l'Arbre Divin"],"src":"Les démons à queues sont des formes vivantes de chakra, leur procurant une puissance surpassant la plupart des shinobi."},{"g":"Bijû & jinchûriki","d":"veryhard","t":"Qui fut le tout premier jinchûriki de l'histoire ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Hagoromo Ôtsutsuki","Kaguya Ôtsutsuki","Mito Uzumaki","Hashirama Senju","Hamura Ôtsutsuki","Madara Uchiwa"],"src":"Les fils de Kaguya réussirent à le vaincre et l'un d'eux, Hagoromo Ôtsutsuki, le scella dans son propre corps, devenant ainsi le premier jinchûriki de l'histoire."},{"g":"Bijû & jinchûriki","d":"hard","t":"Qu'est devenu le corps de Jûbi après que le Sage des Six Chemins l'eut scellé ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Il est devenu la Lune","Il a été enterré sous la Vallée de la Fin","Il a été dissous dans l'océan","Il est devenu l'Arbre Divin","Il a été scellé dans la Statue de l'Hérétique","Il s'est changé en montagne"],"src":"l'ermite recourut au Banbutsu Sôzô pour diviser le chakra du monstre en neuf entités, les bijû, avant d'enfermer sa carcasse dans ce qui deviendra la Lune grâce au Chibaku Tensei."},{"g":"Bijû & jinchûriki","d":"hard","t":"Tous les combien de temps l'arbre sacré Shinju produisait-il son fruit unique ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Tous les mille ans","Tous les cent ans","Tous les dix ans","Tous les cinq cents ans","Une seule fois dans toute son existence","Tous les siècles"],"src":"Le démon Shinju, créateur du chakra, revêtait la forme d'un arbre sacré qui tous les mille ans produisait un fruit unique dont la consommation était interdite."},{"g":"Bijû & jinchûriki","d":"veryhard","t":"Qui a scellé Kyûbi en elle après la victoire de Hashirama à la Vallée de la Fin ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Mito Uzumaki","Kushina Uzumaki","Tsunade","Biwako Sarutobi","Toka Senju","Hashirama lui-même"],"src":"Hashirama Senju, le Premier Hokage, vainquit Madara Uchiwa à la Vallée de la Fin et Mito Uzumaki, sa femme, scella Kyûbi en elle."},{"g":"Bijû & jinchûriki","d":"veryhard","t":"Comment Hashirama a-t-il réparti les Démons à Queues entre les nations ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Il les a maîtrisés avec le Mokuton puis distribués pour assurer l'équilibre","Il les a vendus au plus offrant","Il les a tirés au sort au premier Sommet des Kage","Il les a confiés au Daimyô du Feu","Il les a répartis selon leur élément","Il les a laissés choisir leur village"],"src":"Durant son règne, Hashirama utilisa le Mokuton pour maîtriser les démons à queues et les répartit entre les différents villages afin d'assurer l'équilibre entre les nations."},{"g":"Bijû & jinchûriki","d":"extreme","t":"Dans quel objet Hachibi a-t-il été scellé avant d'avoir un hôte humain ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Bij%C3%BB","b":1,"r":["Un vase","Une théière","Une gourde","Un miroir","Une cloche","Un tonneau"],"src":"trois bijû ont été scellés dans un objet inanimé autre que la Statue de l'Hérétique : Shukaku dans une théière, Hachibi dans un vase et Jûbi dans la Lune.","n":"La théière est celle de Shukaku, citée sur la même ligne — c'est le leurre."},{"g":"Bijû & jinchûriki","d":"extreme","t":"Combien de personnes sont connues pour avoir parfaitement contrôlé un bijû ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Bij%C3%BB","b":1,"r":["Sept","Quatre","Cinq","Trois","Neuf","Dix"],"src":"Seules sept personnes sont connues pour avoir réussi à contrôler parfaitement un bijû : Madara Uchiwa et Tobi, Hashirama Senju, et quatre jinchûriki : Yagura, Killer B, Naruto Uzumaki et Minato Namikaze."},{"g":"Bijû & jinchûriki","d":"veryhard","t":"Quels sont les trois seuls êtres à avoir contrôlé Jûbi, le bijû suprême ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Bij%C3%BB","b":1,"r":["L'Ermite Rikudô, Obito et Madara","Kaguya, Madara et Obito","L'Ermite Rikudô, Kaguya et Madara","Hashirama, Madara et Obito","Madara, Obito et Naruto","Kaguya, Hagoromo et Hamura"],"src":"Seuls l'Ermite Rikudô, Obito Uchiwa et Madara Uchiwa réussirent à contrôler Jûbi, le bijû suprême."},{"g":"Bijû & jinchûriki","d":"extreme","t":"Quelles sont les deux personnes que les neuf bijû respectent le plus ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Bij%C3%BB","b":1,"r":["L'Ermite Rikudô et Naruto","L'Ermite Rikudô et Hashirama","Naruto et Killer B","Kaguya et l'Ermite Rikudô","Hashirama et Minato","Madara et l'Ermite Rikudô"],"src":"Les deux personnes que les neuf bijû respectent le plus sont : l'Ermite Rikudô qui ne les avait pas considérés comme des armes, mais comme des être bons, le deuxième était Naruto."},{"g":"Bijû & jinchûriki","d":"hard","t":"Quel pouvoir particulier Rôshi tire-t-il de son bijû ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Il manipule la lave","Il fabrique du corail","Il se propulse à la vapeur","Il sécrète un fluide corrosif","Il déploie des ailes","Il commande au sable"],"src":"Gaara commande au sable, Yugito se fait pousser des griffes, Yagura fabrique du corail, Rôshi manipule la lave, Han se propulse à la vapeur, Utakata sécrète un fluide corrosif, Fû déploie des ailes."},{"g":"Bijû & jinchûriki","d":"extreme","t":"Quel jinchûriki se propulse grâce à la vapeur ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Han","Rôshi","Utakata","Yagura","Fû","Yugito"],"src":"Han se propulse à la vapeur, Utakata sécrète un fluide corrosif, Fû déploie des ailes pour voler."},{"g":"Bijû & jinchûriki","d":"veryhard","t":"Quelle capacité, en plus de son mode chakra, Naruto tient-il de son statut de jinchûriki ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Détecter les émotions négatives","Voir à travers les murs","Lire dans les pensées","Guérir instantanément","Respirer sous l'eau","Parler aux animaux"],"src":"quant à Naruto, il dispose d'un mode chakra de puissance équivalente au Susanô et de la capacité à détecter les émotions négatives."},{"g":"Bijû & jinchûriki","d":"hard","t":"Où les jinchûriki peuvent-ils communiquer librement entre eux ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Dans l'espace psychique des démons","Par la télépathie du clan Yamanaka","Dans le monde des rêves","Par le réseau de chakra de la Statue de l'Hérétique","Au sommet du Mont Myôboku","Ils ne le peuvent pas"],"src":"Enfin, ils peuvent communiquer librement entre eux dans l'espace psychique des démons qui est inaccessible aux autres ninjas."},{"g":"Bijû & jinchûriki","d":"extreme","t":"Que signifie le mot réel dont « jinchûriki » est très proche ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["« Pouvoir tutoyant le divin »","« Celui qui porte la bête »","« Prison de chair »","« Sacrifice du village »","« Vase du démon »","« Force des neuf »"],"src":"Le mot jinchûriki, inventé par l'auteur, a une sonorité très proche du mot réel jintsûriki qui désigne un pouvoir surnaturel et se traduit par « pouvoir tutoyant le divin »."},{"g":"Bijû & jinchûriki","d":"extreme","t":"Quel astre influence les bijû et leurs jinchûriki, et pourquoi ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["La Lune, car elle enferme le corps de Jûbi","Le Soleil, car il nourrit l'Arbre Divin","Vénus, l'astre de Kaguya","La Lune, car Hagoromo y est enterré","Le Soleil, car Kurama en est né","Aucun, c'est une légende"],"src":"Étant donné que la Lune est l'astre dans lequel est enfermé le corps de Jûbi, les démons à queues et leurs jinchûriki sont particulièrement influencés par les cycles lunaires."},{"g":"Bijû & jinchûriki","d":"extreme","t":"D'après Gaara, à quel moment Shukaku est-il le plus meurtrier ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Durant la pleine lune","À la nouvelle lune","Au coucher du soleil","Pendant les tempêtes de sable","À l'aube","Quand Gaara s'endort"],"src":"D'après Gaara, c'est durant la pleine lune que Shukaku se révèle le plus meurtrier."},{"g":"Bijû & jinchûriki","d":"extreme","t":"D'où viendraient les stries sur les joues de Naruto ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Du bijû scellé en sa mère pendant la grossesse","D'une marque du clan Uzumaki","D'un sceau posé par Minato","D'une blessure de nourrisson","Du chakra de Kurama transmis à la naissance seulement","C'est un trait de son père"],"src":"Il semblerait que les enfants d'une femme jinchûriki héritent des traits du bijû scellé en leur mère. Cela expliquerait les fameuses stries sur les joues de Naruto.","n":"Le même trait se retrouve chez les <b>frères d'Or et d'Argent</b>, pour la même raison."},{"g":"Bijû & jinchûriki","d":"extreme","t":"Quel est le seul village hors des cinq grandes nations à avoir possédé un jinchûriki ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Jinch%C3%BBriki","b":1,"r":["Taki","Ame","Oto","Kusa","Yuki","Yu"],"src":"Taki est le seul village ne faisant pas partie des cinq grandes nations à avoir eu un jinchûriki."},{"g":"Bijû & jinchûriki","d":"medium","t":"D'après la légende, que peut provoquer une seule frappe de queue de Kurama ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kurama","b":1,"r":["Un raz-de-marée ou aplatir une montagne","Un tremblement de terre continental","L'assèchement d'un océan","Une éclipse","L'effondrement d'un village entier","Une tempête de mille jours"],"src":"D'après la Légende, une seule frappe de l'une de ses queues peut provoquer un raz-de-marée ou aplatir une montagne."},{"g":"Bijû & jinchûriki","d":"extreme","t":"Comment les Frères d'Or et d'Argent ont-ils survécu dans le ventre de Kurama ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kurama","b":1,"r":["En mangeant la chair de son estomac pendant deux semaines","En se scellant dans un parchemin","En buvant son chakra","Grâce à une invocation de secours","En creusant une sortie","Ils n'ont pas survécu"],"src":"les Frères d'Or et d'Argent de Kumo furent affectés à la capture de Kurama, mais ceux-ci rentrèrent dans la gueule du renard. Les deux frères réussirent à survivre et à gagner un peu de son pouvoir en mangeant la chair de son estomac durant deux semaines, forçant Kurama à les régurgiter."},{"g":"Bijû & jinchûriki","d":"hard","t":"Qu'est-ce que l'affrontement entre Madara et Hashirama a laissé derrière lui ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kurama","b":1,"r":["La Vallée de la Fin","Le Désert du Vent","Le Mur de Konoha","La Forêt de la Mort","Le lac de Kumo","Le Pays du Fer"],"src":"L'affrontement fut si intense qu'il modifia le paysage, créant la Vallée de la Fin."},{"g":"Bijû & jinchûriki","d":"veryhard","t":"Avec quel œil Madara a-t-il manipulé Kyûbi contre Hashirama ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kurama","b":1,"r":["Le Mangekyô Sharingan Éternel","Le Rinnegan","Le Sharingan à trois tomoe","Le Byakugan","Le Tenseigan","Le Rinne Sharingan"],"src":"Madara Uchiwa déserta Konoha et utilisa le Mangekyô Sharingan Éternel pour manipuler Kyûbi."},{"g":"Bijû & jinchûriki","d":"veryhard","t":"Envers quel clan Kurama voue-t-il une haine profonde ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kurama","b":1,"r":["Le clan Uchiwa","Le clan Senju","Le clan Uzumaki","Le clan Hyûga","Le clan Ôtsutsuki","Le clan Sarutobi"],"src":"Kyûbi voue une haine profonde envers les Uchiwa et leur Sharingan, certainement due aux multiples manipulations que Madara lui a infligées par le passé."},{"g":"Bijû & jinchûriki","d":"hard","t":"Quelle invocation aide Minato à neutraliser Kyûbi lors de l'attaque de Konoha ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kurama","b":1,"r":["Gamabunta","Manda","Katsuyu","Gamakichi","Ningame","Aoda"],"src":"Minato, aux côtés de Gamabunta, parvient à neutraliser Kyûbi et à le sceller en Naruto."},{"g":"Sharingan & Susanô","d":"medium","t":"Qu'est-ce qu'un Kekkei Genkai ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kekkei_Genkai","b":1,"r":["Une anomalie de l'ADN donnant accès à des techniques uniques","Un secret de famille jalousement gardé","Un pacte passé avec un bijû","Une technique interdite par les Kage","Un don accordé par le Sage des Six Chemins","Une combinaison de deux natures de chakra apprise"],"src":"Un Kekkei Genkai est une anomalie de l'ADN qui permet à celui qui le manie d'utiliser des techniques uniques."},{"g":"Sharingan & Susanô","d":"hard","t":"Quelle différence essentielle sépare un kekkei genkai d'une technique hiden ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kekkei_Genkai","b":1,"r":["Le hiden pourrait s'apprendre, on a simplement empêché les autres de le faire","Le hiden se transmet par le sang, pas le kekkei genkai","Le hiden ne s'utilise qu'une fois par jour","Le hiden vient toujours d'un bijû","Le hiden est interdit par les cinq villages","Il n'y a aucune différence"],"src":"Les techniques hiden sont exclusives à une certaine personne ou un certain clan, mais seulement parce qu'elles ont empêché les autres d'apprendre à les exécuter."},{"g":"Sharingan & Susanô","d":"veryhard","t":"Qui est connue pour posséder naturellement deux kekkei genkai ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kekkei_Genkai","b":1,"r":["Meï Terumî","Kurotsuchi","Haku","Kimimaro","Toneri Ôtsutsuki","Kaguya Ôtsutsuki"],"src":"la plupart des individus n'héritent que d'un seul kekkei genkai, mais Meï Terumî est connue pour en posséder naturellement deux."},{"g":"Sharingan & Susanô","d":"veryhard","t":"Quel kekkei genkai fait exception à la transmission de génération en génération ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kekkei_Genkai","b":1,"r":["Le Mokuton de Hashirama Senju","Le Byakugan des Hyûga","Le Hyôton de Haku","Le Shikotsumyaku de Kimimaro","Le Jiton des Kazekage","Le Sharingan des Uchiwa"],"src":"La plupart des kekkei genkai sont transmis de génération en génération au sein d'un clan, à l'exception du Mokuton de Hashirama Senju."},{"g":"Sharingan & Susanô","d":"extreme","t":"Quel kekkei genkai le bijû Shukaku possède-t-il ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Kekkei_Genkai","b":1,"r":["Le Jiton","Le Futton","Le Yôton","Le Ranton","Le Shôton","Le Mokuton"],"src":"Certains bijû possèdent des kekkei genkai, comme le Jiton de Shukaku et le Futton de Kokuô.","n":"Le Futton en leurre est celui de <b>Kokuô</b>, cité dans la même phrase."},{"g":"Sharingan & Susanô","d":"medium","t":"Qu'est-ce qui provoque l'éveil du Mangekyô Sharingan ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Le traumatisme de la perte d'un être cher","Une victoire contre un autre Uchiwa","La greffe d'un œil de son clan","Une méditation de sept jours","Un excès de chakra en combat","Le contact avec un bijû"],"src":"Cette pupille est initialement éveillée suite à un traumatisme lié à la perte d'un être cher."},{"g":"Sharingan & Susanô","d":"hard","t":"Quelle erreur d'interprétation le clan Uchiwa a-t-il commise au sujet de l'éveil du Mangekyô ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Ils croyaient devoir être responsables de la mort de l'être cher","Ils croyaient qu'il fallait survivre à une blessure mortelle","Ils croyaient qu'il fallait affronter un bijû","Ils croyaient qu'il se transmettait à la naissance","Ils croyaient qu'il fallait perdre un œil","Ils croyaient qu'il fallait tuer un Senju"],"src":"Le clan Uchiwa a historiquement mal interprété ce critère d'éveil, pensant que l'utilisateur doit être responsable de la mort de cet être cher. Pour cette raison, ils ont développé une pratique qui consiste à tuer leurs amis les plus proches."},{"g":"Sharingan & Susanô","d":"veryhard","t":"À quelle forme tous les Mangekyô Sharingan ressemblent-ils, malgré leur dessin unique ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Un moulin à vent","Une fleur de lotus","Une spirale","Une étoile à six branches","Un œil de chat","Une roue de chariot"],"src":"le Mangekyô Sharingan est une pupille à l'apparence unique pour chaque utilisateur, bien que tous aient une apparence semblable à celle d'un moulin à vent."},{"g":"Sharingan & Susanô","d":"hard","t":"Quelles techniques Itachi possède-t-il respectivement dans chacun de ses deux yeux ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Amaterasu dans un œil, Tsukuyomi dans l'autre","Amaterasu dans un œil, Susanô dans l'autre","Tsukuyomi dans un œil, Kotoamatsukami dans l'autre","Izanagi dans un œil, Izanami dans l'autre","Kamui dans un œil, Amaterasu dans l'autre","La même technique dans les deux"],"src":"Les capacités d'un Mangekyô Sharingan peuvent ne pas être les mêmes pour les deux yeux d'un seul utilisateur, car Itachi possède Amaterasu dans un œil et Tsukuyomi dans l'autre."},{"g":"Sharingan & Susanô","d":"veryhard","t":"Quelle condition faut-il remplir pour pouvoir utiliser le Susanô ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Susan%C3%B4","b":1,"r":["Avoir éveillé le Mangekyô dans ses deux yeux","Posséder le Mangekyô Sharingan Éternel","Avoir l'ADN de Hashirama","Avoir tué un membre de son propre clan","Posséder le Rinnegan","Être né Uchiwa de sang pur"],"src":"Le Susanô est le troisième pouvoir du Mangekyô Sharingan et le plus puissant des trois. Seuls ceux qui ont éveillé cette pupille dans leurs deux yeux peuvent l'utiliser."},{"g":"Sharingan & Susanô","d":"hard","t":"Par quel stade le Susanô commence-t-il toujours à se former ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Susan%C3%B4","b":1,"r":["Un squelette","Une armure complète","Une simple main","Un visage spectral","Une sphère de chakra","Une cape de flammes"],"src":"il commence par prendre l'apparence d'un squelette, puis des tissus musculaires viennent s'y agglomérer jusqu'à former un corps entier en armure et en armes."},{"g":"Sharingan & Susanô","d":"veryhard","t":"Quelle forme prennent les projectiles communs à tous les Susanô ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Susan%C3%B4","b":1,"r":["Des magatama","Des shuriken de flammes","Des éclats de cristal","Des plumes noires","Des chaînes de chakra","Des tomoe enflammés"],"src":"Les différents Susanô utilisent des pouvoirs communs tels que les lames spectrales, leur défense quasi impénétrable ou les projectiles en forme de magatama."},{"g":"Sharingan & Susanô","d":"hard","t":"Comment Madara Uchiwa définit-il le Susanô ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Susan%C3%B4","b":1,"r":["L'incarnation de la destruction","Le bouclier des dieux","La colère du clan","Le dernier rempart d'un Uchiwa","L'ombre de l'âme","Le prix du Mangekyô"],"src":"Selon Madara Uchiwa, le Susanô est l'incarnation de la destruction."},{"g":"Sharingan & Susanô","d":"extreme","t":"Quel est le véritable pouvoir de l'épée de Totsuka, portée par le Susanô d'Itachi ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Susan%C3%B4","b":1,"r":["Sceller tout ce qu'elle touche","Trancher n'importe quelle matière","Absorber le chakra de sa cible","Annuler tout genjutsu","Rendre son porteur intangible","Ressusciter celui qu'elle transperce"],"src":"En raison d'une erreur de traduction, l'épée de Totsuka portée par le Susanô d'Itachi est considérée à tort comme une « Épée de Kusanagi ». En réalité, cette lame a simplement le pouvoir de sceller tout ce qu'elle touche, y compris l'épée de Kusanagi."},{"g":"Sharingan & Susanô","d":"extreme","t":"Dans la mythologie japonaise, de quoi le dieu Susanô est-il né ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Susan%C3%B4","b":1,"r":["Du nez d'Izanagi se purifiant dans une source","De l'œil gauche d'Izanagi","De l'écume de la mer","Du souffle d'Amaterasu","D'une larme de Tsukuyomi","D'un éclair tombé sur un arbre"],"src":"Susanô, le dieu des tempêtes, naquit le jour où Izanagi se purifia dans une source et se nettoya le nez. Cela explique sans doute le long appendice dont sont affublés les Susanô de Sasuke, Itachi et Madara sous leur forme finale.","n":"C'est ce qui explique le curieux <b>appendice nasal</b> des Susanô sous leur forme finale."},{"g":"Sharingan & Susanô","d":"extreme","t":"Qu'est-ce qui distingue le Mangekyô Sharingan de Sasuke de tous les autres dans le manga ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Il a un schéma de couleurs inversé : forme rouge, iris noirs","Il tourne dans le sens inverse","Il n'a que deux branches","Il change de forme à chaque combat","Il est identique dans les deux yeux","Il ne provoque aucune cécité"],"src":"Dans le manga, le Mangekyô Sharingan de Sasuke Uchiwa est le seul à avoir un schéma de couleurs inversé, avec une forme rouge et des iris noirs."},{"g":"Sharingan & Susanô","d":"extreme","t":"Pourquoi Obito n'a-t-il jamais souffert de la détérioration de la vue liée au Mangekyô ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Il possédait l'ADN de Hashirama Senju","Il n'utilisait qu'un seul œil à la fois","Son Mangekyô était greffé, donc moins coûteux","Il se soignait avec le Mokuton de Yamato","Zetsu lui prêtait son chakra","Son Kamui ne consomme presque rien"],"src":"Bien qu'il ait largement utilisé son Mangekyô Sharingan pendant plus d'une décennie, Obito n'avait jamais présenté de signes de fatigue ou de détérioration de la vue. Cela provient peut-être du fait qu'il possède l'ADN de Hashirama Senju."},{"g":"Sharingan & Susanô","d":"extreme","t":"Comment le Mangekyô Sharingan d'Indra est-il représenté dans le manga ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Avec une forme tourbillonnante","Avec six branches","Identique à celui de Madara","Avec un seul tomoe","Comme une fleur à trois pétales","Il n'est jamais montré"],"src":"Dans le manga, le Mangekyô Sharingan d'Indra possède une forme tourbillonnante."},{"g":"Sharingan & Susanô","d":"veryhard","t":"Comment le Mangekyô Sharingan est-il surnommé dans le clan Uchiwa ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Les yeux célestes qui voient la vérité de toute la création","Les yeux qui percent les ténèbres","Le regard des dieux déchus","Les pupilles du sang versé","L'œil du destin","Le miroir des âmes"],"src":"Ils sont notés pour être « Les yeux célestes qui voient la vérité de toute la création sans obstruction »."},{"g":"Sharingan & Susanô","d":"extreme","t":"Que ressent un Uchiwa qui peine à s'attrister de la mort d'un proche ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Une irritation des yeux","Des migraines violentes","Une perte de chakra","Des vertiges","Une cécité passagère","Rien du tout"],"src":"Si une personne a du mal à se sentir attristée ou non par la mort d'une personne, elle ressentira une irritation des yeux, qui s'atténuera au fil du temps ou finira par éveiller le Mangekyô Sharingan."},{"g":"Sharingan & Susanô","d":"veryhard","t":"Que peut-on faire d'une capacité du Mangekyô Sharingan, même après la mort de son porteur ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["La programmer pour s'activer dans certaines circonstances","La transmettre à un descendant","La sceller dans un parchemin","La revendre au marché noir","La partager entre deux porteurs","Rien, elle disparaît avec lui"],"src":"Les capacités d'un Mangekyô Sharingan peuvent également être programmées pour s'activer dans certaines circonstances, soit aux yeux de l'utilisateur, soit dans la cible de son choix ; cette programmation reste même après la mort."},{"g":"Sharingan & Susanô","d":"extreme","t":"Que perçoivent les ninjas sensoriels lorsqu'un Mangekyô Sharingan est utilisé ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Une sensation, mais sans savoir quelle technique est lancée","La technique exacte en cours","Rien, le Mangekyô est indétectable","La position précise de l'utilisateur","Le nombre de tomoe activés","La douleur ressentie par l'utilisateur"],"src":"L'utilisation du Mangekyô Sharingan provoque une sensation que les ninjas sensoriels peuvent ressentir, bien qu'elle ne montre pas quelle technique est en cours d'exécution."},{"g":"Sharingan & Susanô","d":"extreme","t":"Qu'est-ce que Madara a déduit du fait que Sasuke et lui partageaient le même tomoe droit ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Mangeky%C3%B4_Sharingan","b":1,"r":["Qu'ils étaient liés par un lien plus fort que celui du sang","Que Sasuke était son descendant direct","Que Sasuke allait le trahir","Qu'ils possédaient le même œil greffé","Que Sasuke deviendrait le prochain Jûbi","Qu'ils mourraient le même jour"],"src":"Madara pouvait sentir cette forme de tomoe et en déduisit plus tard, que lui et Sasuke étaient liés par un lien plus fort que celui du sang."},{"g":"Sharingan & Susanô","d":"extreme","t":"À quel robot d'anime l'arc du Susanô de Sasuke fait-il référence ?","s":"Naruto","p":"https://naruto.fandom.com/fr/wiki/Susan%C3%B4","b":1,"r":["Yûsha Raideen","Mazinger Z","Gundam","Getter Robo","Grendizer","Evangelion"],"src":"L'arc du Susanô de Sasuke ressemble beaucoup à Yûsha Raideen. Il s'agit d'un clin d'œil à Yoshiyuki Tomino dans la série (un autre étant une technique de Kakuzu dont le nom dérive de Gundam).","n":"Gundam en leurre est vrai aussi — mais pour une technique de <b>Kakuzu</b>, pas pour l'arc."}];
const LIB = {"veryeasy":"Very Easy","easy":"Easy","medium":"Medium","hard":"Hard","veryhard":"Very Hard","extreme":"Extreme"};
const ORDRE = ["veryeasy","easy","medium","hard","veryhard","extreme"];
function copier(txt, bouton) {
  navigator.clipboard.writeText(txt).then(() => {
    const av = bouton.textContent;
    bouton.textContent = '✓'; bouton.classList.add('ok');
    setTimeout(() => { bouton.textContent = av; bouton.classList.remove('ok'); }, 800);
  });
}

function champ(etiq, valeur, classe) {
  const d = document.createElement('div'); d.className = 'champ';
  d.innerHTML = '<span class="etiq">' + etiq + '</span><span class="val ' + (classe || '') + '"></span>';
  d.children[1].textContent = valeur;
  const b = document.createElement('button'); b.className = 'c'; b.textContent = 'copier';
  b.onclick = () => copier(valeur, b);
  d.appendChild(b);
  return d;
}

const liste = document.getElementById('liste');

QUESTIONS.forEach((q, i) => {
  const c = document.createElement('div');
  c.className = 'q'; c.id = 'q' + i;
  c.dataset.d = q.d; c.dataset.g = q.g || 'divers';

  const tete = document.createElement('div'); tete.className = 'tete';
  tete.innerHTML = '<span class="num">' + (i + 1) + '</span>'
                 + '<span class="diff ' + q.d + '">' + LIB[q.d] + '</span>'
                 + '<span class="grappe">' + (q.g || '') + '</span>';
  const lab = document.createElement('label'); lab.className = 'coche';
  const cb = document.createElement('input'); cb.type = 'checkbox';
  cb.onchange = () => { c.classList.toggle('fait', cb.checked); sauver(); compter(); };
  lab.appendChild(cb); lab.appendChild(document.createTextNode('saisie'));
  tete.appendChild(lab); c.appendChild(tete);

  c.appendChild(champ('Texte', q.t));
  c.appendChild(champ('Série', q.s || 'Naruto'));
  c.appendChild(champ('Preuve', q.p, 'url'));
  c.appendChild(champ('Difficulté', LIB[q.d]));
  c.appendChild(champ('Bonne rép.', String(q.b)));
  c.appendChild(champ('Spoil', q.sp ? 'OUI' : 'non'));

  const reps = document.createElement('div'); reps.className = 'reps';
  q.r.forEach((r, k) => {
    const l = document.createElement('div');
    l.className = 'rep' + (k + 1 === q.b ? ' bonne' : '');
    l.innerHTML = '<span class="i">' + (k + 1) + '</span><span class="t"></span>';
    l.children[1].textContent = r;
    const b = document.createElement('button'); b.className = 'c'; b.textContent = 'copier';
    b.onclick = () => copier(r, b);
    l.appendChild(b); reps.appendChild(l);
  });
  c.appendChild(reps);

  const s = document.createElement('div'); s.className = 'src';
  s.textContent = '« ' + q.src + ' »';
  c.appendChild(s);

  if (q.n) { const n = document.createElement('div'); n.className = 'note'; n.innerHTML = q.n; c.appendChild(n); }
  liste.appendChild(c);
});

// ── barre de comptage ──
const parD = {}; QUESTIONS.forEach(q => parD[q.d] = (parD[q.d] || 0) + 1);
document.getElementById('barre').innerHTML =
  ORDRE.filter(d => parD[d]).map(d => '<span class="puce ' + d + '">' + LIB[d] + ' ' + parD[d] + '</span>').join('')
  + '<span class="puce" id="reste"></span>';

// ── filtres par grappe ──
const grappes = [...new Set(QUESTIONS.map(q => q.g || 'divers'))];
const fz = document.getElementById('filtres');
const btnTout = document.createElement('button');
btnTout.className = 'f actif'; btnTout.textContent = 'tout (' + QUESTIONS.length + ')';
btnTout.onclick = () => filtrer(null, btnTout);
fz.appendChild(btnTout);
grappes.forEach(g => {
  const n = QUESTIONS.filter(q => (q.g || 'divers') === g).length;
  const b = document.createElement('button');
  b.className = 'f'; b.textContent = g + ' (' + n + ')';
  b.onclick = () => filtrer(g, b);
  fz.appendChild(b);
});
function filtrer(g, bouton) {
  document.querySelectorAll('.f').forEach(x => x.classList.remove('actif'));
  bouton.classList.add('actif');
  document.querySelectorAll('.q').forEach(c => {
    c.style.display = (!g || c.dataset.g === g) ? '' : 'none';
  });
}

function sauver() {
  const etat = [...document.querySelectorAll('.coche input')].map(x => x.checked);
  try { localStorage.setItem('qsaisies2', JSON.stringify(etat)); } catch (e) {}
}
function compter() {
  const n = [...document.querySelectorAll('.coche input')].filter(x => !x.checked).length;
  const el = document.getElementById('reste');
  if (el) el.textContent = n + ' restante' + (n > 1 ? 's' : '');
}
try {
  const etat = JSON.parse(localStorage.getItem('qsaisies2') || '[]');
  document.querySelectorAll('.coche input').forEach((x, i) => {
    if (etat[i]) { x.checked = true; x.closest('.q').classList.add('fait'); }
  });
} catch (e) {}
compter();

</script></body></html>
