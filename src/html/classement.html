<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement — ShonenMaster</title>
    <meta name="description"
        content="Le classement de ShonenMaster : les meilleurs rangs, les taux de victoire par mode, les séries et les records de chaque jeu.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/png" href="/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Poppins:wght@400;600;700&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/classement.css">

    <!-- ⚠️ LES RANGS SONT CHARGÉS, JAMAIS RECOPIÉS. Les huit paliers, leurs
         couleurs et leurs divisions vivent dans `niveaux.js`, et le jeu les
         lit au même endroit : une liste recopiée ici aurait divergé au
         premier palier ajouté, et cette page se serait mise à mentir sans
         que rien ne le signale. Même chose pour les titres portés.
         Ni l'un ni l'autre n'a d'`import` — une balise suffit, ils posent
         leurs constantes dans la page. -->
    <script src="/niveaux.js"></script>
    <script src="/titres.js"></script>
</head>

<body>
    <main class="c-page">

        <a class="c-retour" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Retour au jeu
        </a>

        <!-- ⚠️ LE TITRE ET LES ONGLETS SUR LA MEME LIGNE, et le chapeau est
             descendu dans la note du bas. Le podium commençait à 390 px du
             haut : sur un portable, on arrivait sur une page de titre et de
             boutons, et il fallait défiler pour voir qui était premier. Or
             c'est la seule chose qu'on vient chercher. Les trois lignes
             gagnées le remontent au-dessus de la pliure.
             ℹ️ La règle des dix parties n'est pas perdue : elle est dite en
             bas, là où l'on va quand on se demande pourquoi on n'y est pas. -->
        <header class="c-tete">
            <h1 class="c-titre">Classement</h1>
            <!-- ⚠️ `role="tablist"` et `aria-selected` : au clavier et au
                 lecteur d'écran, ce sont des onglets, pas six boutons
                 indépendants. -->
            <nav class="c-onglets" role="tablist" aria-label="Les classements">
                <button class="c-onglet" role="tab" data-type="rang">Rang</button>
                <button class="c-onglet" role="tab" data-type="victoires">Victoires</button>
                <button class="c-onglet" role="tab" data-type="records">Records</button>
                <button class="c-onglet" role="tab" data-type="serie">Streak</button>
                <button class="c-onglet" role="tab" data-type="parties">Parties</button>
                <button class="c-onglet" role="tab" data-type="progression">Du mois</button>
            </nav>
        </header>

        <!-- Les filtres se remplissent selon l'onglet : voir `peindreFiltres`.
             ⚠️ On n'offre jamais un filtre qui ne rendrait rien — les seaux
             de comparaison sont fabriqués depuis les parties réellement
             jouées, pas écrits en dur. -->
        <div class="c-filtres" id="filtres"></div>

        <!-- ⚠️ LA REGLE EST REMONTEE SOUS LES FILTRES. Elle vivait en bas de
             page, et c est l endroit ou personne ne la lit : la question
             « pourquoi je n y suis pas » se pose en REGARDANT le tableau, pas
             apres l avoir parcouru jusqu au bout. Une seule phrase, celle qui
             repond a cette question-la — le reste est descendu. -->
        <!-- ⚠️ CETTE PHRASE SE REECRIT, ET ELLE DISPARAIT QUAND ELLE NE
             S APPLIQUE PAS. Elle disait « dix parties jouées » en dur, sur
             TOUS les onglets — y compris Rang et Records, qui n ont aucun
             plancher. Elle y mentait, et c est ce qui a fait croire que les
             records attendaient dix parties alors qu ils s affichaient des la
             premiere. Le serveur dit maintenant le seuil de l onglet demandé
             (`minParties`), et zero veut dire « pas de mention ». -->
        <p class="c-regle" id="c-regle" hidden></p>

        <!-- 🔎 ⚠️ UNE RECHERCHE SERVEUR, pas un filtre de la liste affichée.
             La page n'en reçoit que cinquante lignes : y chercher le 312e ne
             le trouverait jamais, et son absence se lirait comme « ce joueur
             n'existe pas ». -->
        <label class="c-chercher">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
            </svg>
            <input id="recherche" type="search" autocomplete="off"
                   placeholder="Chercher un joueur…" aria-label="Chercher un joueur">
        </label>

        <div class="c-moi trouve" id="trouve" hidden></div>

        <div class="c-mesure">
            <span id="mesure">—</span>
            <span id="compte"></span>
        </div>

        <div id="tableau"></div>

        <!-- 👤 LA BARRE DU VISITEUR, collée en bas de l'écran.
             ⚠️ FIXE, et elle ne paraît QUE si le joueur n'est pas déjà dans
             la liste affichée. Doublée d'une ligne qu'on voit juste au-dessus,
             elle ferait répéter la page ; absente quand on est 312e, on
             n'aurait aucun moyen de savoir où l'on est — c'est précisément
             le cas qu'elle sert.
             ⚠️ Elle est HORS du conteneur de la page, après lui : un
             `position: fixed` dont un ancêtre porte un `transform` se cale
             sur cet ancêtre et non sur l'écran. Ici il n'y en a pas, mais
             rien n'empêche qu'on en ajoute un demain. -->
        <div class="c-moi" id="maplace" hidden></div>

        <!-- ℹ️ LA NOTE DU BAS EST PARTIE. Elle disait trois choses vraies — le
             départage des ex æquo, le fait que le classement ne reprend pas
             l'historique, l'exclusion des parties avec bot — mais aucune ne
             se lit au bas d'une page qu'on parcourt pour chercher un nom.
             Les deux premières sont des détails de mécanique, la troisième
             est dite à sa place : sous le tableau des records, où elle
             s'applique. La seule règle qu'un joueur doit connaître — les dix
             parties — est en haut, sous les filtres. -->


    </main>

<script>
// ⚠️ TOUT DANS UNE IIFE. Une `const` au premier niveau d'un script de page
// vit dans l'environnement lexical GLOBAL : `CHIFFRES`, déclaré comme ça
// dans une autre page, est déjà entré en collision avec `niveaux.js` et a
// tué le script sans un mot dans la console. Ici deux fichiers sont chargés
// avant nous — `niveaux.js` et `titres.js` —, le risque est double.
(function () {
'use strict';

// ⚠️ PAS DE « Rivalité ». Ce n'est pas un mode, c'est le réglage Format du
// quiz : mêmes questions, même barème. Deux chips côte à côte faisaient
// croire à deux jeux différents. Ses parties comptent dans « Tous ».
var MODES = [
    { id: null,        nom: 'Tous' },
    { id: 'classic',   nom: 'Classique' },
    { id: 'bombanime', nom: 'BombAnime' },
    { id: 'rush',      nom: 'Rush' },
    { id: 'ascension', nom: 'Ascension' },
    { id: 'collect',   nom: 'Collect' },
];

// Ce que chaque onglet mesure, et comment l'écrire.
//
// ⚠️ `modes` dit si le tableau se décline par mode, et `nul` ce qu'on montre
// quand il est vide. Les six onglets partagent tout le reste — le podium, la
// liste, les filtres — et n'ont que cette table pour différer. Six fonctions
// auraient divergé à la première retouche.
var TABLEAUX = {
    rang: {
        titre: 'Expérience totale',
        modes: false, periodes: false,
        format: function (v) { return fmt(v) + ' <small>XP</small>'; },
        appoint: function (l) { return l.parties ? fmt(l.parties) + ' parties' : 'aucune partie'; },
        vide: 'Aucun compte pour le moment.',
    },
    victoires: {
        titre: 'Taux de victoire',
        modes: true, periodes: false,
        format: function (v) { return v + ' <small>%</small>'; },
        appoint: function (l) { return l.victoires + ' / ' + l.parties; },
        vide: 'Personne ne remplit encore la condition.',
    },
    serie: {
        titre: 'Plus longue série de victoires',
        modes: true, periodes: false,
        format: function (v) { return fmt(v) + ' <small>d’affilée</small>'; },
        appoint: function (l) { return l.victoires + ' victoire' + (l.victoires > 1 ? 's' : ''); },
        vide: 'Aucune série enregistrée pour le moment.',
    },
    parties: {
        titre: 'Parties jouées',
        modes: true, periodes: false,
        format: function (v) { return fmt(v) + ' <small>parties</small>'; },
        appoint: function (l) { return l.victoires + ' gagnée' + (l.victoires > 1 ? 's' : ''); },
        vide: 'Personne ne remplit encore la condition.',
    },
    progression: {
        titre: 'Expérience des 30 derniers jours',
        modes: false, periodes: false,
        format: function (v) { return '+' + fmt(v) + ' <small>XP</small>'; },
        appoint: function (l) { return fmt(l.parties) + ' parties au total'; },
        vide: 'Aucune partie sur les trente derniers jours.',
    },
    records: {
        titre: 'Records',
        modes: true, periodes: true, modeObligatoire: true,
        // Rempli par la réponse du serveur : le libellé et l'unité dépendent
        // du mode, et c'est le serveur qui en est la source.
        format: null,
        appoint: null,
        vide: 'Aucun record pour ce réglage.',
    },
};

var etat = { type: 'rang', mode: null, periode: 'all', seau: 'tous' };
// 🧪 `?demo` remplit la page de joueurs fabriqués, pour la régler. ⚠️ Le
// serveur le REFUSE en production : ici on ne fait que transmettre, la
// décision n'est pas prise côté navigateur — un drapeau que le client
// contrôle n'en est pas un.
var DEMO = /(\?|&)demo\b/.test(location.search) ? '&demo=1' : '';

// 👤 QUI REGARDE. ⚠️ Lu dans `localStorage`, où le jeu range le pseudo
// (`pseudo`) : cette page est servie en statique, elle n'a pas de session.
// Ce n'est pas une preuve d'identité et ça n'a pas à en être une — on ne
// fait que SURLIGNER une ligne et montrer une place, deux choses déjà
// publiques. Rien ici ne donne de droit.
var monPseudo = (function () {
    try { return (localStorage.getItem('pseudo') || '').trim(); }
    catch (e) { return ''; }
})();
var maPlaceEnCours = 0;
var seauxConnus = { nom: null, unite: '', liste: [] };
var requeteEnCours = 0;

function $(id) { return document.getElementById(id); }
function fmt(n) { return (Number(n) || 0).toLocaleString('fr-FR'); }
function echappe(s) {
    return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// Le rang d'un joueur, depuis son xp. ⚠️ Calculé ICI et non envoyé par le
// serveur : les deux côtés lisent le même `niveaux.js`, donc un palier
// ajouté là-bas se voit ici sans toucher à l'API.
function rangDe(xp) {
    try { return titrePourNiveau(niveauPourXp(xp)); }
    catch (e) { return { nom: '', couleur: '#8f8f99' }; }
}

// Le titre porté, composé depuis le catalogue partagé.
function titreDe(l) {
    try {
        if (!l.titrePrefixe && !l.titreSuffixe) return '';
        return composerTitre(l.titrePrefixe, l.titreSuffixe) || '';
    } catch (e) { return ''; }
}

// 🏅 LA MEDAILLE DU PODIUM, en SVG plutôt qu'en chiffre.
//
// ⚠️ UN DESSIN, PAS UN EMOJI. 🥇🥈🥉 auraient suffi en une ligne, mais ils
// sont rendus par la police du système : gris et plats chez les uns, en
// couleurs chez les autres, et d'une taille qui ne suit aucune règle du
// reste de la page. Un SVG garde la même forme partout et prend la teinte
// qu'on lui donne.
// ⚠️ Et le CHIFFRE A DISPARU : l'escalier et l'ordre le disent déjà. Un « 1 »
// posé sur une médaille d'or répète ce qu'elle signifie.
function medaille(place) {
    var or = { 1: ['#fff3bf', '#f0b429'], 2: ['#ffffff', '#b9bec7'], 3: ['#f0c39a', '#b5733f'] }[place]
          || ['#fff', '#999'];
    return '<span class="c-medaille m' + place + '">'
        + '<svg viewBox="0 0 24 24" aria-hidden="true">'
          + '<defs><linearGradient id="g' + place + '" x1="0" y1="0" x2="0" y2="1">'
            + '<stop offset="0" stop-color="' + or[0] + '"/>'
            + '<stop offset="1" stop-color="' + or[1] + '"/>'
          + '</linearGradient></defs>'
          // Les deux rubans, puis le disque par-dessus.
          + '<path d="M8.2 2h3.1l2.6 6.4-3.1 1.2z" fill="' + or[1] + '" opacity=".75"/>'
          + '<path d="M15.8 2h-3.1l-2.6 6.4 3.1 1.2z" fill="' + or[1] + '" opacity=".5"/>'
          + '<circle cx="12" cy="15.2" r="6.4" fill="url(#g' + place + ')"/>'
          + '<circle cx="12" cy="15.2" r="4.3" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="1"/>'
        + '</svg></span>';
}

function avatar(l) {
    // ⚠️ `onerror` vide l'image plutôt que de laisser l'icône de lien cassé :
    // un avatar supprimé du dossier ne doit pas trouer la ligne.
    var src = l.avatar ? '/' + encodeURIComponent(l.avatar) : '/novice.png';
    return '<img class="c-ava" src="' + src + '" alt="" loading="lazy" '
         + 'onerror="this.style.visibility=\'hidden\'">';
}

// ───── Les filtres ─────
function peindreFiltres() {
    var def = TABLEAUX[etat.type];
    var h = '';

    // ⚠️ CHAQUE FILTRE EST UN GROUPE FERME, avec son nom dedans : c'est le
    // rail qui porte le fond, pas les puces. Sans ça la rangée comptait une
    // douzaine de petites boîtes encadrées de même poids, qui faisaient
    // concurrence aux bordures du tableau juste dessous.
    if (def.modes) {
        h += '<span class="c-groupe"><span class="c-filtres-nom">Mode</span>';
        for (var i = 0; i < MODES.length; i++) {
            var m = MODES[i];
            // ⚠️ « Tous » disparaît pour les records : un record n'a de sens
            // que dans son mode. Mélanger un temps d'Ascension et un nombre
            // de personnages donnerait un tableau qui ne veut rien dire.
            if (def.modeObligatoire && m.id === null) continue;
            h += '<button class="c-puce" data-mode="' + (m.id || '') + '" '
               + 'aria-pressed="' + (etat.mode === m.id) + '">' + m.nom + '</button>';
        }
        h += '</span>';
    }

    if (def.periodes) {
        h += '<span class="c-groupe"><span class="c-filtres-nom">Période</span>'
           + '<button class="c-puce" data-periode="all" aria-pressed="' + (etat.periode === 'all') + '">All time</button>'
           + '<button class="c-puce" data-periode="mois" aria-pressed="' + (etat.periode === 'mois') + '">30 jours</button>'
           + '</span>';
    }

    // ⚠️ Le seau n'apparaît QUE s'il y a plus d'une valeur jouée, et son nom
    // vient du serveur — « Durée » pour Rush, « Série » pour BombAnime,
    // « Étages » pour Ascension. Les modes qui n'ont pas de réglage
    // comparable, comme le Classique, n'affichent rien du tout.
    // ⚠️ PAS DE « TOUS » ICI. Il en avait un, et il ne voulait rien dire :
    // mélanger les personnages trouvés en Naruto et ceux trouvés toutes
    // séries confondues ne donne pas un record, ça donne un tas. Chaque
    // série est un sujet, et chacune a le sien. On en choisit donc toujours
    // une — la plus jouée par défaut.
    if (def.modeObligatoire && seauxConnus.liste.length) {
        // ⚠️ UN SAUT DE LIGNE EXPLICITE. Le groupe des séries de BombAnime
        // passait à la ligne tout seul, mais par accident : ses cinq boutons
        // débordaient. Les deux durées de Rush tenaient sur la première
        // ligne, et la barre n'avait plus la même forme d'un mode à l'autre.
        // Le saut la fixe. Voir `.c-saut` — il force le retour sans étirer
        // la boîte, qui doit épouser ses boutons comme les deux autres.
        h += '<span class="c-saut" aria-hidden="true"></span>';
        h += '<span class="c-groupe"><span class="c-filtres-nom">' + echappe(seauxConnus.nom || 'Réglage') + '</span>';
        for (var j = 0; j < seauxConnus.liste.length; j++) {
            var s = seauxConnus.liste[j];
            // ⚠️ L'unité ne va QUE dans le libellé, jamais dans `data-seau` :
            // c'est cette valeur-là qui repart au serveur et qui est comparée
            // à `reglages->>duree`. Un « 60 s » dans l'attribut ne trouverait
            // aucune ligne, et la page serait vide sans la moindre erreur.
            var etiq = echappe(s.valeur) + (seauxConnus.unite ? '&nbsp;' + echappe(seauxConnus.unite) : '');
            h += '<button class="c-puce serie" data-seau="' + echappe(s.valeur) + '" '
               + 'aria-pressed="' + (etat.seau === String(s.valeur)) + '">' + etiq + '</button>';
        }
        h += '</span>';
    }

    $('filtres').innerHTML = h;
    $('filtres').style.display = h ? '' : 'none';
}

// ───── Le tableau ─────
function marche(l, place, def) {
    var r = rangDe(l.xp);
    var t = titreDe(l);
    // ⚠️ `--i` porte le rang d'arrivée : c'est lui qui décale l'animation.
    // En CSS pur il aurait fallu une règle `nth-child` par ligne, et la
    // cinquante-et-unième n'aurait rien eu.
    // ⚠️ L AVATAR DEBORDE PAR LE HAUT de la carte, et le numero de place est
    // une pastille posee sur son coin. C est ce qui transforme trois
    // rectangles alignes en un podium : la carte devient un socle, et ce
    // qu on regarde en premier — le visage — sort du cadre.
    return '<div class="c-marche p' + place + '" style="--teinte:' + r.couleur
        + ';--i:' + (place - 1) + '">'
        // ⚠️ Les étincelles sont DANS la carte, qui coupe ce qui dépasse :
        // c'est la seule façon qu'elles ne bavent jamais sur les voisines.
        + '<span class="c-etincelles" aria-hidden="true">'
          + '<i></i><i></i><i></i><i></i><i></i>'
        + '</span>'
        + '<span class="c-couronne">' + avatar(l) + medaille(place) + '</span>'
        + '<span class="c-ident">'
          + '<span class="c-nom">' + echappe(l.pseudo) + '</span>'
          + '<span class="c-rang">' + echappe(r.nom) + (t ? ' · ' + echappe(t) : '') + '</span>'
        + '</span>'
        + '<span class="c-val">' + def.format(l.valeur) + '</span>'
        + '</div>';
}

function ligne(l, place, def) {
    var r = rangDe(l.xp);
    // 🎖️ LE TITRE PORTE, a la suite du rang — comme sur les cartes du podium.
    // ⚠️ Il peut etre vide : un compte neuf n en a aucun tant qu il n a pas
    // recu le titre de depart, et le point median ne doit pas s afficher tout
    // seul derriere le rang.
    var t = titreDe(l);
    var appoint = def.appoint ? def.appoint(l) : '';
    // Le visiteur se reconnaît dans la liste. ⚠️ Comparé en minuscules :
    // le pseudo rangé par le navigateur peut différer de celui de la base
    // par la casse — `Nahass` et `nahass` sont le même joueur.
    var moi = monPseudo && l.pseudo && l.pseudo.toLowerCase() === monPseudo.toLowerCase();
    // ⚠️ LE RANG EST SUR LA LIGNE DU PSEUDO, dans une puce à sa droite, et
    // non en dessous. En dessous il se lisait comme une légende du nom ; à
    // côté, il se lit comme ce qu'il est — un titre que le joueur porte. Ce
    // qui reste en seconde ligne, c'est le décompte, qui n'est qu'un détail.
    return '<li class="c-ligne' + (moi ? ' moi' : '') + '" style="--teinte:' + r.couleur
        + ';--i:' + (place - 4) + '">'
        + '<span class="c-num">' + place + '</span>'
        + avatar(l)
        + '<span class="c-ident">'
          + '<span class="c-tete-ligne">'
            + '<span class="c-nom">' + echappe(l.pseudo) + '</span>'
            + '<span class="c-puce-rang">' + echappe(r.nom)
              + (t ? ' <span class="c-titre-ligne">· ' + echappe(t) + '</span>' : '') + '</span>'
          + '</span>'
          + (appoint ? '<span class="c-sous">' + echappe(appoint) + '</span>' : '')
        + '</span>'
        + '<span class="c-droite"><span class="c-val">' + def.format(l.valeur) + '</span></span>'
        + '</li>';
}

function peindre(lignes, def) {
    var h = '';
    var podium = lignes.slice(0, 3);
    var reste = lignes.slice(3);

    if (podium.length) {
        h += '<div class="c-podium">';
        for (var i = 0; i < podium.length; i++) h += marche(podium[i], i + 1, def);
        h += '</div>';
    }
    if (reste.length) {
        h += '<ol class="c-liste">';
        for (var j = 0; j < reste.length; j++) h += ligne(reste[j], j + 4, def);
        h += '</ol>';
    }
    $('tableau').innerHTML = h;
}

function etatVide(titre, texte) {
    $('tableau').innerHTML = '<div class="c-etat"><strong>' + echappe(titre) + '</strong>'
        + '<p>' + texte + '</p></div>';
}

function squelette() {
    var h = '<div class="c-squelette">';
    for (var i = 0; i < 6; i++) h += '<span></span>';
    $('tableau').innerHTML = h + '</div>';
}

// ───── Aller chercher ─────
async function charger() {
    var def = TABLEAUX[etat.type];
    var monTour = ++requeteEnCours;
    squelette();
    $('compte').textContent = '';

    // Les seaux d'abord : ils changent la barre de filtres, et il vaut mieux
    // la peindre une fois complète que la voir s'allonger sous le curseur.
    if (def.modeObligatoire) {
        try {
            var rs = await fetch('/api/classement/seaux?mode=' + encodeURIComponent(etat.mode || '') + DEMO);
            var js = await rs.json();
            if (monTour !== requeteEnCours) return;
            seauxConnus = { nom: js.nom, unite: js.unite || '', liste: js.seaux || [] };
            // ⚠️ Il n'y a plus de « Tous » : il faut donc qu'un seau soit
            // choisi avant le premier affichage, sinon le serveur rendrait
            // toutes les parties mêlées — exactement ce qu'on vient de
            // retirer.
            //
            // ⚠️ ET ON PREND LE PREMIER SEAU **QUI A DES PARTIES**, pas le
            // premier de la liste. Les séries de BombAnime arrivent triées
            // par fréquence, donc les deux revenaient au même ; les durées de
            // Rush, non — elles sont triées par valeur et toutes offertes,
            // même vides. « 60 » ouvre donc la liste, et le choisir d'office
            // aurait montré un classement vide à l'arrivée alors que 90 et
            // 120 en ont un.
            if (seauxConnus.liste.length
                && !seauxConnus.liste.some(function (s) { return String(s.valeur) === etat.seau; })) {
                var plein = null;
                for (var k = 0; k < seauxConnus.liste.length; k++) {
                    if ((seauxConnus.liste[k].parties || 0) > 0) { plein = seauxConnus.liste[k]; break; }
                }
                etat.seau = String((plein || seauxConnus.liste[0]).valeur);
            }
        } catch (e) { seauxConnus = { nom: null, liste: [] }; }
        peindreFiltres();
    }

    var url = '/api/classement?type=' + encodeURIComponent(etat.type)
        + (etat.mode ? '&mode=' + encodeURIComponent(etat.mode) : '')
        + (def.periodes ? '&periode=' + encodeURIComponent(etat.periode) : '')
        + (def.modeObligatoire ? '&seau=' + encodeURIComponent(etat.seau) : '') + DEMO;

    try {
        var rep = await fetch(url);
        var data = await rep.json();
        // ⚠️ Une réponse qui arrive APRÈS qu'on a changé d'onglet ne doit
        // rien peindre : sans ce garde-fou, cliquer vite sur trois onglets
        // laisse le plus LENT gagner, et le tableau affiché ne correspond
        // plus à l'onglet allumé.
        if (monTour !== requeteEnCours) return;

        if (data.vuesAbsentes) {
            return etatVide('Le classement n’est pas encore branché',
                'Les vues de la base n’ont pas été créées. Rien n’est perdu : les parties sont enregistrées, le tableau apparaîtra dès qu’elles le seront.');
        }
        if (data.actif === false) {
            return etatVide('Les comptes ne sont pas activés',
                'Le classement suit les comptes, et il n’y en a pas sur ce serveur.');
        }

        var lignes = data.lignes || [];
        $('compte').textContent = lignes.length
            ? lignes.length + (lignes.length > 1 ? ' joueurs' : ' joueur') : '';

        // ⚠️ LE PLANCHER DE L ONGLET, DIT PAR LE SERVEUR. Zéro veut dire
        // « aucun » — c'est le cas du Rang et des Records, et la mention
        // disparaît alors au lieu d'annoncer une règle qui ne s'applique pas.
        var seuilOnglet = Number(data.minParties) || 0;
        var regle = $('c-regle');
        if (regle) {
            // On n'écrit la phrase que si on la montre : « à partir de 0
            // parties jouées » n'a pas à traîner dans le document, même caché.
            regle.hidden = seuilOnglet < 2;
            regle.innerHTML = regle.hidden ? '' : 'Les comptes figurent ici à partir de <b>'
                + seuilOnglet + ' parties jouées</b>, tous modes confondus.';
        }

        // Les records portent leur propre libellé et leur sens : c'est le
        // serveur qui les donne, parce que c'est lui qui les décide.
        if (etat.type === 'records') {
            var rec = data.record || {};
            def.format = function (v) {
                return fmt(v) + (rec.unite ? ' <small>' + rec.unite + '</small>' : '');
            };
            def.appoint = null;
            // ⚠️ LE LIBELLE EN CLAIR ET EN COULEUR, le reste en gris. Toute
            // la ligne était du même gris minuscule : on ne savait pas ce que
            // mesurait la colonne de droite sans la lire mot à mot. Le nom de
            // la mesure est la seule chose qu'on doit saisir d'un coup d'œil.
            $('mesure').innerHTML = '<b>' + echappe(rec.libelle || 'Record') + '</b>'
                + '<em>' + (rec.sens === 'min' ? 'le plus court' : 'le plus élevé')
                + (rec.precision ? ' · ' + echappe(rec.precision) : '') + '</em>';
        } else {
            $('mesure').innerHTML = '<b>' + echappe(def.titre) + '</b>';
        }

        if (!lignes.length) {
            maPlace(null, def);
            return etatVide('Rien à montrer pour l’instant',
                echappe(def.vide) + ' Le classement se remplit à chaque partie terminée par un compte connecté.');
        }
        peindre(lignes, def);
        maPlace(lignes, def);
    } catch (e) {
        if (monTour !== requeteEnCours) return;
        etatVide('Classement indisponible', 'Le serveur n’a pas répondu. Réessaie dans un instant.');
    }
}

// ───── « Ta place », en bas de l'écran ─────
//
// ⚠️ On ne la demande au serveur QUE si le joueur n'est pas déjà visible.
// Dans le cas courant — le podium ou les cinquante premiers — la barre ne
// sert à rien et la requête serait du bruit à chaque changement d'onglet.
async function maPlace(lignes, def) {
    var boite = $('maplace');
    var demande = ++maPlaceEnCours;
    if (!monPseudo || etat.type === 'records') { boite.hidden = true; return; }
    if (lignes && lignes.some(function (l) {
        return l.pseudo && l.pseudo.toLowerCase() === monPseudo.toLowerCase();
    })) { boite.hidden = true; return; }

    try {
        var rep = await fetch('/api/classement/joueur?pseudo=' + encodeURIComponent(monPseudo)
            + '&type=' + encodeURIComponent(etat.type)
            + (etat.mode ? '&mode=' + encodeURIComponent(etat.mode) : '') + DEMO);
        var d = await rep.json();
        if (demande !== maPlaceEnCours) return;
        if (!d.trouve) { boite.hidden = true; return; }

        if (d.souslePlancher) {
            // ⚠️ PLUS DE TIRET A LA PLACE DU RANG. Un « — » dans la colonne
            // des positions se lit comme une position NULLE, donc comme un
            // echec ; or il n y a rien d anormal a ne pas encore figurer.
            // La ligne n est plus qu une phrase.
            // ⚠️ ET LE SEUIL SE RECALCULE — `parties + manque` — plutot que
            // de s ecrire « dix ». Il vit dans `plancherDuClassement`
            // (server.js), DIFFERE SELON L ONGLET — le taux de victoire en
            // demande cinq quand les autres en demandent une — et se regle
            // par variable d environnement : un nombre fige ici se serait mis
            // a mentir au premier changement, sans que rien ne le signale.
            var seuil = (d.parties || 0) + (d.manque || 0);
            boite.innerHTML = '<span class="c-moi-txt">Tu n’apparais pas encore au '
                + 'classement : il faut <b>' + seuil + ' parties</b> pour y entrer'
                + (d.manque ? ', il t’en reste <b>' + d.manque + '</b>' : '') + '.</span>';
            boite.hidden = false;
            return;
        }
        var r = rangDe(d.ligne.xp);
        boite.style.setProperty('--teinte', r.couleur);
        boite.innerHTML = '<span class="c-moi-rang">' + d.position + '<sup>e</sup></span>'
            + avatar(d.ligne)
            + '<span class="c-ident"><span class="c-tete-ligne">'
              + '<span class="c-nom">' + echappe(d.ligne.pseudo) + '</span>'
              + '<span class="c-puce-rang">' + echappe(r.nom) + '</span>'
            + '</span><span class="c-sous">sur ' + fmt(d.total) + ' joueurs classés</span></span>'
            + '<span class="c-val">' + def.format(d.ligne.valeur) + '</span>';
        boite.hidden = false;
    } catch (e) { boite.hidden = true; }
}

// ───── Chercher un joueur ─────
//
// ⚠️ LA RECHERCHE PASSE PAR LE SERVEUR, elle ne filtre pas la liste
// affichée : celle-ci n'a que cinquante lignes, et chercher le 312e dedans
// ne le trouverait jamais — l'absence se lirait comme « ce joueur n'existe
// pas », ce qui est faux.
var chercheEnCours = 0;
async function chercher(pseudo) {
    var boite = $('trouve');
    var demande = ++chercheEnCours;
    pseudo = (pseudo || '').trim();
    if (!pseudo) { boite.hidden = true; return; }
    if (etat.type === 'records') {
        boite.innerHTML = '<span class="c-moi-txt">La recherche ne s’applique pas aux records :'
            + ' ils classent des parties, pas des joueurs.</span>';
        boite.hidden = false;
        return;
    }
    try {
        var rep = await fetch('/api/classement/joueur?pseudo=' + encodeURIComponent(pseudo)
            + '&type=' + encodeURIComponent(etat.type)
            + (etat.mode ? '&mode=' + encodeURIComponent(etat.mode) : '') + DEMO);
        var d = await rep.json();
        if (demande !== chercheEnCours) return;
        var def = TABLEAUX[etat.type];
        if (!d.trouve) {
            boite.innerHTML = '<span class="c-moi-txt">Aucun compte nommé <b>'
                + echappe(pseudo) + '</b>.</span>';
            boite.hidden = false;
            return;
        }
        if (d.souslePlancher) {
            // ⚠️ Le seuil se recalcule ici AUSSI. Il etait ecrit « dix » en
            // toutes lettres : la recherche d un autre joueur et la ligne du
            // visiteur auraient fini par annoncer deux nombres differents.
            boite.innerHTML = '<span class="c-moi-txt"><b>' + echappe(pseudo) + '</b> a joué '
                + d.parties + ' partie' + (d.parties > 1 ? 's' : '')
                + ' — il en faut <b>' + ((d.parties || 0) + (d.manque || 0))
                + '</b> pour figurer au classement.</span>';
            boite.hidden = false;
            return;
        }
        var r = rangDe(d.ligne.xp);
        boite.style.setProperty('--teinte', r.couleur);
        boite.innerHTML = '<span class="c-moi-rang">' + d.position + '<sup>e</sup></span>'
            + avatar(d.ligne)
            + '<span class="c-ident"><span class="c-tete-ligne">'
              + '<span class="c-nom">' + echappe(d.ligne.pseudo) + '</span>'
              + '<span class="c-puce-rang">' + echappe(r.nom) + '</span>'
            + '</span><span class="c-sous">sur ' + fmt(d.total) + ' joueurs classés</span></span>'
            + '<span class="c-val">' + def.format(d.ligne.valeur) + '</span>';
        boite.hidden = false;
    } catch (e) { boite.hidden = true; }
}

// ⚠️ On attend 320 ms après la dernière touche. Sans ce délai, « Shinobi »
// part en huit requêtes dont sept jetées — et la septième peut revenir
// après la huitième.
var minuteurRecherche = null;
$('recherche').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(minuteurRecherche);
    minuteurRecherche = setTimeout(function () { chercher(v); }, 320);
});

// ───── Les clics ─────
function choisirOnglet(type) {
    etat.type = type;
    var def = TABLEAUX[type];
    // ⚠️ Un onglet qui EXIGE un mode en prend un par défaut : sans ça
    // « Records » s'ouvrirait sur « Tous », que le serveur refuse, et la
    // page paraîtrait cassée au premier clic.
    if (def.modeObligatoire && !etat.mode) etat.mode = 'bombanime';
    if (!def.modes) etat.mode = null;
    etat.seau = 'tous';
    seauxConnus = { nom: null, liste: [] };

    var ongl = document.querySelectorAll('.c-onglet');
    for (var i = 0; i < ongl.length; i++) {
        ongl[i].setAttribute('aria-selected', String(ongl[i].dataset.type === type));
    }
    peindreFiltres();
    charger();
}

document.querySelector('.c-onglets').addEventListener('click', function (e) {
    var b = e.target.closest('.c-onglet');
    if (b) choisirOnglet(b.dataset.type);
});

$('filtres').addEventListener('click', function (e) {
    var b = e.target.closest('.c-puce');
    if (!b) return;
    if (b.dataset.mode !== undefined) {
        etat.mode = b.dataset.mode || null;
        etat.seau = 'tous';
        seauxConnus = { nom: null, liste: [] };
    } else if (b.dataset.periode !== undefined) {
        etat.periode = b.dataset.periode;
    } else if (b.dataset.seau !== undefined) {
        etat.seau = b.dataset.seau;
    }
    peindreFiltres();
    charger();
});

choisirOnglet('rang');
})();
</script>
</body>

</html>
