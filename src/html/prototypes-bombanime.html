<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShonenMaster — Prototype BombAnime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        :root {
            --neon: #FFD700;
            --accent: #FF8C00;
            --txt: #fff;
            --txt2: #a0a0a0;
            --hp: #ff5a6e;
            --ok: #6ee7b7;
            --danger: #ff4d4d;

            /* Pilotés par le panneau de réglages */
            --tension: 0;          /* 0 = calme, 1 = imminent */
            --taille-cercle: 20rem;
            --taille-hex: 6rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: radial-gradient(120% 90% at 50% 0%, #14100a 0%, #0c0c0e 45%, #08080a 100%);
            background-attachment: fixed;
            color: var(--txt);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* ── Navigation entre prototypes ── */
        .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 90; display: flex; gap: .5rem; flex-wrap: wrap; padding: .7rem 1rem; background: rgba(8,8,10,.85); backdrop-filter: blur(.4rem); }
        .nav a { padding: .35rem .7rem; font-size: .7rem; font-weight: 600; text-decoration: none; color: var(--txt2); background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 2rem; }
        .nav a:hover, .nav a.on { color: var(--neon); border-color: rgba(255,215,0,.4); }

        /* ══════════════════════════════════════
           LA SCÈNE
           ══════════════════════════════════════ */
        .scene {
            position: relative;
            height: 100vh;
            display: grid;
            place-items: center;
            /* La tension secoue discrètement toute la scène */
            animation: trembler .12s infinite;
        }

        @keyframes trembler {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(calc(var(--tension) * 2px - 1px), calc(var(--tension) * 2px - 1px)); }
        }

        /* Halo rouge qui monte avec la tension */
        .scene::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(80% 60% at 50% 50%, transparent 40%, rgba(255, 60, 60, calc(var(--tension) * .22)) 100%);
            transition: background .3s linear;
        }

        /* ── Le cercle des joueurs ── */
        .cercle {
            position: relative;
            width: var(--taille-cercle);
            height: var(--taille-cercle);
        }

        /* Le fil qui relie les joueurs, dessiné en pointillés tournants */
        .cercle::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, .07);
            animation: tournerFil 60s linear infinite;
        }

        @keyframes tournerFil { to { transform: rotate(360deg); } }

        .joueur {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--taille-hex);
            height: var(--taille-hex);
            margin: calc(var(--taille-hex) / -2);
            transition: transform .5s cubic-bezier(.2,.9,.25,1), opacity .4s ease;
        }

        .hex {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            clip-path: polygon(50% 2%, 97% 26%, 97% 74%, 50% 98%, 3% 74%, 3% 26%);
            background: linear-gradient(160deg, #1c1a15, #101012);
            transition: background .3s ease, filter .3s ease;
        }

        .hex-bord {
            position: absolute;
            inset: 0;
            clip-path: polygon(50% 2%, 97% 26%, 97% 74%, 50% 98%, 3% 74%, 3% 26%);
            background: rgba(255, 255, 255, .1);
            z-index: -1;
            transform: scale(1.06);
        }

        .hex .initiale {
            font-family: 'Bebas Neue', sans-serif;
            font-size: calc(var(--taille-hex) * .38);
            color: rgba(255, 255, 255, .3);
            transition: color .3s ease;
        }

        .nom {
            position: absolute;
            bottom: calc(100% + .45rem);
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: .72rem;
            font-weight: 700;
            color: var(--txt2);
            transition: color .3s ease;
        }

        .vies {
            position: absolute;
            top: calc(100% + .35rem);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: .18rem;
        }

        .vies i { width: .5rem; height: .5rem; background: var(--hp); clip-path: polygon(50% 100%, 0 35%, 25% 0, 50% 20%, 75% 0, 100% 35%); }
        .vies i.off { background: rgba(255, 255, 255, .12); }

        /* Le joueur dont c'est le tour */
        .joueur.actif { transform: scale(1.14); z-index: 5; }
        .joueur.actif .hex { background: linear-gradient(160deg, #2a2318, #1a1712); }
        .joueur.actif .hex-bord { background: var(--neon); transform: scale(1.1); box-shadow: 0 0 1.6rem rgba(255, 190, 40, .55); }
        .joueur.actif .nom { color: var(--neon); }
        .joueur.actif .initiale { color: var(--neon); }

        /* L'anneau de temps, tracé autour du joueur actif */
        .anneau {
            position: absolute;
            inset: -.55rem;
            opacity: 0;
            transform: rotate(-90deg);
            transition: opacity .25s ease;
        }

        .joueur.actif .anneau { opacity: 1; }
        .anneau circle { fill: none; stroke-width: 3; stroke-linecap: round; }
        .anneau .rail { stroke: rgba(255, 255, 255, .07); }
        .anneau .jauge {
            stroke: var(--neon);
            stroke-dasharray: 289;
            filter: drop-shadow(0 0 .3rem rgba(255, 190, 40, .7));
            transition: stroke .3s linear;
        }

        /* Éliminé : le joueur s'éteint sans disparaître */
        .joueur.mort { opacity: .28; filter: grayscale(1); transform: scale(.9); }
        .joueur.mort .nom { text-decoration: line-through; }

        /* Réponse validée : l'hexagone s'illumine et rebondit */
        .joueur.reussi .hex { background: linear-gradient(160deg, #16332a, #10201b); }
        .joueur.reussi .hex-bord { background: var(--ok); box-shadow: 0 0 1.8rem rgba(110, 231, 183, .6); }
        .joueur.reussi { animation: rebond .5s cubic-bezier(.2,1.5,.4,1); }

        @keyframes rebond {
            0% { transform: scale(1.14); }
            40% { transform: scale(1.3); }
            100% { transform: scale(1.14); }
        }

        /* ── La bombe, au centre, tournée vers le joueur actif ── */
        .bombe-orbite {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            transition: transform .55s cubic-bezier(.5,-0.2,.3,1.4);
        }

        .bombe {
            position: relative;
            width: calc(var(--taille-hex) * .62);
            height: calc(var(--taille-hex) * .62);
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #4a4a52, #17171b 70%);
            box-shadow: inset -.25rem -.25rem .6rem rgba(0,0,0,.7),
                        0 0 calc(1rem + var(--tension) * 2rem) rgba(255, 80, 40, calc(var(--tension) * .8));
            /* Le battement s'accélère avec la tension */
            animation: battre calc(1.1s - var(--tension) * .8s) ease-in-out infinite;
        }

        @keyframes battre {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(calc(1 + var(--tension) * .12 + .03)); }
        }

        /* La mèche, qui raccourcit à mesure */
        .meche {
            position: absolute;
            bottom: 88%;
            left: 50%;
            width: 2px;
            height: calc(.4rem + (1 - var(--tension)) * 1.4rem);
            background: linear-gradient(to top, #6b5a3a, #8a7550);
            transform-origin: bottom;
            transform: translateX(-50%) rotate(12deg);
            transition: height .3s linear;
        }

        .etincelle {
            position: absolute;
            top: -.22rem;
            left: 50%;
            width: .45rem;
            height: .45rem;
            margin-left: -.225rem;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, #ffb300 55%, transparent 70%);
            box-shadow: 0 0 .5rem #ffae00, 0 0 1rem rgba(255, 140, 0, .8);
            animation: crepiter .18s infinite alternate;
        }

        @keyframes crepiter {
            from { transform: scale(1) translateX(0); opacity: 1; }
            to   { transform: scale(1.35) translateX(1px); opacity: .75; }
        }

        /* Le compte à rebours, lisible au centre de la bombe */
        .chrono {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: calc(var(--taille-hex) * .3);
            color: #fff;
            text-shadow: 0 0 .6rem rgba(0,0,0,.9);
            pointer-events: none;
        }

        /* ── L'explosion ── */
        .onde {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            border: 3px solid rgba(255, 140, 40, .9);
            opacity: 0;
            pointer-events: none;
        }

        .onde.part { animation: souffle .8s cubic-bezier(.15,.8,.3,1) forwards; }

        @keyframes souffle {
            0% { opacity: 1; transform: scale(.3); border-width: 6px; }
            100% { opacity: 0; transform: scale(9); border-width: 1px; }
        }

        .flash {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
        }

        .flash.part { animation: eclair .35s ease-out forwards; }
        @keyframes eclair { 0% { opacity: .75; } 100% { opacity: 0; } }

        .debris {
            position: absolute;
            width: .4rem;
            height: .4rem;
            border-radius: 50%;
            background: #ff8c00;
            pointer-events: none;
            animation: projeter .9s cubic-bezier(.2,.8,.3,1) forwards;
        }

        @keyframes projeter {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); }
        }

        /* ══════════════════════════════════════
           L'ALPHABET
           ══════════════════════════════════════ */
        .alphabet {
            position: fixed;
            right: 1.4rem;
            top: 50%;
            transform: translateY(-50%);
            width: 9.5rem;
            padding: 1rem .8rem;
            background: rgba(255, 255, 255, .022);
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 1rem;
            z-index: 20;
        }

        .coeur-alpha {
            position: relative;
            width: 3rem;
            height: 3rem;
            margin: 0 auto .8rem;
        }

        .coeur-alpha svg { width: 100%; height: 100%; }
        .coeur-alpha .vide { fill: rgba(255, 255, 255, .06); }
        .coeur-alpha .plein { fill: var(--hp); transition: clip-path .5s cubic-bezier(.2,.9,.25,1); }

        .lettres { display: grid; grid-template-columns: repeat(3, 1fr); gap: .32rem; }

        .lettre {
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: .95rem;
            color: rgba(255, 255, 255, .22);
            background: rgba(255, 255, 255, .03);
            clip-path: polygon(50% 3%, 96% 27%, 96% 73%, 50% 97%, 4% 73%, 4% 27%);
            transition: color .3s ease, background .3s ease, transform .3s cubic-bezier(.2,1.6,.4,1);
        }

        .lettre.prise { color: #14100a; background: linear-gradient(160deg, #ffe066, var(--neon)); }
        .lettre.neuve { animation: atterrir .6s cubic-bezier(.2,1.6,.4,1); }

        @keyframes atterrir {
            0% { transform: scale(2.2); filter: brightness(2); }
            100% { transform: scale(1); filter: none; }
        }

        /* La lettre qui vole du joueur vers le panneau */
        .lettre-volante {
            position: fixed;
            z-index: 50;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            color: var(--neon);
            text-shadow: 0 0 .8rem rgba(255, 190, 40, .9);
            pointer-events: none;
        }

        /* ══════════════════════════════════════
           DÉFIS ET SAISIE
           ══════════════════════════════════════ */
        .defis {
            position: fixed;
            left: 1.4rem;
            top: 50%;
            transform: translateY(-50%);
            width: 12rem;
            z-index: 20;
        }

        .defi {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .65rem .8rem;
            margin-bottom: .5rem;
            background: rgba(255, 255, 255, .022);
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: .6rem;
        }

        .defi .txt { flex: 1; font-size: .72rem; }
        .defi .txt b { color: var(--neon); }
        .defi .rail { display: block; height: .2rem; margin-top: .35rem; background: rgba(255,255,255,.07); border-radius: 2rem; overflow: hidden; }
        .defi .rail i { display: block; height: 100%; background: linear-gradient(90deg, rgba(255,190,40,.5), var(--neon)); border-radius: 2rem; transition: width .5s cubic-bezier(.2,.9,.25,1); }

        .saisie-zone {
            position: fixed;
            left: 50%;
            bottom: 3.5rem;
            transform: translateX(-50%);
            width: min(26rem, 80vw);
            z-index: 20;
        }

        .saisie {
            width: 100%;
            padding: .9rem 1.2rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            color: var(--txt);
            background: rgba(255, 255, 255, .035);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: .7rem;
            outline: none;
            transition: border-color .25s ease, box-shadow .25s ease, transform .1s ease;
        }

        .saisie:focus { border-color: rgba(255, 215, 0, .5); box-shadow: 0 0 1.4rem rgba(255, 190, 40, .2); }
        .saisie::placeholder { color: rgba(255,255,255,.25); }
        .saisie.refuse { animation: secouer .45s; border-color: rgba(255, 77, 77, .7); }

        @keyframes secouer {
            10%, 90% { transform: translateX(-2px); }
            30%, 70% { transform: translateX(4px); }
            50% { transform: translateX(-6px); }
        }

        .serie {
            position: fixed;
            left: 50%;
            bottom: 1.2rem;
            transform: translateX(-50%);
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .18);
        }

        /* ══════════════════════════════════════
           PANNEAU DE RÉGLAGES
           ══════════════════════════════════════ */
        .reglages {
            position: fixed;
            right: 1.4rem;
            bottom: 1.2rem;
            z-index: 80;
            width: 17rem;
            max-height: 78vh;
            overflow-y: auto;
            padding: 1rem;
            background: rgba(12, 12, 14, .96);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: .9rem;
            box-shadow: 0 1rem 3rem rgba(0,0,0,.6);
            font-size: .74rem;
            transition: transform .35s cubic-bezier(.2,.9,.25,1);
        }

        .reglages.replie { transform: translateY(calc(100% - 2.6rem)); }

        .reglages h2 {
            display: flex; align-items: center; justify-content: space-between;
            font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: .06em;
            color: var(--neon); margin-bottom: .8rem; cursor: pointer;
        }

        .reglages label { display: block; margin: .7rem 0 .25rem; color: var(--txt2); font-size: .68rem; letter-spacing: .04em; }
        .reglages input[type=range] { width: 100%; accent-color: var(--neon); }
        .reglages .val { float: right; color: var(--neon); font-weight: 700; }

        .boutons { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; margin-top: .8rem; }
        .boutons button {
            padding: .5rem .4rem; font-family: inherit; font-size: .68rem; font-weight: 600;
            color: var(--txt); background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1); border-radius: .4rem; cursor: pointer;
            transition: background .2s ease, border-color .2s ease;
        }
        .boutons button:hover { background: rgba(255,215,0,.14); border-color: rgba(255,215,0,.4); }
        .boutons button.large { grid-column: 1 / -1; }
        .boutons button.rouge:hover { background: rgba(255,77,77,.16); border-color: rgba(255,77,77,.5); }

        .note { margin-top: .8rem; font-size: .64rem; line-height: 1.5; color: rgba(255,255,255,.3); }

        @media (max-width: 900px) {
            .defis, .alphabet { display: none; }
            .reglages { width: calc(100vw - 2rem); right: 1rem; }
        }
    </style>
</head>

<body>
    <div class="nav">
        <a href="/prototypes">Mise en page</a>
        <a href="/prototypes/jeu">Écran de jeu</a>
        <a href="/prototypes/bombanime" class="on">BombAnime</a>
        <a href="/prototypes/points">Icône de points</a>
        <a href="/prototypes/podium">Fin de partie</a>
        <a href="/">← Le site</a>
    </div>

    <div class="flash" id="flash"></div>

    <div class="scene" id="scene">
        <div class="cercle" id="cercle">
            <div class="bombe-orbite" id="orbite">
                <div class="bombe" id="bombe">
                    <span class="meche"><span class="etincelle"></span></span>
                    <span class="chrono" id="chrono">8</span>
                </div>
            </div>
            <div class="onde" id="onde"></div>
        </div>
    </div>

    <!-- Défis -->
    <div class="defis" id="defis"></div>

    <!-- Alphabet -->
    <div class="alphabet">
        <div class="coeur-alpha">
            <svg viewBox="0 0 24 24">
                <path class="vide" d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>
                <path class="plein" id="coeurPlein" d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>
            </svg>
        </div>
        <div class="lettres" id="lettres"></div>
    </div>

    <!-- Saisie -->
    <div class="saisie-zone">
        <input class="saisie" id="saisie" placeholder="Un personnage de Demon Slayer…" autocomplete="off">
    </div>
    <div class="serie" id="serie">Demon Slayer</div>

    <!-- ══════════ RÉGLAGES ══════════ -->
    <div class="reglages" id="reglages">
        <h2 id="titreReglages">Réglages <span style="font-size:.8rem">▾</span></h2>

        <label>Joueurs <span class="val" id="vJoueurs">6</span></label>
        <input type="range" id="rJoueurs" min="2" max="12" value="6">

        <label>Vies par joueur <span class="val" id="vVies">3</span></label>
        <input type="range" id="rVies" min="1" max="5" value="3">

        <label>Temps du tour <span class="val" id="vTemps">8 s</span></label>
        <input type="range" id="rTemps" min="3" max="15" value="8">

        <label>Tension <span class="val" id="vTension">0 %</span></label>
        <input type="range" id="rTension" min="0" max="100" value="0">

        <label>Rayon du cercle <span class="val" id="vRayon">20 rem</span></label>
        <input type="range" id="rRayon" min="14" max="30" value="20">

        <label>Taille des joueurs <span class="val" id="vHex">6 rem</span></label>
        <input type="range" id="rHex" min="4" max="9" value="6">

        <label>Lettres prises <span class="val" id="vLettres">0</span></label>
        <input type="range" id="rLettres" min="0" max="26" value="0">

        <div class="boutons">
            <button id="bTour">Tour suivant</button>
            <button id="bValide">Réponse juste</button>
            <button id="bRefus">Refusée</button>
            <button id="bBoum" class="rouge">Explosion</button>
            <button id="bAuto" class="large">▶ Lancer la partie</button>
            <button id="bReset" class="large">Tout réinitialiser</button>
        </div>

        <p class="note">
            La tension pilote le battement de la bombe, la longueur de la mèche,
            le halo rouge et le tremblement. Elle monte toute seule pendant un tour.
        </p>
    </div>

<script>
const PSEUDOS = ['Senpai850', 'aaaa', 'Kitsune515', 'Hokage82', 'Otaku208', 'Zanpakuto',
                 'Ramen672', 'Tanuki28', 'Sakura710', 'Mecha766', 'Oni517', 'Haki945'];
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

const etat = {
    joueurs: 6,
    vies: 3,
    temps: 8,
    actif: 0,
    lettres: new Set(),
    morts: new Set(),
    viesRestantes: [],
    enCours: false,
    reste: 8,
    minuterie: null,
};

const $ = (id) => document.getElementById(id);
const cercle = $('cercle');

// ── Construction du cercle ──
function construireJoueurs() {
    [...cercle.querySelectorAll('.joueur')].forEach(n => n.remove());
    etat.viesRestantes = Array.from({ length: etat.joueurs }, () => etat.vies);
    etat.morts.clear();

    for (let i = 0; i < etat.joueurs; i++) {
        const el = document.createElement('div');
        el.className = 'joueur';
        el.dataset.i = i;
        el.innerHTML = `
            <div class="nom">${PSEUDOS[i % PSEUDOS.length]}</div>
            <svg class="anneau" viewBox="0 0 100 100">
                <circle class="rail" cx="50" cy="50" r="46"/>
                <circle class="jauge" cx="50" cy="50" r="46"/>
            </svg>
            <div class="hex"><span class="hex-bord"></span><span class="initiale">${PSEUDOS[i % PSEUDOS.length][0]}</span></div>
            <div class="vies"></div>`;
        cercle.appendChild(el);
    }
    placerJoueurs();
    rendreVies();
    majActif();
}

// Chacun sur son point du cercle, la tête en haut
function placerJoueurs() {
    const n = etat.joueurs;
    const rayon = cercle.offsetWidth / 2;
    cercle.querySelectorAll('.joueur').forEach((el, i) => {
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(angle) * rayon;
        const y = Math.sin(angle) * rayon;
        el.style.transform = `translate(${x}px, ${y}px)`;
        el.dataset.x = x; el.dataset.y = y;
    });
}

function rendreVies() {
    cercle.querySelectorAll('.joueur').forEach((el, i) => {
        const zone = el.querySelector('.vies');
        zone.innerHTML = '';
        for (let k = 0; k < etat.vies; k++) {
            const c = document.createElement('i');
            if (k >= etat.viesRestantes[i]) c.classList.add('off');
            zone.appendChild(c);
        }
        el.classList.toggle('mort', etat.viesRestantes[i] <= 0);
    });
}

// La bombe pivote vers celui dont c'est le tour
function majActif() {
    const n = etat.joueurs;
    cercle.querySelectorAll('.joueur').forEach((el, i) => {
        el.classList.toggle('actif', i === etat.actif && etat.viesRestantes[i] > 0);
        const scale = i === etat.actif ? 1.14 : 1;
        el.style.transform = `translate(${el.dataset.x}px, ${el.dataset.y}px) scale(${scale})`;
    });
    const angle = (etat.actif / n) * 360;
    // La bombe s'écarte du centre vers le joueur, sans jamais le recouvrir
    $('orbite').style.transform = `rotate(${angle}deg) translateY(${-cercle.offsetWidth * 0.22}px) rotate(${-angle}deg)`;
}

function majJauge() {
    const p = etat.reste / etat.temps;
    const jauge = cercle.querySelector('.joueur.actif .jauge');
    if (jauge) {
        jauge.style.strokeDashoffset = 289 * (1 - p);
        jauge.style.stroke = p > .5 ? 'var(--neon)' : p > .25 ? '#ff9f43' : 'var(--danger)';
    }
    $('chrono').textContent = Math.ceil(etat.reste);
    tension(1 - p);
}

function tension(v) {
    document.documentElement.style.setProperty('--tension', Math.max(0, Math.min(1, v)).toFixed(3));
    $('vTension').textContent = Math.round(v * 100) + ' %';
    $('rTension').value = Math.round(v * 100);
}

// ── L'alphabet ──
function construireAlphabet() {
    const zone = $('lettres');
    zone.innerHTML = '';
    ALPHABET.forEach(l => {
        const el = document.createElement('div');
        el.className = 'lettre';
        el.dataset.l = l;
        el.textContent = l;
        zone.appendChild(el);
    });
}

function majAlphabet(nouvelles = []) {
    ALPHABET.forEach(l => {
        const el = $('lettres').querySelector(`[data-l="${l}"]`);
        el.classList.toggle('prise', etat.lettres.has(l));
        if (nouvelles.includes(l)) {
            el.classList.add('neuve');
            setTimeout(() => el.classList.remove('neuve'), 600);
        }
    });
    const part = etat.lettres.size / 26;
    $('coeurPlein').style.clipPath = `inset(${(1 - part) * 100}% 0 0 0)`;
    $('vLettres').textContent = etat.lettres.size;
    $('rLettres').value = etat.lettres.size;
}

// Une lettre s'envole du joueur vers le panneau
function envoyerLettre(lettre, depuis) {
    const d = depuis.getBoundingClientRect();
    const cible = $('lettres').querySelector(`[data-l="${lettre}"]`).getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'lettre-volante';
    el.textContent = lettre;
    el.style.left = (d.left + d.width / 2) + 'px';
    el.style.top = (d.top + d.height / 2) + 'px';
    document.body.appendChild(el);
    requestAnimationFrame(() => {
        el.style.transition = 'transform .6s cubic-bezier(.3,.9,.2,1), opacity .6s ease';
        el.style.transform = `translate(${cible.left - d.left - d.width / 2 + cible.width / 2}px, ${cible.top - d.top - d.height / 2 + cible.height / 2}px) scale(.6)`;
        el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 650);
}

// ── Les défis ──
const DEFIS = [
    { t: 'personnages en <b>T</b>', cible: 3, fait: 1 },
    { t: 'personnage en <b>D</b>', cible: 1, fait: 0 },
];
function construireDefis() {
    $('defis').innerHTML = DEFIS.map(d => `
        <div class="defi">
            <span class="txt">${d.cible} ${d.t}
                <span class="rail"><i style="width:${d.fait / d.cible * 100}%"></i></span>
            </span>
        </div>`).join('');
}

// ── Les évènements ──
function tourSuivant() {
    let n = etat.actif;
    for (let k = 0; k < etat.joueurs; k++) {
        n = (n + 1) % etat.joueurs;
        if (etat.viesRestantes[n] > 0) break;
    }
    etat.actif = n;
    etat.reste = etat.temps;
    majActif();
    majJauge();
}

function reponseJuste() {
    const el = cercle.querySelector('.joueur.actif');
    if (!el) return;
    el.classList.add('reussi');
    setTimeout(() => el.classList.remove('reussi'), 520);

    const libres = ALPHABET.filter(l => !etat.lettres.has(l));
    const prises = libres.sort(() => .5 - Math.random()).slice(0, Math.min(3, libres.length));
    prises.forEach((l, i) => setTimeout(() => envoyerLettre(l, el), i * 90));
    setTimeout(() => {
        prises.forEach(l => etat.lettres.add(l));
        majAlphabet(prises);
    }, 620);

    setTimeout(tourSuivant, 700);
}

function refusee() {
    const s = $('saisie');
    s.classList.add('refuse');
    setTimeout(() => s.classList.remove('refuse'), 460);
}

function exploser() {
    const el = cercle.querySelector('.joueur.actif');
    $('onde').classList.remove('part'); void $('onde').offsetWidth; $('onde').classList.add('part');
    $('flash').classList.remove('part'); void $('flash').offsetWidth; $('flash').classList.add('part');

    const b = $('bombe').getBoundingClientRect();
    for (let i = 0; i < 18; i++) {
        const d = document.createElement('span');
        d.className = 'debris';
        d.style.left = (b.left + b.width / 2) + 'px';
        d.style.top = (b.top + b.height / 2) + 'px';
        d.style.position = 'fixed';
        const a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 220;
        d.style.setProperty('--dx', Math.cos(a) * r + 'px');
        d.style.setProperty('--dy', Math.sin(a) * r + 'px');
        d.style.background = ['#ff8c00', '#ffd700', '#ff4d4d'][i % 3];
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 950);
    }

    if (el) {
        etat.viesRestantes[etat.actif] = Math.max(0, etat.viesRestantes[etat.actif] - 1);
        rendreVies();
    }
    setTimeout(tourSuivant, 900);
}

// ── La partie tourne toute seule ──
function basculerAuto() {
    if (etat.enCours) {
        clearInterval(etat.minuterie);
        etat.enCours = false;
        $('bAuto').textContent = '▶ Lancer la partie';
        return;
    }
    etat.enCours = true;
    etat.reste = etat.temps;
    $('bAuto').textContent = '⏸ Mettre en pause';
    etat.minuterie = setInterval(() => {
        etat.reste -= 0.05;
        if (etat.reste <= 0) {
            exploser();
            etat.reste = etat.temps;
        }
        majJauge();
    }, 50);
}

// ── Câblage des réglages ──
function lier(id, champ, format, apres) {
    $(id).addEventListener('input', (e) => {
        const v = parseInt(e.target.value, 10);
        etat[champ] = v;
        $('v' + id.slice(1)).textContent = format(v);
        apres && apres(v);
    });
}

lier('rJoueurs', 'joueurs', v => v, () => { etat.actif = 0; construireJoueurs(); });
lier('rVies', 'vies', v => v, () => construireJoueurs());
lier('rTemps', 'temps', v => v + ' s', () => { etat.reste = etat.temps; majJauge(); });

$('rTension').addEventListener('input', e => tension(e.target.value / 100));
$('rRayon').addEventListener('input', e => {
    document.documentElement.style.setProperty('--taille-cercle', e.target.value + 'rem');
    $('vRayon').textContent = e.target.value + ' rem';
    requestAnimationFrame(() => { placerJoueurs(); majActif(); });
});
$('rHex').addEventListener('input', e => {
    document.documentElement.style.setProperty('--taille-hex', e.target.value + 'rem');
    $('vHex').textContent = e.target.value + ' rem';
});
$('rLettres').addEventListener('input', e => {
    const n = parseInt(e.target.value, 10);
    etat.lettres = new Set(ALPHABET.slice(0, n));
    majAlphabet();
});

$('bTour').onclick = tourSuivant;
$('bValide').onclick = reponseJuste;
$('bRefus').onclick = refusee;
$('bBoum').onclick = exploser;
$('bAuto').onclick = basculerAuto;
$('bReset').onclick = () => {
    clearInterval(etat.minuterie);
    etat.enCours = false;
    $('bAuto').textContent = '▶ Lancer la partie';
    etat.actif = 0; etat.lettres.clear(); etat.reste = etat.temps;
    construireJoueurs(); majAlphabet(); tension(0);
};
$('titreReglages').onclick = () => $('reglages').classList.toggle('replie');

$('saisie').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (e.target.value.trim()) { reponseJuste(); e.target.value = ''; }
    else refusee();
});

window.addEventListener('resize', () => { placerJoueurs(); majActif(); });

construireAlphabet();
construireDefis();
construireJoueurs();
majAlphabet();
majJauge();
</script>
</body>

</html>
