<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les rangs — ShonenMaster</title>
    <meta name="description"
        content="Comment fonctionnent les rangs de ShonenMaster : les neuf paliers, les divisions, et comment gagner de l'expérience et des rubis.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/png" href="/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Poppins:wght@400;600&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/legal.css">
    <!-- ⚠️ `niveaux.js` EST CHARGE PLUTOT QUE RECOPIE. Les neuf paliers, leurs
         couleurs et le nombre de divisions vivent la-bas, et le jeu les lit
         au meme endroit : une liste recopiee ici aurait diverge au premier
         palier ajoute, et cette page se serait mise a mentir sans que rien
         ne le signale. Elle n a ni `import` ni `export` — une balise suffit,
         elle pose `PALIERS` dans la page. -->
    <script src="/niveaux.js"></script>
    <style>
        /* ══════════ LA PREMIERE VUE — deux colonnes, un seul ecran ══════════
           ⚠️ LA REGLE EST « LES HUIT PALIERS SANS DEFILER », et elle ne se
           verifie pas a l œil : elle se construit. L echelle est une GRILLE
           de huit rangees egales dont la hauteur totale est bornee par la
           fenetre — chaque palier prend donc le huitieme de ce qui reste,
           quelle que soit la taille de l ecran. Empiles avec une hauteur
           fixe, ils tenaient sur un portable et debordaient sur l autre,
           sans que rien ne le signale. */
        .l-page.r-large { max-width: 78rem; padding-bottom: 1.5rem; }
        /* ⚠️ LE PIED COMPTE DANS LE BUDGET. Il etait oublie du calcul, et la
           page defilait encore de 110 px pour lui seul — tout ce travail de
           mise en page annule par trois liens en bas. Il se resserre donc,
           et la scene lui laisse sa part (voir `--r-hors`). */
        .l-page.r-large .l-pied { margin-top: 1.6rem; padding-top: 1rem; }

        .r-scene {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr);
            gap: clamp(2rem, 5vw, 4.5rem);
            align-items: center;
            /* ⚠️ `--r-hors` EST LA SOMME DE TOUT CE QUI N EST PAS LA SCENE, et
               elle est ECRITE UNE FOIS : le padding haut de la page (3,5rem),
               le retour au jeu et sa marge (environ 4rem), le pied avec sa
               marge et son filet (environ 5rem), le padding bas (1,5rem).
               Deux endroits en dependent — la hauteur de la scene et celle de
               l echelle —, et ils se sont deja contredits : la scene tenait,
               le pied poussait la page de 110 px, et rien dans le CSS ne
               permettait de voir lequel des deux chiffres etait faux. */
            --r-hors: 14rem;
            min-height: calc(100vh - var(--r-hors));
        }

        .r-gauche { max-width: 34rem; }
        .r-gauche .l-titre { font-size: clamp(2.6rem, 6.2vw, 4.4rem); }
        .r-gauche p { font-size: 0.95rem; }

        .r-resume { max-width: 32rem; }

        /* ── LES SEUILS, EN GRILLE PLUTOT QU EN TABLE ──
           ⚠️ UNE TABLE POUR SIX COUPLES, C ETAIT DEJA TROP. Un tableau sert a
           COMPARER des lignes sur plusieurs colonnes ; ici il n y en a qu une,
           et la table n apportait que ses en-tetes, ses filets et sa largeur
           minimale de 30 rem — de quoi forcer un defilement horizontal sur
           telephone pour afficher six nombres. En grille, les six tiennent
           dans la place laissee libre a gauche.
           ⚠️ ET LE CHIFFRE PASSE DEVANT LE NOM. On ne vient pas verifier que
           « Classique » existe, on vient savoir combien il en faut. */
        .r-seuils { margin-top: clamp(1.6rem, 4vh, 2.4rem); }
        .r-seuils-titre {
            /* ⚠️ Les trois annulations sont OBLIGATOIRES : `legal.css` donne
               aux `h2` un filet superieur, un gros padding et une taille de
               section. Ici ce n est pas un titre de section mais la legende
               d une grille. */
            margin: 0 0 0.9rem;
            padding: 0;
            border: 0;
            font-family: 'Poppins', sans-serif;
            font-size: 0.66rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--l-doux);
        }
        /* ── LES SEUILS, SUR UNE LIGNE ──
           ⚠️ SIX TUILES ENCADREES POUR SIX NOMBRES, C ETAIT ENCORE TROP. Un
           cadre dit « ceci est un objet a part » ; six cadres alignes sous un
           titre font un tableau de bord, pour une information qu on lit une
           fois dans sa vie. En ligne, les six se lisent d un seul balayage et
           la colonne de gauche retrouve de l air — ce qui est tout l interet
           d une page qui tient dans un ecran.
           ⚠️ ELLE S ENROULE (`flex-wrap`), et c est ce qui la rend sure :
           la meme regle sert de 1920 px a 390, sans media query ni
           reorganisation. Elle passe a deux lignes quand il le faut, pas
           avant. */
        .r-ligne {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.35rem 0.9rem;
        }
        .r-mode {
            display: inline-flex;
            align-items: baseline;
            gap: 0.3rem;
            animation: rMonte 0.5s cubic-bezier(.2,.8,.2,1) backwards;
            animation-delay: calc(0.3s + var(--i) * 45ms);
        }
        /* ⚠️ LE POINT MEDIAN EST UN `::after` DU MODE, pas un caractere dans
           le texte : il disparait ainsi tout seul au bout de chaque ligne
           quand la liste s enroule. Ecrit entre les entrees, il se serait
           retrouve en tete de la seconde ligne. */
        .r-mode:not(:last-child)::after {
            content: '·';
            margin-left: 0.55rem;
            color: var(--l-trait);
        }
        .r-mode b {
            font-family: 'Bebas Neue', 'Poppins', sans-serif;
            font-size: 1.35rem;
            line-height: 1;
            color: var(--l-or);
            font-variant-numeric: tabular-nums;
        }
        .r-mode span {
            font-size: 0.72rem;
            letter-spacing: 0.02em;
            color: var(--l-doux);
            white-space: nowrap;
        }
        .r-attente { margin: 0; font-size: 0.8rem; color: var(--l-doux); }

        /* ⚠️ LE PIED S EFFACE. Ce sont quatre liens legaux sur une page qui
           parle de progression : en or plein, ils etaient l objet le plus
           colore du bas de l ecran, juste sous l echelle qu on vient de
           regarder. Ils restent lisibles et le survol les rallume — ce qui
           s efface ici, c est leur insistance, pas leur existence. */
        .l-pied { opacity: 0.45; transition: opacity 0.2s ease; }
        .l-pied:hover { opacity: 0.9; }
        .l-pied a { color: var(--l-doux); text-decoration-color: transparent; }
        .l-pied a:hover,
        .l-pied a:focus-visible { color: var(--l-or); text-decoration-color: currentColor; }

        /* ── L echelle des paliers ── */
        .r-echelle {
            display: grid;
            grid-template-rows: repeat(8, minmax(0, 1fr));
            gap: clamp(0.3rem, 1vh, 0.6rem);
            /* Elle ne depasse jamais la scene : meme budget, moins la marge
               qui empeche les paliers de toucher les bords.
               ⚠️ 38rem ET NON 34, ET C EST CE QUI DONNE L AIR AUTOUR DES NOMS.
               Reduire le corps du nom n y avait rien fait : les huit rangees
               se partagent une hauteur FIXE, donc un texte plus petit laisse
               une ligne plus petite, et le rapport ne bouge pas. C est la
               hauteur totale qu il faut ouvrir. Releve : 13 px au-dessus et
               en dessous du nom a 34rem, 19 a 38. */
            height: min(38rem, calc(100vh - var(--r-hors) - 1rem));
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* ⚠️ LA BORDURE GAUCHE COLOREE A ETE RETIREE. Huit traits verticaux
           alignes faisaient un sommaire de documentation, pas une echelle de
           rangs — et surtout, un filet de trois pixels est ce qu on remarque
           en DERNIER sur une ligne de cinquante de haut. Trois choses la
           remplacent, toutes a la teinte du palier : un ECUSSON hexagonal
           qui porte son numero, un degrade de fond qui part de la gauche et
           s eteint au tiers, et un liisere complet. La couleur cesse d etre
           une etiquette collee au bord : elle appartient a la ligne. */
        .r-palier {
            position: relative;
            display: flex;
            align-items: center;
            gap: clamp(0.7rem, 1.6vw, 1.1rem);
            padding: 0 clamp(0.9rem, 2vw, 1.3rem);
            border-radius: 0.7rem;
            overflow: hidden;
            /* Repli pour les navigateurs sans `color-mix` : la ligne garde un
               fond et un contour, elle perd seulement sa teinte. */
            background: var(--l-carte);
            border: 1px solid var(--l-trait);
            background:
                linear-gradient(90deg,
                    color-mix(in srgb, var(--ton) 13%, transparent) 0%,
                    color-mix(in srgb, var(--ton) 4%, transparent) 34%,
                    transparent 72%),
                var(--l-carte);
            border: 1px solid color-mix(in srgb, var(--ton) 22%, var(--l-trait));
            transition: border-color 0.22s ease, transform 0.22s cubic-bezier(.2,.8,.2,1);
        }
        .r-palier:hover {
            border-color: color-mix(in srgb, var(--ton) 55%, transparent);
            transform: translateX(-0.3rem);
        }
        /* La lueur du survol, en calque : posee sur le fond lui-meme elle
           aurait ecrase le degrade ci-dessus a chaque transition. */
        .r-palier::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(70% 160% at 0% 50%,
                        color-mix(in srgb, var(--ton) 26%, transparent), transparent 70%);
            transition: opacity 0.22s ease;
        }
        .r-palier:hover::after { opacity: 1; }

        /* L ecusson — le meme hexagone que la pastille de compte du salon et
           que la carte de joueur. ⚠️ Un `clip-path` et non une image : il doit
           prendre la couleur du palier, et huit fichiers auraient diverge du
           jour ou une teinte change dans `niveaux.js`. */
        .r-marque {
            position: relative;
            flex: 0 0 auto;
            width: clamp(1.8rem, 4.2vh, 2.35rem);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.66rem;
            font-weight: 800;
            color: #0d0d10;
            background: linear-gradient(145deg,
                        color-mix(in srgb, var(--ton) 100%, #fff 35%), var(--ton));
            clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
        }

        /* ⚠️ L AIR AUTOUR DU NOM NE SE REGLE PAS PAR UN PADDING. La hauteur
           de chaque ligne est imposee par la grille — huit rangees egales
           dans la hauteur disponible —, donc un padding vertical n ajoute
           rien : il repousse le texte contre une boite qui ne grandit pas.
           C est le CORPS DU NOM qui decide, et lui seul. Descendu de 1,95 a
           1,75rem, il laisse 16 px au-dessus et en dessous au lieu de 13. */
        .r-nom {
            font-family: 'Bebas Neue', 'Poppins', sans-serif;
            font-size: clamp(1.25rem, 3vh, 1.75rem);
            line-height: 1;
            letter-spacing: 0.04em;
            color: var(--ton, #9a9aa6);
        }

        /* Les trois divisions, en chiffres romains — comme dans le jeu. */
        .r-divisions { margin-left: auto; display: flex; gap: 0.3rem; }
        .r-div {
            min-width: 1.75rem;
            padding: 0.2rem 0;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-align: center;
            color: var(--l-doux);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--l-trait);
            border-radius: 0.3rem;
        }
        .r-unique {
            margin-left: auto;
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ton);
        }
        /* ⚠️ LE SOMMET SE DISTINGUE PAR SA MATIERE, pas par un mot de plus :
           son fond va d un bord a l autre au lieu de s eteindre au tiers.
           C est le seul palier dont la couleur traverse toute la ligne —
           exactement ce qu il raconte. */
        .r-palier.r-sommet {
            background:
                linear-gradient(90deg,
                    color-mix(in srgb, var(--ton) 20%, transparent) 0%,
                    color-mix(in srgb, var(--ton) 7%, transparent) 60%,
                    color-mix(in srgb, var(--ton) 12%, transparent) 100%),
                var(--l-carte);
            border-color: color-mix(in srgb, var(--ton) 40%, transparent);
        }

        /* ══════════ LES ARRIVEES ══════════
           ⚠️ UN RETARD CALCULE A PARTIR DE `--i`, et non huit regles ecrites a
           la main : le jour ou un palier s ajoute, la cascade le prend sans
           qu on y touche. 55 ms par ligne — au-dela, la derniere arrive si
           tard qu on a deja commence a lire la premiere. */
        @keyframes rMonte {
            from { opacity: 0; transform: translateY(0.9rem); }
            to   { opacity: 1; transform: none; }
        }
        @keyframes rGlisse {
            from { opacity: 0; transform: translateX(1.6rem); }
            to   { opacity: 1; transform: none; }
        }
        .r-gauche > * {
            animation: rMonte 0.6s cubic-bezier(.2,.8,.2,1) both;
            animation-delay: calc(var(--i, 0) * 70ms);
        }
        .r-palier {
            animation: rGlisse 0.55s cubic-bezier(.2,.8,.2,1) both;
            animation-delay: calc(0.18s + var(--i) * 55ms);
        }
        /* ⚠️ L ECLAT PASSE UNE FOIS, APRES l arrivee de sa ligne : `--i` sert
           aux deux, donc les deux restent d accord sans qu on additionne des
           durees a la main. Il traverse de gauche a droite, dans le sens de
           lecture — a contresens, il se lisait comme un retour en arriere. */
        .r-palier .r-eclat {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(105deg, transparent 38%,
                        color-mix(in srgb, var(--ton) 42%, transparent) 50%, transparent 62%);
            opacity: 0;
            /* ⚠️ `backwards` ET NON `both`. Avec `both`, l eclat GARDAIT son
               etat final — `translateX(100%)`, donc une boite de 350 px posee
               hors de sa ligne pour toujours. Invisible (la ligne la decoupe),
               mais comptee : le document gagnait 5 px de defilement
               horizontal sur telephone, et c est exactement le genre de
               defaut qu on attribue a tout sauf a une animation terminee.
               `backwards` ne tient que l etat de DEPART, avant le retard ;
               apres, l element revient a son style, qui est deja invisible. */
            animation: rEclat 0.85s ease-out backwards;
            animation-delay: calc(0.42s + var(--i) * 55ms);
        }
        @keyframes rEclat {
            0%   { opacity: 0; transform: translateX(-100%); }
            35%  { opacity: 1; }
            100% { opacity: 0; transform: translateX(100%); }
        }

        /* ⚠️ SOUS 900 px, UNE SEULE COLONNE ET ON DEFILE. La promesse « tout
           sans defiler » ne tient que s il y a de la largeur a donner : a
           deux colonnes sur un telephone, les noms se couperaient et les
           divisions passeraient a la ligne. Mieux vaut defiler que serrer. */
        @media (max-width: 900px) {
            .r-scene { grid-template-columns: 1fr; min-height: 0; gap: 2.5rem; }
            .r-echelle { height: auto; grid-template-rows: none; }
            .r-palier { padding: 0.75rem 1rem; }
            .r-gauche { max-width: none; }
            /* ⚠️ DEUX COLONNES ET NON TROIS. A trois sur 390 px, chaque tuile
               tombe a 110 px et « BombAnime » se faisait couper par son
               `text-overflow` — un seuil dont on ne lit plus le mode ne sert
               a rien. */
            /* ℹ️ Rien a faire pour les seuils : la ligne s enroule d
               elle-meme. C etait tout l interet de la passer en `flex-wrap`
               plutot qu en grille a trois colonnes. */
        }

        @media (prefers-reduced-motion: reduce) {
            .r-gauche > *, .r-palier, .r-palier .r-eclat { animation: none; }
            .r-palier .r-eclat { display: none; }
            .r-palier:hover { transform: none; }
        }

        /* ℹ️ Les regles `.g-*` — listes, table des seuils, cartes des deux
             monnaies, encadre de note — ont ete retirees avec les sections
             qu elles habillaient. Du style sans element est pire que pas de
             style : au relecture suivante, on cherche ou il s applique. */
    </style>
</head>

<body>
    <main class="l-page r-large">

        <a class="l-retour" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Retour au jeu
        </a>

        <!-- ⚠️ LES HUIT PALIERS TIENNENT DANS UN ECRAN, et c est la seule
             raison de cette mise en page. Empiles sous le texte, il fallait
             defiler pour voir le sommet — c est-a-dire pour voir ce vers quoi
             la page entiere est censee donner envie d aller. Les mots a
             gauche, l echelle a droite, et le defilement ne sert plus qu au
             reste. -->
        <section class="r-scene">
            <div class="r-gauche">
                <h1 class="l-titre" style="--i:0">Les rangs</h1>
                <p class="l-date" style="--i:1">Ce que l'on gagne en jouant, et où ça mène</p>
                <!-- ⚠️ DEUX PHRASES, LA OU IL Y AVAIT DEUX SECTIONS. « Ce qui
                     rapporte » et « Deux garde-fous » disaient en vingt lignes
                     ce que personne ne vient lire sur une page de rangs : on y
                     vient pour voir l echelle. La premiere phrase donne la
                     regle et amene les seuils, la seconde dit ce qui ne compte
                     pas. Le detail n a pas sa place ici — il se decouvre en
                     jouant, et la page des regles le porte deja.
                     ⚠️ Et les deux paragraphes d explication sont partis avec :
                     ils decrivaient les divisions, les couleurs et le sommet,
                     c est-a-dire exactement ce que l echelle de droite MONTRE.
                     Un texte qui double une image affaiblit les deux. -->
                <p class="r-resume" style="--i:2">Chaque partie terminée rapporte de
                    l'expérience&nbsp;; la <strong>gagner</strong> multiplie ce gain.</p>

                <section class="r-seuils" style="--i:3">
                    <h2 class="r-seuils-titre">Joueurs requis par mode pour les gains</h2>
                    <div class="r-ligne" id="bareme">
                        <p class="r-attente">Lecture…</p>
                    </div>
                </section>
            </div>

            <ol class="r-echelle" id="echelle"></ol>
        </section>

        <!-- ℹ️ Un encadre expliquait ici pourquoi les seuils d xp ne sont pas
             ecrits. Retire : se justifier de ne pas dire quelque chose attire
             l attention dessus. L echelle au-dessus se suffit, et la barre du
             jeu dit a chacun ou il en est. -->

        <!-- ℹ️ « Ce qui rapporte », « Deux garde-fous » et la table des seuils
             vivaient ici, sous la premiere vue. Les trois sont remontes dans
             la colonne de gauche : les deux premieres en DEUX PHRASES, la
             troisieme en grille. La page ne defile plus — et c etait le but
             de la refonte, pas un effet de bord. -->

        <footer class="l-pied">
            <a href="/regles">Règles</a> ·
            <a href="/conditions">Conditions d'utilisation</a> ·
            <a href="/confidentialite">Confidentialité</a> ·
            <a href="/signaler">Signaler un bug</a>
        </footer>
    </main>

    <script>
        // L echelle se construit a partir de `PALIERS` (niveaux.js), jamais
        // d une liste recopiee ici. ⚠️ `pas` — l xp que coute chaque division
        // — est volontairement IGNORE : c est exactement ce qu on ne veut pas
        // divulguer, et le plus sur est de ne pas l ecrire du tout plutot que
        // de compter sur quelqu un pour ne pas l afficher un jour.
        // ⚠️ TOUT DANS UNE FONCTION, et le nom n est PAS `CHIFFRES`.
        // `niveaux.js` declare deja un `const CHIFFRES` au premier niveau, et
        // un `const` de premier niveau vit dans l environnement lexical
        // GLOBAL : le redeclarer ici jetait un « Identifier 'CHIFFRES' has
        // already been declared » qui arretait tout le script — l echelle
        // restait vide, sans un mot a l ecran. Les deux fichiers partagent
        // la meme page, ils partagent donc le meme espace de noms.
        (function () {
            const ROMAINS = ['I', 'II', 'III'];
            // ⚠️ `--i` EST POSE ICI, pas dans la feuille de style : c est lui
            // qui donne a chaque ligne son retard d arrivee ET celui de son
            // eclat. Ecrit en CSS, il aurait fallu huit regles, et neuf le
            // jour ou un palier s ajoute.
            document.getElementById('echelle').innerHTML = PALIERS.map((p, i) => {
                const droite = p.unique
                    ? '<span class="r-unique">sans division</span>'
                    : '<span class="r-divisions">' +
                      ROMAINS.map((c) => '<span class="r-div">' + c + '</span>').join('') +
                      '</span>';
                return '<li class="r-palier' + (p.unique ? ' r-sommet' : '') +
                    '" style="--ton:' + p.couleur + ';--i:' + i + '">' +
                    '<i class="r-eclat" aria-hidden="true"></i>' +
                    '<span class="r-marque" aria-hidden="true">' + (i + 1) + '</span>' +
                    '<span class="r-nom">' + p.nom + '</span>' + droite + '</li>';
            }).join('');
        })();

        // 📊 La table des seuils, DEMANDEE AU SERVEUR.
        // ⚠️ Les valeurs vivent dans `XP_MODES` (server-comptes.js), que le
        // navigateur ne peut pas charger : une table recopiee ici aurait
        // diverge au premier reglage change, et la page se serait mise a
        // annoncer des seuils que le jeu n applique plus.
        // ⚠️ Et si la requete echoue, la table DISPARAIT au lieu d afficher
        // « Lecture… » pour toujours : une page qui dit « je charge » sans
        // jamais finir est pire qu une page qui ne promet rien.
        (function () {
            const grille = document.getElementById('bareme');
            fetch('/api/bareme')
                .then((r) => r.json())
                .then((d) => {
                    const l = Object.values((d && d.modes) || {});
                    if (!l.length) throw new Error('vide');
                    // ⚠️ `--i` donne a chaque tuile son retard : la grille
                    // arrive en cascade comme l echelle d en face, et les deux
                    // cotes de l ecran se remplissent du meme geste.
                    grille.innerHTML = l.map((m, i) =>
                        '<div class="r-mode" style="--i:' + i + '">' +
                        '<b>' + m.joueurs + '</b><span>' + m.nom + '</span></div>').join('');
                })
                // ⚠️ TOUTE LA SECTION DISPARAIT, pas seulement la grille : son
                // titre seul (« Joueurs requis pour gagner de l XP ») aurait
                // pose une question sans y repondre. Et une page qui dit
                // « Lecture… » sans jamais finir est pire qu une page qui ne
                // promet rien.
                .catch(() => { grille.closest('.r-seuils').remove(); });
        })();
    </script>
</body>
