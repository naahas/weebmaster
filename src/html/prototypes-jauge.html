<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banc — la montée de la jauge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Archivo:wght@300;400;500;600&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <!--
        🔥 LA MONTEE DE LA JAUGE — six effets, la vraie barre.

        ⚠️ CE BANC CHARGE `home.css`. La piste, la jauge, les deux lignes
        chiffrees et le grand rang sont ceux du jeu : seul l effet change.
        Une copie aurait diverge, et l on aurait choisi une trainee sur une
        barre qui n est pas celle qu on regarde.

        ⚠️ `.v2-cer-piste` COUPE CE QUI DEPASSE (`overflow: hidden`) — c est
        voulu dans le jeu, la jauge ne doit pas baver hors de sa piste. Trois
        des six effets ont besoin d en sortir (etincelles, flamme, impact) :
        ils le rouvrent eux-memes, chacun dans sa classe, et jamais pour tout
        le monde.

        ⚠️ ET LA PISTE FAIT DEUX PIXELS. C est la contrainte de tout le banc :
        un effet qui demande de la hauteur demande d epaissir la barre, donc
        de changer ce qu on avait regle. Les effets 1, 2 et 5 tiennent DANS
        les deux pixels ; les 3, 4 et 6 debordent par-dessus, sans y toucher.

        Le bouton rejoue les six d un coup, pour les comparer en mouvement :
        c est le seul moyen de juger une trainee.
    -->
    <link rel="stylesheet" href="/home.css">
    <style>
        body {
            margin: 0;
            padding: 2rem 1.5rem 5rem;
            background: #09070d;
            font-family: 'Poppins', system-ui, sans-serif;
            color: #e8e4f0;
        }

        h1 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #8a7fa0;
            margin: 0 0 0.4rem;
        }

        p.intro { margin: 0 0 1.4rem; font-size: 0.85rem; color: #6f6886; max-width: 60ch; line-height: 1.6; }

        button.rejouer {
            font: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #09070d;
            background: #f0c75e;
            border: 0;
            border-radius: 999px;
            padding: 0.6rem 1.5rem;
            cursor: pointer;
            margin-bottom: 2.4rem;
        }

        .grille { display: flex; flex-wrap: wrap; gap: 2.6rem 2.4rem; }
        .cas { width: 23rem; }

        .etiq { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #f0c75e; }
        .note { font-size: 0.74rem; color: #6f6886; line-height: 1.55; margin: 0.15rem 0 1rem; min-height: 4.4em; }

        /* La scene : le bloc du jeu, desancré de son voile. */
        .scene {
            background: #07060b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 1.5rem 1.6rem 1.7rem;
        }
        .scene .v2-cer-bloc { opacity: 1; transform: none; transition: none; width: 100%; }
        .scene .v2-cer-promu-zone { height: 0; }

        /* ════════════════════════════════════════════════════════
           1 · TETE LUMINEUSE — un halo porté par le bord qui avance.
           Il tient DANS la piste : c est une lueur, pas un objet.
           ════════════════════════════════════════════════════════ */
        .e1 .v2-cer-jauge {
            box-shadow: 0 0 10px 2px rgba(240, 199, 94, 0.85),
                        0 0 22px 5px rgba(240, 199, 94, 0.35);
        }

        /* ════════════════════════════════════════════════════════
           2 · COMETE — tete vive, queue qui s eteint derriere elle.
           ⚠️ Le degradé est posé sur la JAUGE, donc il s etire avec
           elle : la queue grandit a mesure qu on avance, comme une
           vraie trainee, au lieu de rester longue de 40 px.
           ════════════════════════════════════════════════════════ */
        .e2 .v2-cer-jauge {
            background: linear-gradient(90deg,
                rgba(111, 160, 245, 0) 0%,
                rgba(111, 160, 245, 0.35) 35%,
                var(--neon-primary) 88%,
                #fff6d8 100%);
            box-shadow: 0 0 12px 1px rgba(240, 199, 94, 0.6);
        }

        /* ════════════════════════════════════════════════════════
           3 · ETINCELLES — des grains jetés par la tête pendant la
           montée. ⚠️ La piste rouvre son `overflow` ICI SEULEMENT :
           les grains doivent pouvoir en sortir, c est tout l effet.
           ════════════════════════════════════════════════════════ */
        .e3 .v2-cer-piste { overflow: visible; }
        .e3 .v2-cer-jauge { box-shadow: 0 0 8px 1px rgba(240, 199, 94, 0.7); }
        .etincelle {
            position: absolute;
            width: 2px; height: 2px;
            border-radius: 50%;
            background: #ffe9a8;
            pointer-events: none;
            opacity: 0;
        }

        /* ════════════════════════════════════════════════════════
           4 · FLAMME — une petite langue de feu assise sur la tête,
           qui vacille pendant qu elle avance.
           ════════════════════════════════════════════════════════ */
        .e4 .v2-cer-piste { overflow: visible; }
        .flamme {
            position: absolute;
            bottom: -1px;
            width: 14px; height: 20px;
            margin-left: -7px;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(50% 65% at 50% 100%,
                #fff3c4 0%, #f5c242 32%, rgba(240, 120, 30, 0.75) 62%, rgba(240, 90, 20, 0) 100%);
            filter: blur(1.5px);
            transform-origin: 50% 100%;
        }
        .flamme.on { opacity: 1; animation: vaciller 0.26s infinite alternate ease-in-out; }
        @keyframes vaciller {
            from { transform: scaleY(0.82) scaleX(1.05) translateX(-0.5px); }
            to   { transform: scaleY(1.12) scaleX(0.92) translateX(0.5px); }
        }

        /* ════════════════════════════════════════════════════════
           5 · ONDE — un reflet qui court le long de la part déjà
           remplie, en boucle. Tient dans les deux pixels.
           ════════════════════════════════════════════════════════ */
        .e5 .v2-cer-jauge::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                transparent 0%, rgba(255, 255, 255, 0.75) 50%, transparent 100%);
            background-size: 80px 100%;
            background-repeat: repeat-x;
            animation: courir 1.1s linear infinite;
        }
        @keyframes courir {
            from { background-position: -80px 0; }
            to   { background-position: 0 0; }
        }

        /* ════════════════════════════════════════════════════════
           6 · IMPACT — la montée est nue, et c est l ARRET qui est
           joué : un éclat à l endroit précis où la barre s arrête.
           ⚠️ Le seul des six qui ne dise rien PENDANT la montée. Il
           souligne le resultat, pas le trajet.
           ════════════════════════════════════════════════════════ */
        .e6 .v2-cer-piste { overflow: visible; }
        .impact {
            position: absolute;
            top: 50%; width: 4px; height: 4px;
            margin: -2px 0 0 -2px;
            border-radius: 50%;
            background: #fff6d8;
            pointer-events: none;
            opacity: 0;
        }
        .impact.on { animation: eclater 0.55s cubic-bezier(.2, .8, .3, 1) forwards; }
        @keyframes eclater {
            0%   { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(240, 199, 94, 0.9); }
            100% { opacity: 0; transform: scale(2.4); box-shadow: 0 0 0 14px rgba(240, 199, 94, 0); }
        }
    </style>
</head>

<body>
    <h1>La montée de la jauge</h1>
    <p class="intro">Six effets sur la vraie barre — <code>home.css</code> est chargé, la piste et la
        jauge sont celles du jeu. Elle fait <strong>deux pixels</strong> : 1, 2 et 5 tiennent dedans,
        3, 4 et 6 débordent par-dessus sans y toucher. Un effet de montée ne se juge qu'en mouvement.</p>

    <button class="rejouer" id="rejouer">Rejouer les six</button>
    <div class="grille" id="grille"></div>

    <script>
        const CAS = [
            ['e1', '1 · Tête lumineuse',
                'Un halo porté par le bord qui avance. Le plus discret, et le seul qui ne coûte rien : une ombre portée, pas un objet de plus.'],
            ['e2', '2 · Comète',
                'Tête vive, queue qui s’éteint derrière. Le dégradé est posé sur la jauge, donc la traînée s’allonge avec elle au lieu de rester d’une longueur fixe.'],
            ['e3', '3 · Étincelles',
                'Des grains jetés par la tête pendant la montée. ⚠️ Le seul qui ajoute des éléments au fil de l’animation — une douzaine, détruits ensuite.'],
            ['e4', '4 · Flamme',
                'Une langue de feu assise sur la tête, qui vacille en avançant. La plus présente des six, et la plus loin du reste de l’écran.'],
            ['e5', '5 · Onde',
                'Un reflet qui court en boucle sur la part remplie. Il continue APRÈS l’arrêt, ce qui donne une barre vivante plutôt qu’un trajet.'],
            ['e6', '6 · Impact',
                'La montée est nue : c’est l’ARRÊT qui est joué, par un éclat à l’endroit exact où la barre s’arrête. Il souligne le résultat, pas le trajet.'],
        ];

        const PART = 43;      // la part visée, en %
        const DUREE = 1300;   // la durée de la vraie transition

        const bloc = (cls) => `
        <div class="cas">
            <div class="etiq">${CAS.find(c => c[0] === cls)[1]}</div>
            <p class="note">${CAS.find(c => c[0] === cls)[2]}</p>
            <div class="scene ${cls}">
                <div class="v2-cer-bloc">
                    <div class="v2-cer-promu-zone"></div>
                    <div class="v2-cer-titre" style="color:#9a9aa6">NOVICE III</div>
                    <div class="v2-cer-ligne haut">
                        <span class="v2-cer-xp">+400<span class="u">XP</span></span>
                        <span class="v2-cer-reste">130 / 300</span>
                    </div>
                    <div class="v2-cer-piste">
                        <div class="v2-cer-jauge"></div>
                    </div>
                    <div class="v2-cer-ligne bas">
                        <span class="v2-cer-ar">+2000</span>
                        <span class="v2-cer-suiv" style="color:#7fd4a0">ÉVEILLÉ I</span>
                    </div>
                </div>
            </div>
        </div>`;

        document.getElementById('grille').innerHTML = CAS.map(c => bloc(c[0])).join('');

        // ⚠️ REJOUER UNE TRANSITION CSS DEMANDE UN CALCUL DE STYLE FORCE entre
        // la remise a zero et la nouvelle valeur (`void el.offsetWidth`). Sans
        // lui le navigateur regroupe les deux ecritures, ne voit aucun
        // changement, et la barre saute a sa valeur sans animation. C est la
        // lecon du cadenas de BombAnime, et elle coute une ligne.
        function jouer() {
            document.querySelectorAll('.etincelle, .flamme, .impact').forEach(e => e.remove());

            for (const [cls] of CAS) {
                const scene = document.querySelector('.scene.' + cls);
                const piste = scene.querySelector('.v2-cer-piste');
                const jauge = scene.querySelector('.v2-cer-jauge');

                jauge.style.transition = 'none';
                jauge.style.width = '0';
                void jauge.offsetWidth;                  // ⚠️ le calcul force
                jauge.style.transition = '';
                jauge.style.width = PART + '%';

                if (cls === 'e3') etincelles(piste);
                if (cls === 'e4') flamme(piste);
                if (cls === 'e6') impact(piste);
            }
        }

        // Des grains jetes par la tete, tant qu elle avance.
        function etincelles(piste) {
            const t0 = performance.now();
            const semer = () => {
                const t = performance.now() - t0;
                if (t > DUREE) return;
                // La tete suit la meme courbe que la transition : on la lit
                // sur la jauge plutot que de la recalculer, c est exact par
                // construction.
                const j = piste.querySelector('.v2-cer-jauge');
                const x = j.getBoundingClientRect().width;
                for (let i = 0; i < 2; i++) {
                    const e = document.createElement('i');
                    e.className = 'etincelle';
                    e.style.left = (x - 1) + 'px';
                    e.style.top = '0px';
                    piste.appendChild(e);
                    const dx = (Math.random() * 16) - 3;
                    const dy = (Math.random() * 22) - 11;
                    e.animate([
                        { opacity: 1, transform: 'translate(0,0) scale(1)' },
                        { opacity: 0, transform: `translate(${dx}px, ${dy}px) scale(0.3)` },
                    ], { duration: 420 + Math.random() * 260, easing: 'cubic-bezier(.2,.7,.4,1)' })
                        .onfinish = () => e.remove();
                }
                requestAnimationFrame(semer);
            };
            requestAnimationFrame(semer);
        }

        // Une flamme assise sur la tete, qui la suit.
        function flamme(piste) {
            const f = document.createElement('i');
            f.className = 'flamme on';
            piste.appendChild(f);
            const t0 = performance.now();
            const suivre = () => {
                const j = piste.querySelector('.v2-cer-jauge');
                f.style.left = j.getBoundingClientRect().width + 'px';
                if (performance.now() - t0 > DUREE + 500) {
                    f.style.opacity = '0';
                    setTimeout(() => f.remove(), 300);
                    return;
                }
                requestAnimationFrame(suivre);
            };
            requestAnimationFrame(suivre);
        }

        // Un eclat a l arrivee, et rien avant.
        function impact(piste) {
            setTimeout(() => {
                const j = piste.querySelector('.v2-cer-jauge');
                const i = document.createElement('i');
                i.className = 'impact on';
                i.style.left = j.getBoundingClientRect().width + 'px';
                piste.appendChild(i);
                setTimeout(() => i.remove(), 700);
            }, DUREE - 40);
        }

        document.getElementById('rejouer').onclick = jouer;
        setTimeout(jouer, 400);
    </script>
</body>

</html>
