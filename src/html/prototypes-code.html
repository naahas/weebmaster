<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejoindre — la saisie du code</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   Cinq façons de demander quatre caractères.
   Le vide sous le bouton vient d'une place réservée au message
   d'erreur. Chacune s'en débarrasse autrement — et aucune ne doit
   faire bouger la carte quand l'erreur arrive.
   ════════════════════════════════════════════════════════════════ */
:root { --or: #FFD700; --rouge: #ff5a6e; }
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 2rem 1.5rem 5rem;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
    background: radial-gradient(70% 55% at 50% 0%, #1a1710, #08080b 68%);
    min-height: 100vh;
}

h1 { margin: 0 0 0.3rem; font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.06em; }

.sous {
    margin: 0 0 1.4rem;
    max-width: 54rem;
    font-size: 0.85rem;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.42);
}

.mode { display: flex; gap: 0.5rem; margin-bottom: 2.2rem; }
.mode button {
    font: inherit; font-size: .78rem; color: #fff;
    background: rgba(255,255,255,.07);
    border: .06rem solid rgba(255,255,255,.12);
    border-radius: .4rem; padding: .35rem .8rem; cursor: pointer;
}
.mode button.on { background: rgba(255,215,0,.18); border-color: rgba(255,215,0,.45); }

.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(23rem, 1fr)); gap: 2.6rem 1.8rem; }
body.tel .grille { grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); }

.cas { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
.titre { font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.36); text-align: center; }
.titre em { display: block; margin-top: .3rem; font-style: normal; font-weight: 400; font-size: .74rem; letter-spacing: 0; text-transform: none; color: rgba(255,255,255,.26); }

/* Le cadre du telephone, pour juger a la bonne largeur */
.cadre {
    width: 100%;
    display: grid;
    place-items: center;
    padding: 1.4rem 1rem;
    border-radius: .9rem;
    background: rgba(255,255,255,.012);
    border: .06rem solid rgba(255,255,255,.05);
}
body.tel .cadre { width: 20rem; padding: 1.4rem .8rem; }

/* ── La carte, commune ── */
.carte {
    position: relative;
    width: 100%;
    max-width: 22rem;
    padding: 1.6rem 1.5rem;
    border-radius: .9rem;
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
    border: .06rem solid rgba(255,255,255,.07);
    display: flex; flex-direction: column; align-items: center; gap: 1rem;
}
body.tel .carte { max-width: 100%; padding: 1.3rem 1rem; }

.label {
    font-size: .62rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(255,255,255,.4);
    transition: color .25s ease;
}

.b {
    font: inherit; font-weight: 700; font-size: .95rem; color: #1a1400;
    background: linear-gradient(135deg, #ffd700, #ffa726);
    border: none; border-radius: .55rem; padding: .75rem 2.2rem; cursor: pointer;
    box-shadow: 0 .5rem 1.4rem rgba(255,183,0,.28);
    transition: transform .18s ease, box-shadow .25s ease;
}
.b:hover { transform: translateY(-.1rem); }
.b:disabled { opacity: .35; box-shadow: none; cursor: default; transform: none; }

/* ── Les cases separees, reprises par A, B et D ── */
.cases { display: flex; gap: .5rem; }
body.tel .cases { gap: .4rem; }

.case {
    width: 3.2rem; height: 3.9rem;
    display: grid; place-items: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.1rem; line-height: 1;
    color: #fff;
    background: rgba(0,0,0,.32);
    border: .1rem solid rgba(255,255,255,.09);
    border-radius: .55rem;
    transition: border-color .2s ease, background .2s ease, transform .2s cubic-bezier(.2,.9,.25,1);
}
body.tel .case { width: 2.9rem; height: 3.5rem; font-size: 1.9rem; }

.case.pleine { border-color: rgba(255,215,0,.5); background: rgba(255,215,0,.06); }
.case.active { border-color: var(--or); box-shadow: 0 0 0 .18rem rgba(255,215,0,.14); }
.case.active::after {
    content: ''; width: .09rem; height: 1.6rem; background: var(--or);
    animation: bat 1.1s steps(2, start) infinite;
}
@keyframes bat { 50% { opacity: 0; } }

/* Le champ reel est invisible : il ne sert qu a recevoir la frappe et le clavier */
.vrai {
    position: absolute; inset: 0; opacity: 0; border: none; background: none;
    font-size: 1rem; cursor: pointer;
}
.saisie { position: relative; }

/* ── L erreur, commune : la carte tremble, rien ne bouge autour ── */
.carte.ko { animation: secousse .42s cubic-bezier(.36,.07,.19,.97); }
@keyframes secousse {
    10%, 90% { transform: translateX(-.13rem); }
    20%, 80% { transform: translateX(.26rem); }
    30%, 50%, 70% { transform: translateX(-.4rem); }
    40%, 60% { transform: translateX(.4rem); }
}
.carte.ko .case { border-color: var(--rouge); background: rgba(255,90,110,.08); }
.carte.ko .case.active { box-shadow: 0 0 0 .18rem rgba(255,90,110,.16); }

/* ════════ A · Le code en quatre cases ════════
   L erreur ne dit rien : la rangee rougit et tremble. Rien a lire, rien a
   reserver, la carte ne bouge jamais. */

/* ════════ B · Le libelle porte le message ════════
   « CODE DU SALON » devient « CODE INTROUVABLE » en rouge, a la place meme
   qu il occupait. Zero espace reserve, zero saut. */
.b-cas .carte.ko .label { color: var(--rouge); }

/* ════════ C · Le champ unique, plus large ════════
   Un seul champ, mais des lettres tres espacees et un filet sous chacune :
   on lit les quatre positions sans multiplier les boites. */
.c .champ {
    width: 100%;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem; letter-spacing: 1.1rem; text-indent: 1.1rem;
    text-align: center; color: #fff;
    background: rgba(0,0,0,.32);
    border: .1rem solid rgba(255,255,255,.09);
    border-bottom-color: rgba(255,215,0,.35);
    border-radius: .55rem;
    padding: .6rem .4rem .5rem;
    outline: none;
    text-transform: uppercase;
    transition: border-color .2s ease;
}
.c .champ:focus { border-color: var(--or); }
.c .carte.ko .champ { border-color: var(--rouge); }

/* ════════ D · Sans bouton ════════
   La quatrieme lettre valide. Le bouton disparait, la carte se resserre a
   deux elements — c est la version la plus courte du geste. */

/* ════════ E · Le message au-dessus, en surimpression ════════
   Pour les cas ou l on veut vraiment dire pourquoi. Le bandeau se pose
   au-dessus de la carte sans lui prendre de place. */
.e .carte { overflow: visible; }
.avis {
    position: absolute;
    left: 50%; bottom: calc(100% + .6rem);
    transform: translateX(-50%) translateY(.3rem);
    white-space: nowrap;
    font-size: .72rem; font-weight: 600;
    color: #ffd2d8;
    background: rgba(90, 20, 30, .92);
    border: .06rem solid rgba(255,90,110,.4);
    border-radius: .45rem;
    padding: .35rem .7rem;
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s cubic-bezier(.2,.9,.25,1);
}
.avis.vu { opacity: 1; transform: translateX(-50%); }

.astuce { font-size: .68rem; color: rgba(255,255,255,.22); }
</style>
</head>
<body>

<h1>Rejoindre — la saisie du code</h1>
<p class="sous">
    Cinq façons de demander quatre caractères. Le vide sous le bouton vient d'une place réservée au
    message d'erreur : chacune s'en débarrasse autrement, et <strong>aucune ne fait bouger la carte</strong>
    quand l'erreur arrive. Tape un code pour essayer — <code>ABCD</code> passe, tout le reste échoue.
</p>

<div class="mode">
    <button id="mPc" class="on">Ordinateur</button>
    <button id="mTel">Téléphone</button>
</div>

<div class="grille" id="grille"></div>

<script>
var CAS = [
    ['a',     'A · Quatre cases',        'l’erreur ne dit rien : ça rougit et ça tremble', 'cases', true],
    ['b-cas', 'B · Le libellé parle',    '« CODE DU SALON » devient « CODE INTROUVABLE »', 'cases', true],
    ['c',     'C · Un seul champ',       'lettres très espacées, sans multiplier les boîtes', 'champ', true],
    ['d',     'D · Sans bouton',         'la quatrième lettre valide toute seule',          'cases', false],
    ['e',     'E · Le message au-dessus', 'un bandeau en surimpression, hors du flux',      'cases', true],
];

var BON = 'ABCD';
var grille = document.getElementById('grille');

grille.innerHTML = CAS.map(function (c) {
    var saisie = c[3] === 'cases'
        ? '<div class="saisie"><div class="cases">' +
            [0,1,2,3].map(function () { return '<span class="case"></span>'; }).join('') +
          '</div><input class="vrai" maxlength="4" autocomplete="off" spellcheck="false"></div>'
        : '<input class="champ" maxlength="4" autocomplete="off" spellcheck="false" placeholder="····">';

    return '<div class="cas ' + c[0] + '">' +
        '<div class="cadre"><div class="carte">' +
            '<span class="avis">Aucun salon à ce code</span>' +
            '<span class="label">Code du salon</span>' +
            saisie +
            (c[4] ? '<button class="b" disabled>Rejoindre</button>' : '') +
        '</div></div>' +
        '<span class="titre">' + c[1] + '<em>' + c[2] + '</em></span>' +
        '<span class="astuce">essaie <b>ABCD</b>, puis n’importe quoi d’autre</span>' +
    '</div>';
}).join('');

document.querySelectorAll('.cas').forEach(function (cas, i) {
    var carte = cas.querySelector('.carte');
    var label = cas.querySelector('.label');
    var avis  = cas.querySelector('.avis');
    var bouton = cas.querySelector('.b');
    var champ = cas.querySelector('.champ') || cas.querySelector('.vrai');
    var cases = [].slice.call(cas.querySelectorAll('.case'));
    var auto = !CAS[i][4];

    function peindre() {
        var v = champ.value.toUpperCase();
        champ.value = v;
        cases.forEach(function (b, k) {
            b.textContent = v[k] || '';
            b.classList.toggle('pleine', !!v[k]);
            b.classList.toggle('active', k === v.length && document.activeElement === champ);
        });
        if (bouton) bouton.disabled = v.length < 4;
    }

    function rater() {
        carte.classList.remove('ko');
        void carte.offsetWidth;
        carte.classList.add('ko');
        if (label && cas.classList.contains('b-cas')) label.textContent = 'Code introuvable';
        if (avis && cas.classList.contains('e')) {
            avis.classList.add('vu');
            setTimeout(function () { avis.classList.remove('vu'); }, 2200);
        }
        setTimeout(function () {
            carte.classList.remove('ko');
            if (label && cas.classList.contains('b-cas')) label.textContent = 'Code du salon';
        }, 1600);
        champ.value = '';
        peindre();
    }

    function valider() {
        if (champ.value.toUpperCase() === BON) {
            carte.style.borderColor = 'rgba(110,231,183,.5)';
            setTimeout(function () { carte.style.borderColor = ''; champ.value = ''; peindre(); }, 900);
        } else {
            rater();
        }
    }

    champ.addEventListener('input', function () {
        peindre();
        if (auto && champ.value.length === 4) setTimeout(valider, 120);
    });
    champ.addEventListener('focus', peindre);
    champ.addEventListener('blur', peindre);
    champ.addEventListener('keyup', function (e) { if (e.key === 'Enter' && champ.value.length === 4) valider(); });
    if (bouton) bouton.addEventListener('click', valider);
    cas.querySelector('.cadre').addEventListener('click', function () { champ.focus(); });
    peindre();
});

document.getElementById('mPc').addEventListener('click', function () {
    document.body.classList.remove('tel');
    this.classList.add('on'); document.getElementById('mTel').classList.remove('on');
});
document.getElementById('mTel').addEventListener('click', function () {
    document.body.classList.add('tel');
    this.classList.add('on'); document.getElementById('mPc').classList.remove('on');
});
</script>
</body>
</html>
