<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rush — cadres et minuteur</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   Les 308 portraits font 225 x 350. La boîte prend ce format : le
   cadre épouse donc l'image au pixel, sans bande ni rognage — c'est
   ce qui manquait à la première série de prototypes.
   ════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 2.5rem 1.5rem 5rem;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
    background: radial-gradient(70% 55% at 50% 0%, #16161d, #08080b 70%);
    min-height: 100vh;
}

h1 {
    margin: 0 0 0.4rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.06em;
}

.sous {
    margin: 0 0 2.2rem;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.42);
    max-width: 46rem;
    line-height: 1.55;
}

.barre {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1.2rem;
    margin-bottom: 2.6rem;
    padding: 0.9rem 1.1rem;
    border: 0.06rem solid rgba(255, 255, 255, 0.08);
    border-radius: 0.7rem;
    background: rgba(255, 255, 255, 0.02);
}

.barre label { font-size: 0.78rem; color: rgba(255, 255, 255, 0.5); }

.barre select, .barre button {
    font: inherit;
    font-size: 0.82rem;
    color: #fff;
    background: rgba(255, 255, 255, 0.07);
    border: 0.06rem solid rgba(255, 255, 255, 0.12);
    border-radius: 0.4rem;
    padding: 0.35rem 0.6rem;
    cursor: pointer;
}

.barre button:hover { background: rgba(255, 215, 0, 0.16); border-color: rgba(255, 215, 0, 0.4); }

.grille {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: 3rem 2.2rem;
}

.cas { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }

.titre {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.34);
    text-align: center;
}

.titre em {
    display: block;
    margin-top: 0.25rem;
    font-style: normal;
    font-weight: 400;
    font-size: 0.7rem;
    letter-spacing: 0;
    text-transform: none;
    color: rgba(255, 255, 255, 0.24);
}

/* La boîte au format exact du fichier */
.boite {
    position: relative;
    width: 13.5rem;
    aspect-ratio: 225 / 350;
    flex: 0 0 auto;
}

.boite img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 0.5rem;
}

/* Le tracé du minuteur, commun aux variantes qui font le tour */
.tour { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

.tour rect {
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 0;
    animation: vide var(--t, 8s) linear infinite;
}

@keyframes vide { to { stroke-dashoffset: 100; } }

/* Les minuteurs en trait droit */
.rail {
    position: absolute;
    overflow: hidden;
    border-radius: 2rem;
    background: rgba(255, 255, 255, 0.08);
    pointer-events: none;
}

.rail i {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 2rem;
    background: linear-gradient(90deg, #ff8c00, #ffd700);
    box-shadow: 0 0 0.5rem rgba(255, 190, 40, 0.55);
    transform-origin: left center;
    animation: draine var(--t, 8s) linear infinite;
}

@keyframes draine { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* ── A · Filet double, minuteur sur le filet extérieur ── */
.a img { border-radius: 0.35rem; }

.a::before, .a::after {
    content: '';
    position: absolute;
    border-radius: 0.45rem;
    pointer-events: none;
}

.a::before { inset: -0.28rem; border: 0.06rem solid rgba(255, 215, 0, 0.3); }
.a::after  { inset: -0.06rem; border: 0.06rem solid rgba(255, 255, 255, 0.12); }
.a .tour { inset: -0.28rem; }
.a .tour rect { stroke: #ffd700; stroke-width: 2; filter: drop-shadow(0 0 3px rgba(255, 200, 60, 0.7)); }

/* ── B · Passe-partout, minuteur dans la marge du bas ── */
.b {
    padding: 0.75rem 0.75rem 1.5rem;
    border-radius: 0.6rem;
    background: linear-gradient(165deg, #1c1a17, #100f12);
    box-shadow: 0 1rem 2.4rem rgba(0, 0, 0, 0.5), inset 0 0 0 0.06rem rgba(255, 255, 255, 0.07);
}

.b img { border-radius: 0.2rem; box-shadow: 0 0 0 0.06rem rgba(0, 0, 0, 0.6), 0 0.3rem 0.9rem rgba(0, 0, 0, 0.45); }
.b .rail { left: 0.75rem; right: 0.75rem; bottom: 0.62rem; height: 0.16rem; }

/* ── C · Équerres aux coins, elles s'éteignent ── */
.c img { border-radius: 0.25rem; }

.c span.eq {
    position: absolute;
    width: 1.5rem;
    height: 1.5rem;
    pointer-events: none;
    animation: retracte var(--t, 8s) linear infinite;
}

.c span.eq::before, .c span.eq::after {
    content: '';
    position: absolute;
    background: #ffd700;
    box-shadow: 0 0 0.4rem rgba(255, 200, 60, 0.6);
}

.c span.eq::before { width: 100%; height: 0.11rem; }
.c span.eq::after  { width: 0.11rem; height: 100%; }
.c .h-g { top: -0.3rem; left: -0.3rem; }
.c .h-d { top: -0.3rem; right: -0.3rem; transform: scaleX(-1); }
.c .b-g { bottom: -0.3rem; left: -0.3rem; transform: scaleY(-1); }
.c .b-d { bottom: -0.3rem; right: -0.3rem; transform: scale(-1); }

@keyframes retracte { from { opacity: 1; } to { opacity: 0.12; } }

/* ── D · Liseré fin et halo, minuteur sur le liseré ── */
.d img { border-radius: 0.4rem; }

.d::before {
    content: '';
    position: absolute;
    inset: -0.1rem;
    border-radius: 0.5rem;
    border: 0.06rem solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 0 1.6rem rgba(255, 190, 60, 0.16), 0 0 3.5rem rgba(255, 160, 40, 0.09);
    pointer-events: none;
}

.d .tour { inset: -0.1rem; }
.d .tour rect { stroke: #fff; stroke-width: 1.6; filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6)); }

/* ── E · Cartouche bas, minuteur dedans ── */
.e {
    padding: 0.4rem 0.4rem 1.9rem;
    border-radius: 0.5rem;
    background: #131217;
    box-shadow: inset 0 0 0 0.06rem rgba(255, 255, 255, 0.09);
}

.e img { border-radius: 0.25rem; }

.e .plaque {
    position: absolute;
    left: 0.4rem;
    right: 0.4rem;
    bottom: 0.4rem;
    height: 1.15rem;
    border-radius: 0.2rem;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent);
    pointer-events: none;
}

.e .rail { left: 0.75rem; right: 0.75rem; bottom: 0.88rem; height: 0.18rem; }

/* ── F · Rail intérieur en haut, dans la marge du cadre ── */
.f {
    padding: 0.95rem 0.45rem 0.45rem;
    border-radius: 0.5rem;
    background: #131217;
    box-shadow: inset 0 0 0 0.06rem rgba(255, 255, 255, 0.09);
}

.f img { border-radius: 0.25rem; }
.f .rail { left: 0.7rem; right: 0.7rem; top: 0.4rem; height: 0.16rem; }
</style>
</head>
<body>

<h1>Rush — cadres et minuteur</h1>
<p class="sous">
    La boîte a le format exact des fichiers (225&nbsp;×&nbsp;350) : le cadre épouse l'image au pixel,
    ce qui manquait à la première série. Chaque variante propose aussi un endroit différent pour le
    minuteur du portrait — le trait vertical à droite ne convenait pas.
</p>

<div class="barre">
    <label for="perso">Portrait</label>
    <select id="perso"></select>
    <label for="duree">Durée</label>
    <select id="duree">
        <option value="5">5 s</option>
        <option value="8" selected>8 s</option>
        <option value="10">10 s</option>
    </select>
    <button id="relancer">Relancer les minuteurs</button>
</div>

<div class="grille" id="grille"></div>

<script>
var PORTRAITS = ['luffy', 'gojo', 'naruto', 'levi', 'ichigo', 'zoro', 'asta'];

// Le tracé qui fait le tour : pathLength = 100 rend le décompte indépendant de
// la taille, un seul jeu de valeurs suffit à toutes les tailles d'écran.
var tour = '<svg class="tour" viewBox="0 0 100 156" preserveAspectRatio="none">'
         + '<rect x="1" y="1" width="98" height="154" rx="4" pathLength="100"></rect></svg>';

var CAS = [
    { c: 'a', t: 'A · Filet double',   d: 'le minuteur fait le tour du filet extérieur', in: tour },
    { c: 'b', t: 'B · Passe-partout',  d: 'minuteur dans la marge basse', in: '<span class="rail"><i></i></span>' },
    { c: 'c', t: 'C · Équerres',  d: 'les quatre coins s’éteignent',
      in: '<span class="eq h-g"></span><span class="eq h-d"></span><span class="eq b-g"></span><span class="eq b-d"></span>' },
    { c: 'd', t: 'D · Liseré et halo', d: 'le minuteur fait le tour du liseré', in: tour },
    { c: 'e', t: 'E · Cartouche bas',  d: 'minuteur dans le bandeau',
      in: '<span class="plaque"></span><span class="rail"><i></i></span>' },
    { c: 'f', t: 'F · Rail en haut',   d: 'minuteur dans la marge haute', in: '<span class="rail"><i></i></span>' }
];

var grille = document.getElementById('grille');
var selPerso = document.getElementById('perso');
var selDuree = document.getElementById('duree');

PORTRAITS.forEach(function (p) {
    var o = document.createElement('option');
    o.value = p;
    o.textContent = p;
    selPerso.appendChild(o);
});

function peindre() {
    var img = selPerso.value;
    grille.innerHTML = CAS.map(function (k) {
        return '<div class="cas"><div class="boite ' + k.c + '">'
             + '<img src="/rushpic/' + img + '.png" alt="" draggable="false">'
             + k.in + '</div>'
             + '<span class="titre">' + k.t + '<em>' + k.d + '</em></span></div>';
    }).join('');
    appliquerDuree();
}

function appliquerDuree() {
    var t = selDuree.value + 's';
    document.querySelectorAll('.boite').forEach(function (b) { b.style.setProperty('--t', t); });
}

// Redémarrer une animation CSS demande de la retirer puis de la remettre : une
// simple relecture du style ne suffit pas à la rembobiner.
function relancer() {
    document.querySelectorAll('.tour rect, .rail i, .eq').forEach(function (el) {
        var a = el.style.animationName;
        el.style.animationName = 'none';
        void el.offsetWidth;
        el.style.animationName = a || '';
    });
}

selPerso.addEventListener('change', peindre);
selDuree.addEventListener('change', function () { appliquerDuree(); relancer(); });
document.getElementById('relancer').addEventListener('click', relancer);

peindre();
</script>
</body>
</html>
