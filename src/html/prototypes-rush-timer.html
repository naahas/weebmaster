<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShonenMaster — Rush : le chrono</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/icon.png">
    <style>
        :root {
            --neon: #FFD700;
            --or: #f0c040;
            --txt: #fff;
            --txt2: #9a9aa2;
            --txt3: #5c5c66;
            --hp: #ff5a6e;
            --fond: #08080b;
            --carte: #101013;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--fond);
            color: var(--txt);
            min-height: 100vh;
            padding: 2rem 1.5rem 6rem;
        }

        .tete { max-width: 76rem; margin: 0 auto 2rem; }
        .tete h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 0.04em; line-height: 1; }
        .tete p { margin-top: 0.5rem; font-size: 0.85rem; color: var(--txt2); max-width: 46rem; line-height: 1.6; }

        .barre {
            position: sticky; top: 0; z-index: 50;
            max-width: 76rem; margin: 0 auto 2.5rem;
            display: flex; flex-wrap: wrap; align-items: center; gap: 1.4rem;
            padding: 0.9rem 1.2rem;
            background: rgba(16, 16, 19, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 0.9rem;
        }

        .reglage { display: flex; align-items: center; gap: 0.55rem; }
        .reglage > span {
            font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em;
            text-transform: uppercase; color: var(--txt3);
        }
        .barre input[type="range"] { width: 12rem; accent-color: var(--neon); }
        .gros {
            padding: 0.5rem 1.1rem; font-family: inherit; font-size: 0.75rem; font-weight: 700;
            color: #14100a; background: linear-gradient(135deg, #ffe066, var(--neon));
            border: none; border-radius: 2rem; cursor: pointer;
        }

        .grille {
            max-width: 76rem; margin: 0 auto;
            display: grid; gap: 1.1rem;
            grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
        }

        .carte {
            display: flex; flex-direction: column;
            background: var(--carte);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 0.9rem; overflow: hidden;
        }

        .carte-tete {
            display: flex; align-items: baseline; justify-content: space-between;
            gap: 0.7rem; padding: 0.85rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .carte-nom { font-size: 0.85rem; font-weight: 700; }
        .carte-note { font-size: 0.66rem; color: var(--txt3); text-align: right; line-height: 1.4; }

        .scene {
            flex: 1; display: grid; place-items: center;
            min-height: 13rem; padding: 2rem 1.2rem;
            background: radial-gradient(60% 70% at 50% 45%, rgba(255, 215, 0, 0.03), transparent 70%), #060608;
        }

        /* ══════════════════════════════════════════
           A · L'anneau actuel, pour comparaison
           ══════════════════════════════════════════ */
        .t-anneau { position: relative; display: grid; place-items: center; width: 6rem; height: 6rem; }
        .t-anneau svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
        .t-anneau circle { fill: none; stroke-width: 5; }
        .t-anneau .fond { stroke: rgba(255, 255, 255, 0.07); }
        .t-anneau .jauge {
            stroke: var(--neon); stroke-linecap: round;
            stroke-dasharray: 339.3;
            filter: drop-shadow(0 0 0.5rem rgba(255, 215, 0, 0.45));
            transition: stroke-dashoffset 0.25s linear, stroke 0.4s ease;
        }
        .t-anneau .n {
            position: relative; font-family: 'Bebas Neue', sans-serif;
            font-size: 2.4rem; line-height: 1; color: #fff;
            text-shadow: 0 0 1.2rem rgba(255, 215, 0, 0.4);
        }

        /* ══════════════════════════════════════════
           B · Barre pleine largeur, collée en haut
           ══════════════════════════════════════════ */
        .t-barre { position: relative; width: 100%; }
        .t-barre .rail { height: 0.35rem; width: 100%; background: rgba(255, 255, 255, 0.06); border-radius: 2rem; overflow: hidden; }
        .t-barre .rempli {
            height: 100%; border-radius: 2rem;
            background: linear-gradient(90deg, #ff8c00, var(--neon));
            box-shadow: 0 0 0.9rem rgba(255, 190, 40, 0.6);
            transform-origin: left center;
            transition: transform 0.25s linear, background 0.4s ease;
        }
        .t-barre .n {
            display: block; margin-top: 0.7rem; text-align: center;
            font-family: 'Bebas Neue', sans-serif; font-size: 2rem; line-height: 1;
            color: rgba(255, 255, 255, 0.85);
        }
        .t-barre.rouge .rempli { background: linear-gradient(90deg, #ff2d55, #ff5a6e); box-shadow: 0 0 0.9rem rgba(255, 90, 110, 0.7); }
        .t-barre.rouge .n { color: #ff8a97; }

        /* ══════════════════════════════════════════
           C · Chiffre seul, gros, avec un souffle
           ══════════════════════════════════════════ */
        .t-nu { position: relative; display: grid; place-items: center; }
        .t-nu .n {
            font-family: 'Bebas Neue', sans-serif; font-size: 5.5rem; line-height: 0.85;
            color: #fff; letter-spacing: -0.02em;
            text-shadow: 0 0 2.2rem rgba(255, 215, 0, 0.32);
            font-variant-numeric: tabular-nums;
        }
        .t-nu .l {
            display: block; text-align: center; margin-top: 0.2rem;
            font-size: 0.55rem; font-weight: 700; letter-spacing: 0.3em;
            text-transform: uppercase; color: rgba(255, 255, 255, 0.22);
        }
        .t-nu.rouge .n { color: #ff8a97; text-shadow: 0 0 2.4rem rgba(255, 90, 110, 0.5); }
        .t-nu.rouge { animation: souffle 1s ease-in-out infinite; }
        @keyframes souffle { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

        /* ══════════════════════════════════════════
           D · Arc large et plat, chiffre au creux
           ══════════════════════════════════════════ */
        .t-arc { position: relative; width: 11rem; height: 6rem; }
        .t-arc svg { width: 100%; height: 100%; overflow: visible; }
        .t-arc path { fill: none; stroke-width: 7; stroke-linecap: round; }
        .t-arc .fond { stroke: rgba(255, 255, 255, 0.06); }
        .t-arc .jauge {
            stroke: var(--neon);
            stroke-dasharray: 251.3;
            filter: drop-shadow(0 0 0.6rem rgba(255, 215, 0, 0.5));
            transition: stroke-dashoffset 0.25s linear, stroke 0.4s ease;
        }
        .t-arc .n {
            position: absolute; left: 0; right: 0; bottom: 0.2rem; text-align: center;
            font-family: 'Bebas Neue', sans-serif; font-size: 3rem; line-height: 1; color: #fff;
        }
        .t-arc.rouge .jauge { stroke: var(--hp); filter: drop-shadow(0 0 0.7rem rgba(255, 90, 110, 0.6)); }
        .t-arc.rouge .n { color: #ff8a97; }

        /* ══════════════════════════════════════════
           E · Sablier de segments
           ══════════════════════════════════════════ */
        .t-seg { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
        .t-seg .rangee { display: flex; gap: 0.22rem; }
        .t-seg i {
            display: block; width: 0.32rem; height: 1.8rem; border-radius: 2rem;
            background: rgba(255, 255, 255, 0.08);
            transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
        }
        .t-seg i.on {
            background: var(--neon);
            box-shadow: 0 0 0.5rem rgba(255, 215, 0, 0.5);
        }
        .t-seg.rouge i.on { background: var(--hp); box-shadow: 0 0 0.5rem rgba(255, 90, 110, 0.6); }
        .t-seg .n { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; line-height: 1; color: rgba(255,255,255,0.85); }
        .t-seg.rouge .n { color: #ff8a97; }

        /* ══════════════════════════════════════════
           F · Anneau double, chiffre décalé
           ══════════════════════════════════════════ */
        .t-double { position: relative; display: grid; place-items: center; width: 7rem; height: 7rem; }
        .t-double svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
        .t-double circle { fill: none; }
        .t-double .ext { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1.5; }
        .t-double .fond { stroke: rgba(255, 255, 255, 0.06); stroke-width: 3; }
        .t-double .jauge {
            stroke: var(--neon); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 301.6;
            transition: stroke-dashoffset 0.25s linear, stroke 0.4s ease;
        }
        .t-double .n {
            position: relative; font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem; line-height: 1; color: #fff;
        }
        .t-double .l {
            position: absolute; bottom: 0.9rem; left: 0; right: 0; text-align: center;
            font-size: 0.45rem; font-weight: 700; letter-spacing: 0.26em;
            text-transform: uppercase; color: rgba(255, 255, 255, 0.25);
        }
        .t-double.rouge .jauge { stroke: var(--hp); }
        .t-double.rouge .n { color: #ff8a97; }
    </style>
</head>

<body>
    <div class="tete">
        <h1>Rush — le chrono de la manche</h1>
        <p>
            C'est le seul repère qui compte pendant les soixante secondes : il doit se lire d'un
            regard sans jamais voler l'attention au portrait. Six façons de le poser. Le curseur
            fait défiler le temps, le bouton relance une manche complète.
        </p>
    </div>

    <div class="barre">
        <button class="gros" id="rejouer">Rejouer une manche</button>
        <div class="reglage">
            <span>Temps restant</span>
            <input type="range" id="temps" min="0" max="60" value="43">
            <span id="valeur" style="color:var(--neon);font-family:'Bebas Neue';font-size:1.2rem">43</span>
        </div>
        <div class="reglage">
            <span>Durée</span>
            <select id="duree" style="background:rgba(255,255,255,.06);color:#fff;border:none;padding:.35rem .6rem;border-radius:.4rem;font-family:inherit">
                <option>30</option><option selected>60</option><option>90</option>
            </select>
        </div>
    </div>

    <div class="grille" id="grille"></div>

    <script>
        // Le seuil d'urgence : les dix dernières secondes
        const URGENCE = 10;

        const VARIANTES = [
            ['anneau', 'A · Anneau', "Celui d'aujourd'hui,<br>pour comparaison"],
            ['barre', 'B · Barre', "Collée en haut de l'écran,<br>elle ne prend aucune place"],
            ['nu', 'C · Chiffre nu', "Rien d'autre que le nombre,<br>qui souffle à la fin"],
            ['arc', 'D · Arc', "Large et plat : il occupe<br>le haut sans faire un rond"],
            ['seg', 'E · Segments', "Le temps s'égrène,<br>on voit les traits tomber"],
            ['double', 'F · Anneau double', "Le fin cerne le gros :<br>écho de la pastille joueur"],
        ];

        const gabarits = {
            anneau: () => `
                <div class="t-anneau">
                    <svg viewBox="0 0 120 120">
                        <circle class="fond" cx="60" cy="60" r="54"/>
                        <circle class="jauge" cx="60" cy="60" r="54"/>
                    </svg>
                    <span class="n">0</span>
                </div>`,
            barre: () => `
                <div class="t-barre">
                    <div class="rail"><div class="rempli"></div></div>
                    <span class="n">0</span>
                </div>`,
            nu: () => `
                <div class="t-nu">
                    <span class="n">0</span>
                    <span class="l">secondes</span>
                </div>`,
            arc: () => `
                <div class="t-arc">
                    <svg viewBox="0 0 180 100">
                        <path class="fond" d="M10 92a80 80 0 0 1 160 0"/>
                        <path class="jauge" d="M10 92a80 80 0 0 1 160 0"/>
                    </svg>
                    <span class="n">0</span>
                </div>`,
            seg: () => `
                <div class="t-seg">
                    <div class="rangee">${'<i></i>'.repeat(20)}</div>
                    <span class="n">0</span>
                </div>`,
            double: () => `
                <div class="t-double">
                    <svg viewBox="0 0 120 120">
                        <circle class="ext" cx="60" cy="60" r="57"/>
                        <circle class="fond" cx="60" cy="60" r="48"/>
                        <circle class="jauge" cx="60" cy="60" r="48"/>
                    </svg>
                    <span class="n">0</span>
                    <span class="l">restantes</span>
                </div>`,
        };

        const grille = document.getElementById('grille');
        for (const [cle, nom, note] of VARIANTES) {
            const carte = document.createElement('div');
            carte.className = 'carte';
            carte.innerHTML = `
                <div class="carte-tete">
                    <span class="carte-nom">${nom}</span>
                    <span class="carte-note">${note}</span>
                </div>
                <div class="scene" data-cle="${cle}">${gabarits[cle]()}</div>`;
            grille.appendChild(carte);
        }

        const temps = document.getElementById('temps');
        const duree = document.getElementById('duree');
        const valeur = document.getElementById('valeur');

        function rendre() {
            const d = parseInt(duree.value, 10);
            temps.max = d;
            const reste = Math.min(parseInt(temps.value, 10), d);
            const part = d ? reste / d : 0;          // 1 au départ, 0 à la fin
            const urgent = reste <= URGENCE;
            valeur.textContent = reste;

            document.querySelectorAll('.scene').forEach(scene => {
                const boite = scene.firstElementChild;
                boite.classList.toggle('rouge', urgent);
                const n = boite.querySelector('.n');
                if (n) n.textContent = reste;

                const cle = scene.dataset.cle;
                if (cle === 'anneau') {
                    boite.querySelector('.jauge').style.strokeDashoffset = 339.3 * (1 - part);
                } else if (cle === 'barre') {
                    boite.querySelector('.rempli').style.transform = 'scaleX(' + part + ')';
                } else if (cle === 'arc') {
                    boite.querySelector('.jauge').style.strokeDashoffset = 251.3 * (1 - part);
                } else if (cle === 'double') {
                    boite.querySelector('.jauge').style.strokeDashoffset = 301.6 * (1 - part);
                } else if (cle === 'seg') {
                    const traits = boite.querySelectorAll('i');
                    const allumes = Math.ceil(part * traits.length);
                    traits.forEach((t, i) => t.classList.toggle('on', i < allumes));
                }
            });
        }

        temps.addEventListener('input', rendre);
        duree.addEventListener('change', () => { temps.value = duree.value; rendre(); });

        // Une manche complète, en accéléré : c'est le seul moyen de juger le
        // passage au rouge et la fin.
        let course = null;
        document.getElementById('rejouer').addEventListener('click', () => {
            clearInterval(course);
            const d = parseInt(duree.value, 10);
            let reste = d;
            temps.value = reste; rendre();
            course = setInterval(() => {
                reste -= 1;
                temps.value = Math.max(0, reste);
                rendre();
                if (reste <= 0) clearInterval(course);
            }, 1000 / 4);          // quatre fois plus vite que la réalité
        });

        rendre();
    </script>
</body>

</html>
