<style>:root{

  .puce.hard{color:#ff6400}.puce.veryhard{color:#ff3232}.puce.extreme{color:#c77dff}

Un melon Yubari violet","Une pomme violette","Un ananas violet","Une prune géante","Un raisin géant","Une figue violette"],"src":"Le Gomu Gomu no Mi ressemble à un melon Yubari violet avec les tourbillons typiques des Fruits du Démon dessinés dessus. L'intérieur du Fruit est vert."},{"g":"Luffy — le fruit","d":"extreme","t":"Qu'est-ce qui rend Nika unique parmi les créatures des Zoan Mythiques ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Gomu_Gomu_no_Mi","b":1,"r":["C'est une divinité propre à la mythologie de One Piece","C'est le seul dieu vivant encore en vie","C'est le seul Zoan Mythique sans forme animale","C'est le seul à avoir été mangé deux fois","C'est une invention du Gouvernement Mondial","C'est le seul Zoan capable de parler"],"src":"« Nika » est le nom du dieu du soleil Nika, qui contrairement aux autres créatures représentés par les Zoan Mythiques, est propre à la mythologie de One Piece.","n":"Les autres Zoan Mythiques puisent dans des mythologies RÉELLES (phénix, dragon oriental…). Nika, non."},{"g":"Luffy — le fruit","d":"hard","t":"Comment fonctionne le Gear 2 de Luffy ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Gomu_Gomu_no_Mi","b":1,"r":["Il étire ses vaisseaux sanguins pour accélérer son flux sanguin","Il insuffle de l'air dans ses os","Il durcit sa peau avec le Haki","Il comprime ses muscles","Il accélère son rythme cardiaque par la volonté","Il réduit son poids corporel"],"src":"Soit en étirant ses vaisseaux sanguins, en créant un effet de pompe avec ses jambes, ce qui permet d'augmenter le flux sanguin, rendant Luffy plus rapide donc plus puissant."},{"g":"Luffy — le fruit","d":"hard","t":"Que Luffy insuffle-t-il dans ses os pour déclencher le Gear 3 ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Gomu_Gomu_no_Mi","b":1,"r":["De l'air","Du sang","Du Haki","De l'eau de mer","De la fumée","Rien, il gonfle ses muscles"],"src":"Soit en insufflant de l'air dans ses os (« Hone Fuusen ») afin d'augmenter le eureux de faire."},{"g":"Luffy — la création","d":"hard","t":"Dans quel one-shot Luffy est-il apparu pour la première fois, avant le début de One Piece ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Divers","b":1,"r":["Romance Dawn","Wanted!","Monsters","God's Gift for the Future","Ikki Yakô","Cross Epoch"],"src":"Luffy fit sa première apparition en tant que protagoniste principal dans le premier pilote de One Piece, Romance Dawn Vol. 1."},{"g":"Luffy — la création","d":"extreme","t":"Combien de versions de Romance Dawn Oda a-t-il réalisées ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Divers","b":1,"r":["Trois","Deux","Une","Quatre","Cinq","Six"],"src":"Il demeura le protagoniste principal dans la seconde sortie de Romance Dawn, Romance Dawn Vol. 2, et dans la version finale, Romance Dawn Vol. 3."},{"g":"Luffy — la création","d":"extreme","t":"Quel genre de pirate Luffy voulait-il être dans la première version de Romance Dawn ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Divers","b":1,"r":["Un pirate pacificateur","Un pirate chasseur de primes","Un pirate marchand","Un pirate justicier","Un pirate explorateur","Le roi des pirates, déjà"],"src":"Il dit qu'il voulait être candidat pour être pirate et, plus spécifiquement, un pirate pacificateur."},{"g":"Luffy — la création","d":"extreme","t":"Dans la première version de Romance Dawn, qu'est-ce qui avait emporté le bras de Shanks ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Divers","b":1,"r":["Un requin","Un Monstre Marin","Un Roi des Mers","Un boulet de canon","Une explosion","Rien, il avait ses deux bras"],"src":"Une autre différence est que le bras de Shanks fut mangé par un requin au lieu d'un Monstre Marin."},{"g":"Luffy — la création","d":"extreme","t":"Qu'est-ce que la première version de Romance Dawn contient d'unique dans toute l'œuvre d'Oda ?","s":"One Piece","p":"https://onepiece.fandom.co rotagoniste d'un concept d'Oda, très semblable à Luffy et coiffé d'un bandeau au motif du Gomu Gomu no Mi ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Divers","b":1,"r":["Monkey D. Pao","Monkey D. Land","Monkey D. Gum","Monkey D. Dawn","Monkey D. Nika","Monkey D. Joy"],"src":"son concept futur aurait mis en scène un protagoniste nommé « Monkey D. Pao », lui aussi très semblable à Luffy ; il porte un bandeau dont le design est identique à celui du Gomu Gomu no Mi de Luffy."},{"g":"Luffy — manga vs anime","d":"veryhard","t":"Quelle scène du passé de Luffy l'anime a-t-il supprimée ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Divers","b":1,"r":["Celle où il se poignarde sous l'œil pour prouver son courage","Celle où Shanks lui donne son chapeau","Celle où il rencontre Ace","Celle où Higuma l'enlève","Celle où Garp l'abandonne à Dadan","Celle où il mange le fruit"],"src":"Dans l'anime, le passé de Luffy n'inclut pas la scène où il se poignarde sous l'œil gauche afin de prouver à Shanks qu'il était un homme."},{"g":"Luffy — manga vs anime","d":"extreme","t":"Pourquoi Shanks surnomme-t-il Luffy « l'ancre » dans le manga ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Divers","b":1,"r":["Parce qu'il ne savait pas nager, même avant de manger le fruit","Parce qu'il était trop lourd pour son âge","Parce qu'il refusait de quitter le village","Parce qu'il s'accrochait toujours à son bateau","Parce qu'il coulait quand il buvait","Parce qu'il portait une ancre tatouée"],"src":"Aussi dans le manga, Luffy ne pouvait nager, même avant qu'il ne mange le fruit du démon, ce qui explique pourquoi Shanks l'appelle l'« ancre », d'où la chemise que portait Luffy.","n":"C'est aussi ce qui explique le motif d'<b>ancre</b> sur sa chemise d'enfant."},{"g":"Luffy — manga vs anime","d":"extreme","t":"Comment Luffy arrête-t-il l'anneau tranchant de Jango dans l'anime, à la différence du manga ?","s":"One Piec sur Zo, ils pouvaient eux aussi entendre et même s'entretenir avec une voix."},{"g":"Luffy — exploits","d":"extreme","t":"Quelle créature légendaire vivant mille ans Luffy parvient-il à comprendre ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Aptitudes_et_Comp%C3%A9tences","b":1,"r":["Un Dragon Millénaire","Un Roi des Mers","Un Éléphant Millénaire","Un Monstre Marin ancien","Une baleine-île","Un Serpent des Abysses"],"src":"son instinct lui permet de comprendre ce que raconte un Dragon Millénaire, un dragon légendaire vivant 1 000 ans, dans l'Arc de l'île du Vaisseau de Guerre."},{"g":"Luffy — exploits","d":"extreme","t":"Comment Luffy s'est-il sorti du piège de Rob Lucci qui l'avait coincé entre deux immeubles ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Aptitudes_et_Comp%C3%A9tences","b":1,"r":["Il a écarté les deux immeubles à la force des bras","Il s'est étiré pour passer par-dessus","Il a creusé sous les fondations","Il a utilisé le Gear 3","Zoro est venu le libérer","Il s'est dégonflé pour glisser"],"src":"La démonstration de force pure la plus effroyable dont il a fait preuve est celle où il explosa, en les écartant, deux immeubles entre lesquels Rob Lucci l'avait envoyé se coincer."},{"g":"Luffy — exploits","d":"veryhard","t":"À qui Luffy doit-il sa force physique de base, au début de la série ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy/Aptitudes_et_Comp%C3%A9tences","b":1,"r":["À l'entraînement que Garp lui a fait subir","À son fruit du démon","Aux travaux chez Dadan","À son sang de D.","À l'entraînement d'Ace","À Rayleigh"],"src":"On suppose que la force de base de Luffy, celle qu'il avait au début de la série, est due à l'entraînement que Garp lui a fait subir."},{"g":"Luffy — le personnage","d":"medium","t":"Quel poste occupe Monkey D. Dragon, le père de Luffy ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy","b":1,"r":["Chef de l'Armée Révolutionnaire","Amiral de la Marine","Roi d'un royaume du Nouveau Monde","Chef du Gouvernement Mondial","Empereur","Commandant du CP0"],"src":"Il est le fils du chef de l'Armée Révolutionnaire, Monkey D. Dragon."},{"g":"Luffy — le personnage","d":"hard","t":"Qui a élevé Luffy, en tant que mère adoptive ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy","b":1,"r":["Curly Dadan, une bandit des montagnes","Makino, la tenancière du bar","Bell-mère","Kureha","Nojiko","Personne, il a grandi seul"],"src":"le fils adoptif d'une bandit des montagnes, Curly Dadan."},{"g":"Luffy — le personnage","d":"veryhard","t":"À qui appartenait le chapeau de paille avant Shanks ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy","b":1,"r":["Gol D. Roger","Joy Boy","Rayleigh","Le père de Shanks","Barbe Blanche","Kozuki Oden"],"src":"le légendaire capitaine pirate Shanks « le Roux » lui a confié lorsqu'il était jeune, ce dernier le tenant lui-même de Roger."},{"g":"Luffy — le personnage","d":"hard","t":"Quel geste de Luffy à Enies Lobby équivaut à une déclaration de guerre au Gouvernement Mondial ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy","b":1,"r":["Il a fait brûler son drapeau","Il a détruit le Porte du Jugement","Il a libéré tous les prisonniers","Il a frappé un Dragon Céleste","Il a coulé un navire amiral","Il a volé un ponéglyphe"],"src":"Il est aussi célèbre pour avoir fait brûler le drapeau du Gouvernement Mondial à Enies Lobby, déclarant ainsi la guerre à ce dernier."},{"g":"Luffy — le personnage","d":"veryhard","t":"Pourquoi Luffy refuse-t-il de prendre la tête de l'armada de Chapeau de Paille ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy","b":1,"r":["Il ne veut pas priver les autres de leur liberté","Il trouve l'armada trop faible","Il refuse toute responsabilité","Il veut rester discret face à la Marine","Zoro le lui a déconseillé","Il n'en connaît même pas l'existence"],"src":"C'est également le fondateur involontaire de l'armada de Chapeau de Paille, même s'il refuse cependant d'en être à la tête, ne désirant pas priver les autres de leur liberté."},{"g":"Luffy — le personnage","d":"medium","t":"Comment Luffy définit-il ce que signifie devenir le Roi des Pirates ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy","b":1,"r":["Devenir la personne la plus libre qui soit","Posséder le plus grand trésor du monde","Régner sur toutes les mers","Vaincre les quatre Empereurs","Réunir tous les ponéglyphes","Surpasser Gol D. Roger au combat"],"src":"Selon lui, ce rêve se concrétisera, en devenant la personne la plus libre qui soit."},{"g":"Luffy — le personnage","d":"hard","t":"Lequel de ces Grands Corsaires Luffy n'a-t-il PAS vaincu ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy","b":1,"r":["Bartholomew Kuma","Crocodile","Gecko Moria","Doflamingo","Aucun, il les a tous vaincus","Boa Hancock"],"src":"pour avoir vaincu plusieurs des sept grands corsaires (Crocodile, Gecko Moria et Doflamingo)."},{"g":"Luffy — le personnage","d":"veryhard","t":"Lesquels des quatre Empereurs Luffy a-t-il osé défier ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Monkey_D._Luffy","b":1,"r":["Big Mom et Kaido","Barbe Noire et Kaido","Shanks et Big Mom","Barbe Blanche et Kaido","Kaido seul","Les quatre"],"src":"en étant allé jusqu'à défier deux des quatre Empereurs (Big Mom et Kaido)."},{"g":"Luffy — le fruit","d":"extreme","t":"De quel type de mot japonais « Gomu » est-il un exemple ?","s":"One Piece","p":"https://onepiece.fandom.com/fr/wiki/Gomu_Gomu_no_Mi","b":1,"r":["Un wasei-eigo, un anglicisme créé au Japon","Un kanji d'origine chinoise","Un onomatopée pure","Un mot d'origine portugaise","Un ancien mot d'Okinawa","Un néologisme inventé par Oda"],"src":"Il provient de « gum » en anglais signifiant « gomme » ou désignant une matière élastique. Le glissement sémantique fait de « Gomu » un wasei-eigo (anglicisme créé au Japon)."}];
const LIB = {"veryeasy":"Very Easy","easy":"Easy","medium":"Medium","hard":"Hard","veryhard":"Very Hard","extreme":"Extreme"};
const ORDRE = ["veryeasy","easy","medium","hard","veryhard","extreme"];
function copier(txt, bouton) {
  navigator.clipboard.writeText(txt).then(() => {
    const av = bouton.textContent;
    bouton.textContent = '✓'; bouton.classList.add('ok');
    setTimeout(() => { bouton.textContent = av; bouton.classList.remove('ok'); }, 800);
  });
}

function champ(etiq, valeur, classe) {
  const d = document.createElement('div'); d.className = 'champ';
  d.innerHTML = '<span class="etiq">' + etiq + '</span><span class="val ' + (classe || '') + '"></span>';
  d.children[1].textContent = valeur;
  const b = document.createElement('button'); b.className = 'c'; b.textContent = 'copier';
  b.onclick = () => copier(valeur, b);
  d.appendChild(b);
  return d;
}

const liste = document.getElementById('liste');

QUESTIONS.forEach((q, i) => {
  const c = document.createElement('div');
  c.className = 'q'; c.id = 'q' + i;
  c.dataset.d = q.d; c.dataset.g = q.g || 'divers';

  const tete = document.createElement('div'); tete.className = 'tete';
  tete.innerHTML = '<span class="num">' + (i + 1) + '</span>'
                 + '<span class="diff ' + q.d + '">' + LIB[q.d] + '</span>'
                 + '<span class="grappe">' + (q.g || '') + '</span>';
  const lab = document.createElement('label'); lab.className = 'coche';
  const cb = document.createElement('input'); cb.type = 'checkbox';
  cb.onchange = () => { c.classList.toggle('fait', cb.checked); sauver(); compter(); };
  lab.appendChild(cb); lab.appendChild(document.createTextNode('saisie'));
  tete.appendChild(lab); c.appendChild(tete);

  c.appendChild(champ('Texte', q.t));
  c.appendChild(champ('Série', q.s || 'Naruto'));
  c.appendChild(champ('Preuve', q.p, 'url'));
  c.appendChild(champ('Difficulté', LIB[q.d]));
  c.appendChild(champ('Bonne rép.', String(q.b)));
  c.appendChild(champ('Spoil', q.sp ? 'OUI' : 'non'));

  const reps = document.createElement('div'); reps.className = 'reps';
  q.r.forEach((r, k) => {
    const l = document.createElement('div');
    l.className = 'rep' + (k + 1 === q.b ? ' bonne' : '');
    l.innerHTML = '<span class="i">' + (k + 1) + '</span><span class="t"></span>';
    l.children[1].textContent = r;
    const b = document.createElement('button'); b.className = 'c'; b.textContent = 'copier';
    b.onclick = () => copier(r, b);
    l.appendChild(b); reps.appendChild(l);
  });
  c.appendChild(reps);

  const s = document.createElement('div'); s.className = 'src';
  s.textContent = '« ' + q.src + ' »';
  c.appendChild(s);

  if (q.n) { const n = document.createElement('div'); n.className = 'note'; n.innerHTML = q.n; c.appendChild(n); }
  liste.appendChild(c);
});

// ── barre de comptage ──
const parD = {}; QUESTIONS.forEach(q => parD[q.d] = (parD[q.d] || 0) + 1);
document.getElementById('barre').innerHTML =
  ORDRE.filter(d => parD[d]).map(d => '<span class="puce ' + d + '">' + LIB[d] + ' ' + parD[d] + '</span>').join('')
  + '<span class="puce" id="reste"></span>';

// ── filtres par grappe ──
const grappes = [...new Set(QUESTIONS.map(q => q.g || 'divers'))];
const fz = document.getElementById('filtres');
const btnTout = document.createElement('button');
btnTout.className = 'f actif'; btnTout.textContent = 'tout (' + QUESTIONS.length + ')';
btnTout.onclick = () => filtrer(null, btnTout);
fz.appendChild(btnTout);
grappes.forEach(g => {
  const n = QUESTIONS.filter(q => (q.g || 'divers') === g).length;
  const b = document.createElement('button');
  b.className = 'f'; b.textContent = g + ' (' + n + ')';
  b.onclick = () => filtrer(g, b);
  fz.appendChild(b);
});
function filtrer(g, bouton) {
  document.querySelectorAll('.f').forEach(x => x.classList.remove('actif'));
  bouton.classList.add('actif');
  document.querySelectorAll('.q').forEach(c => {
    c.style.display = (!g || c.dataset.g === g) ? '' : 'none';
  });
}

function sauver() {
  const etat = [...document.querySelectorAll('.coche input')].map(x => x.checked);
  try { localStorage.setItem('qsaisies2', JSON.stringify(etat)); } catch (e) {}
}
function compter() {
  const n = [...document.querySelectorAll('.coche input')].filter(x => !x.checked).length;
  const el = document.getElementById('reste');
  if (el) el.textContent = n + ' restante' + (n > 1 ? 's' : '');
}
try {
  const etat = JSON.parse(localStorage.getItem('qsaisies2') || '[]');
  document.querySelectorAll('.coche input').forEach((x, i) => {
    if (etat[i]) { x.checked = true; x.closest('.q').classList.add('fait'); }
  });
} catch (e) {}
compter();

</script></body></html>
