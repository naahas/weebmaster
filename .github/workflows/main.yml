name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 10 * * 2,4,6'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          echo "Pinging Supabase..."
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/keep_alive" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')
          if [ "$HTTP_CODE" -ne 201 ] && [ "$HTTP_CODE" -ne 200 ]; then
            echo "Insert failed with HTTP $HTTP_CODE"
            cat /tmp/response.txt
            exit 1
          fi
          echo "Ping inserted (HTTP $HTTP_CODE)"
          CUTOFF=$(date -u -d '30 days ago' +"%Y-%m-%dT%H:%M:%SZ")
          curl -s -X DELETE \
            "${SUPABASE_URL}/rest/v1/keep_alive?pinged_at=lt.${CUTOFF}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            > /dev/null
          echo "Cleanup done (entries older than ${CUTOFF})"
          echo "Supabase kept alive successfully"
